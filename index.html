<script>
/* ================= helpers ================= */
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, html) => { const e=document.createElement(tag); for(const k in attrs){ if(k==='class') e.className=attrs[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } if(html!==undefined) e.innerHTML=html; return e; };
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const store = { get(k,d){ try{ const v=localStorage.getItem('cs4394:'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{localStorage.setItem('cs4394:'+k, JSON.stringify(v));}catch(e){} } };
const money = n => '$' + Math.round(n).toLocaleString('en-US');

/* ============ bilingual helpers ============ */
let LANG = store.get('lang','both'); // 'en' | 'both' | 'zh'
// short UI label, inline
const T = (en, zh) => LANG==='en' ? en : LANG==='zh' ? `<span class="zhi" lang="zh-Hant-HK">${zh}</span>` : `${en}<span class="zhi" lang="zh-Hant-HK">${zh}</span>`;
// plain text (for textContent / attributes)
const Tp = (en, zh) => LANG==='en' ? en : LANG==='zh' ? zh : `${en} ${zh}`;
// a block of content: Chinese on its own line underneath
const bi = (en, zh) => { if(!zh || LANG==='en') return en; if(LANG==='zh') return zh; return `${en}<span class="zh" lang="zh-Hant-HK">${zh}</span>`; };
const BLOCK = new Set(['P','UL','OL','LI','TABLE','TBODY','THEAD','TR','TD','TH','DIV','DETAILS','SUMMARY','H1','H2','H3','H4']);
const hasBlockChild = n => [...n.children].some(c=>BLOCK.has(c.tagName));
const hasText = n => [...n.childNodes].some(c=>c.nodeType===3 && c.textContent.trim());
function zipNode(en, zh){
  if(!hasBlockChild(en) && !hasBlockChild(zh)){ // leaf: append the Chinese line inside it
    const zt=zh.textContent.trim(); if(!zt || zt===en.textContent.trim()) return;
    const s=document.createElement('span'); s.className='zh'; s.lang='zh-Hant-HK'; s.innerHTML=zh.innerHTML; en.appendChild(s); return;
  }
  const ec=[...en.children], zc=[...zh.children];
  if(!hasText(en) && !hasText(zh) && ec.length===zc.length && ec.every((c,i)=>c.tagName===zc[i].tagName)){ ec.forEach((c,i)=>zipNode(c,zc[i])); return; }
  // structures differ: add the whole Chinese block after the English
  const d=document.createElement('div'); d.className='zh zh-blk'; d.lang='zh-Hant-HK'; d.innerHTML=zh.innerHTML; d.querySelectorAll('.latfig').forEach(x=>x.remove());
  const enTables=[...en.querySelectorAll('table')].map(t=>t.textContent.trim());
  d.querySelectorAll('table').forEach(t=>{ if(enTables.includes(t.textContent.trim())) (t.closest('.scroll')||t).remove(); });
  en.appendChild(d);
}
function biHTML(en, zh){
  if(!zh || LANG==='en') return en; if(LANG==='zh') return zh;
  const a=document.createElement('div'), b=document.createElement('div'); a.innerHTML=en; b.innerHTML=zh; zipNode(a,b); return a.innerHTML;
}

/* ============ security label logic ============ */
// A label is {l: levelIndex, c: Set of categories}; levels: ordered array of names
function dom(a, b){ if(a.l < b.l) return false; for(const x of b.c) if(!a.c.has(x)) return false; return true; }
function cmp(a, b){ const ab=dom(a,b), ba=dom(b,a); if(ab&&ba) return 'equal'; if(ab) return 'A'; if(ba) return 'B'; return 'none'; }
function blpPerm(s,o){ const r=dom(s,o), w=dom(o,s); return r&&w?'RW':r?'R':w?'W':'-'; }
function bibaPerm(s,o){ const r=dom(o,s), w=dom(s,o); return r&&w?'RW':r?'R':w?'W':'-'; } // read up, write down
function L(levels, lv, cats){ return {l: levels.indexOf(lv), c: new Set(cats)}; }
function fmt(levels, lab){ const c=[...lab.c]; return '(' + levels[lab.l] + ', {' + c.join(',') + '})'; }

const EASY = {
/* ---------- WEEK 1 ---------- */
w1t1: `<p>Think of your <b>house</b>.</p>
<ul><li><b>Asset</b> = what you care about: your laptop inside the house.</li>
<li><b>Vulnerability</b> = a weakness: a window that doesn't lock.</li>
<li><b>Threat</b> = something that <i>could</i> hurt you: burglars in the neighbourhood.</li>
<li><b>Attack</b> = it actually happens: a burglar climbs through the broken window and takes the laptop.</li>
<li><b>Countermeasure</b> = what you do about it: fix the lock, add an alarm.</li></ul>
<p><b>Risk</b> = the chance the burglar uses the weak window to get the laptop. No house is 100% safe, so you <i>manage</i> the risk instead of eliminating it.</p>
<p class="memo">Memory line: a threat <i>might</i> happen, an attack <i>did</i> happen, a vulnerability is <i>your</i> weak spot.</p>`,

w1t2: `<p>Risk management is like preparing for a typhoon in three steps:</p>
<ol><li><b>Identify</b>: What could go wrong? ("Windows could break, the basement could flood.")</li>
<li><b>Assess</b>: How likely is it, and how bad would it be? ("Flooding happens every year and costs a lot; broken windows are rare.")</li>
<li><b>Treat</b>: Decide what to do about each one. ("Put sandbags at the basement, buy insurance for the windows.")</li></ol>
<p>The <b>Ford Pinto</b> story shows what goes wrong if the "assess" step only counts money. Ford calculated that fixing the fuel tank cost more than paying for deaths and injuries, so they didn't fix it. That ignored ethics, lawsuits and reputation, and it was a disaster.</p>
<p class="memo">Memory line: Find it → measure it → deal with it.</p>`,

w1t3: `<p>ALE answers one question: <b>"On average, how much money will this problem cost us each year?"</b></p>
<p>Example: your phone is worth $8,000. If you drop it, the screen breaks, which costs about 25% of its value. You drop it about twice a year.</p>
<ul><li><b>SLE</b> (cost of one accident) = 8,000 × 25% = <b>$2,000</b></li>
<li><b>ARO</b> (how many times per year) = <b>2</b></li>
<li><b>ALE</b> (cost per year) = 2,000 × 2 = <b>$4,000 a year</b></li></ul>
<p>Should you buy a $500/year case that cuts drops to almost zero (ALE about $0)? Savings = 4,000 − 0 − 500 = <b>$3,500</b>. Yes, buy it.</p>
<p>Watch the ARO when it's "once every N years": once every 10 years is 1 ÷ 10 = 0.1 per year, not 10.</p>
<p class="memo">Memory line: SLE = value × % lost. ALE = SLE × times per year. A control is worth it if (old ALE − new ALE − cost) &gt; 0.</p>`,

w1t4: `<p>Once you know a risk, you have four choices. Think about <b>driving a car</b>:</p>
<ul><li><b>Accept</b>: "A small scratch might happen, I'll live with it." (Fixing it costs more than it's worth.)</li>
<li><b>Avoid</b>: "I won't drive at all." (You remove the risky activity.)</li>
<li><b>Mitigate</b>: "I'll drive carefully and wear a seatbelt." (You reduce the chance or the damage.)</li>
<li><b>Transfer</b>: "I'll buy car insurance." (Someone else pays if it happens.)</li></ul>
<p>In IT: accept = do nothing; avoid = turn off the risky service; mitigate = firewall, patches, backups, training; transfer = insurance or outsourcing.</p>
<p class="memo">Memory line: A-A-M-T. Live with it, stop doing it, reduce it, or make someone else pay.</p>`,

w1t5: `<p>Imagine your <b>bank account</b>:</p>
<ul><li><b>Confidentiality</b>: strangers can't <i>see</i> your balance.</li>
<li><b>Integrity</b>: nobody can secretly <i>change</i> your balance.</li>
<li><b>Availability</b>: you can <i>use</i> your account when you need it; the app isn't down.</li>
<li><b>Authentication</b>: the bank knows it's <i>really you</i> logging in.</li>
<li><b>Non-repudiation</b>: you can't later say "I never made that transfer" when you did.</li></ul>
<p>Which matters most depends on the business: a hospital's records need <b>C</b>, a stock exchange needs <b>I</b>, and an online shop or emergency service needs <b>A</b>.</p>
<p class="memo">Memory line: C = see, I = change, A = use.</p>`,

/* ---------- WEEK 2 ---------- */
w2t1: `<p>Think of a <b>school</b>.</p>
<ul><li><b>Metapolicy</b> = the big goal: "Students' exam results must be kept private." This is the <b>what and why</b>.</li>
<li><b>Policy</b> = the actual rules that achieve the goal: "Results are stored in a locked cabinet; only teachers have the key; results are never posted on the wall." This is the <b>how</b>.</li></ul>
<p>Why have both? The goal on its own is too vague to follow ("keep it private"... but how?). The rules on their own seem random unless you know the goal behind them.</p>
<p>For BLP, the metapolicy is "information must never flow down to people not cleared for it". The policy is the three BLP rules.</p>
<p class="memo">Memory line: Metapolicy = WHY/WHAT (goal). Policy = HOW (rules).</p>`,

w2t2: `<p>Every <b>file</b> gets a sticker (its <b>label</b>), and every <b>person</b> gets a badge (their <b>clearance</b>). Both have the same two parts:</p>
<ol><li><b>A level</b>, like floors in a building: Unclassified &lt; Confidential &lt; Secret &lt; Top Secret.</li>
<li><b>Categories</b>, like rooms on a floor: {Nuclear}, {Crypto}...</li></ol>
<p>Example: a file labelled <span class="lab">(Secret, {Nuclear})</span> is on the Secret floor in the Nuclear room. A person with badge <span class="lab">(Top Secret, {Crypto})</span> is on a higher floor, but they only have the key to the Crypto room. They can't enter the Nuclear room.</p>
<p><b>Principle of Least Privilege</b>: give each person <i>only</i> the access they need for their job, and nothing extra. A cleaner gets the key to the cleaning cupboard, not the key to the safe.</p>
<p class="memo">Memory line: Level = how high. Categories = which rooms. Least privilege = only the keys you need.</p>`,

w2t3: `<p>"A <b>dominates</b> B" means "A is at least as powerful as B in every way". Two checks:</p>
<ol><li>Is A's level <b>higher or equal</b>?</li>
<li>Does A have <b>all</b> of B's categories (and maybe more)?</li></ol>
<p>Both must be yes. Think of a <b>key ring</b>: A dominates B if A is on a high enough floor <i>and</i> A's key ring contains every key B has.</p>
<ul><li>(Secret, {Crypto, Nuclear}) vs (Confidential, {Crypto}): higher floor ✓, has the Crypto key ✓ → <b>first dominates</b>.</li>
<li>(Top Secret, {Crypto}) vs (Secret, {Nuclear}): higher floor ✓, but no Nuclear key ✗. And (Secret, {Nuclear}) is on a lower floor ✗. → <b>incomparable</b>: neither one beats the other.</li></ul>
<p>To decide, check <b>both directions</b>. If A ≥ B fails and B ≥ A also fails, they're incomparable.</p>
<div class="nutshell"><b>In a nutshell: both parts must point the same way</b>
<table class="t"><tr><th>Level</th><th>Category set</th><th>Result</th></tr>
<tr><td>Higher or equal</td><td>Bigger or equal (contains the other)</td><td><b>Dominates</b></td></tr>
<tr><td>Lower or equal</td><td>Smaller or equal (sits inside the other)</td><td><b>Is dominated</b></td></tr>
<tr><td>Equal</td><td>Equal</td><td><b>Equal</b> (RW in BLP)</td></tr>
<tr><td>Higher</td><td>Smaller</td><td><b>Incomparable</b> (opposite ways)</td></tr>
<tr><td>Lower</td><td>Bigger</td><td><b>Incomparable</b> (opposite ways)</td></tr>
<tr><td>Anything</td><td>Neither set contains the other, e.g. {F} vs {R}</td><td><b>Incomparable</b> straight away</td></tr></table>
<p><b>Examples:</b></p>
<ul><li>Military (S,{R,M}) vs Alice (C,{R}): higher level <i>and</i> bigger set → Military dominates → Alice gets <b>W</b>.</li>
<li>(S,{R}) vs (C,{R,M}): S is higher, but {R,M} is the bigger set → opposite ways → <b>incomparable</b> → no access (–).</li></ul>
<p><b>Steps:</b> 1) Compare the labels (it doesn't matter which is the subject). 2) Apply BLP: subject wins → R; object wins → W; equal → RW; incomparable → –.</p></div>
<p class="memo">Memory line: same direction = comparable; opposite directions = incomparable. A higher floor doesn't help if you're missing a key.</p>`,

w2t4: `<p>BLP protects secrets with two simple rules:</p>
<ul><li><b>No read up</b> (Simple Security Property): you can't read anything <i>above</i> your clearance. A Secret person can't read a Top Secret file.</li>
<li><b>No write down</b> (*-Property): you can't write <i>into</i> anything below your level. A Secret person can't write into a Confidential file, because they might copy secrets into it and leak them to people with lower clearance.</li></ul>
<p>Analogy: a general can <b>read</b> soldiers' reports (reading down is fine), but can't <b>post</b> battle plans on the soldiers' noticeboard (writing down leaks). A soldier can <b>drop a note</b> into the general's box (writing up is fine) but can't <b>open</b> the general's box (reading up isn't allowed).</p>
<p>Filling a table (the ACM), for each subject and object:</p>
<ul><li>Subject is higher → <b>R</b></li><li>Object is higher → <b>W</b></li><li>Exactly equal → <b>RW</b></li><li>Incomparable → <b>–</b></li></ul>
<p class="memo">Memory line: Read down, write up. Same label = read and write.</p>`,

w2t5: `<p>The two BLP rules assume labels stay fixed. But what if someone just <b>changes the sticker</b> on a Top Secret file to "Unclassified"? Nobody "wrote down" and nobody "read up", yet the secret is now public. <b>Tranquility</b> is the rule about changing labels.</p>
<ul><li><b>Strong tranquility</b>: stickers are <b>glued on forever</b>. Labels never change.</li>
<li><b>Weak tranquility</b>: you may change stickers, <b>as long as no secret leaks downward</b>.</li></ul>
<p>Examples under weak tranquility:</p>
<ul><li>Make a file <i>more</i> secret (Secret → Top Secret): ✅ safe, nothing leaks.</li>
<li>Make a file less secret while the secret contents are still inside: ❌ leak.</li>
<li>Wipe the disk completely, <i>then</i> label it Unclassified: ✅ nothing left to leak.</li></ul>
<p><b>Putting BLP together</b>: BLP = Simple Security + *-Property + Tranquility. Each rule blocks one way a secret could leak:</p>
<table class="t"><tr><th>Leak route</th><th>Blocked by</th></tr><tr><td>Reading something above your level</td><td>Simple Security (no read up)</td></tr><tr><td>Copying secrets down into a lower file</td><td>*-Property (no write down)</td></tr><tr><td>Relabelling a file to make it lower</td><td>Tranquility</td></tr></table>
<p class="memo">Memory line: Strong = never change. Weak = change only if nothing leaks down.</p>`,

w2t6: `<p><b>MAC (Mandatory)</b> = <b>the system decides</b>, and you can't change the rules. Like a military base: even if you own a document, you can't decide to show it to your friend; the clearance rules apply. Examples: <b>BLP, Biba, Lipner</b>.</p>
<p><b>DAC (Discretionary)</b> = <b>the owner decides</b>. Like your own Google Drive: you can share a file with anyone you like. Examples: <b>Unix file permissions (chmod), Windows NTFS permissions</b>.</p>
<p>An <b>access control matrix</b> is just a table: people down the side, files across the top, and in each box what that person may do (R, W...).</p>
<p class="memo">Memory line: Mandatory = the system's rules. Discretionary = the owner's choice.</p>`,

/* ---------- WEEK 3 ---------- */
w3t1: `<p>A <b>lattice</b> is a family-tree style diagram of labels, with the <b>lowest at the bottom</b> and the <b>highest at the top</b>. Arrows point <b>upward</b>, because information may only move up.</p>
<p>How to draw one, step by step:</p>
<ol><li>Put the weakest label (for example (Public, {})) at the bottom and the strongest at the top.</li>
<li>For each pair, ask "does B dominate A?" If yes, B goes above A.</li>
<li>Draw an arrow A → B <b>only if nothing sits in between</b>. If A → B → C, you don't also draw A → C.</li>
<li>No arrow between incomparable labels.</li></ol>
<p>Think of water flowing <b>uphill only</b>: it can rise from Public to Confidential to Top Secret, but never fall back down.</p>
<p class="memo">Memory line: bottom = weakest, top = strongest, arrows up, skip the shortcuts.</p>`,

w3t2: `<p>A <b>covert channel</b> is a <b>secret signal</b> sent using something that was never meant for communication. All of BLP's rules are obeyed, yet information still leaks.</p>
<p>Imagine two prisoners in separate cells who aren't allowed to talk:</p>
<ul><li><b>Storage channel</b>: prisoner A <i>leaves the light on</i> = 1 or <i>off</i> = 0, and prisoner B looks at the light. The message is in the <b>state of something</b>. Computer version: a file exists or doesn't; a disk is full or not; an error says "not found" or "access denied".</li>
<li><b>Timing channel</b>: prisoner A <i>takes a long shower</i> = 1 or <i>a short one</i> = 0, and B times how long the water runs. The message is in <b>how long or in what order</b> something happens. Computer version: using all your CPU time or giving it up early; the order disk requests are served.</li></ul>
<p>Quick test: does the receiver need a <b>clock or ordering</b> to decode it? Then it's <b>timing</b>. Does it just look at some <b>value or state</b>? Then it's <b>storage</b>.</p>
<p>What to do about one: <b>remove</b> it, <b>add noise</b> to slow it down, or <b>monitor</b> it. It's hard to remove them all because big systems have countless shared resources.</p>
<p class="memo">Memory line: Storage = WHAT state. Timing = WHEN or HOW LONG.</p>`,

w3t3: `<p>The <b>Shared Resource Matrix (SRM)</b> is a <b>checklist table</b> for spotting places where a covert channel <i>could</i> exist.</p>
<ul><li><b>Rows</b> = shared things the system keeps track of (does a file exist, its size, its level...).</li>
<li><b>Columns</b> = actions (READ, WRITE, CREATE, DELETE).</li>
<li>Put <b>M</b> if the action can <b>change</b> that thing, and <b>R</b> if the action can <b>reveal</b> it.</li></ul>
<p>If a row has both an <b>M and an R</b>, one person can change it and another can see it. That's a possible secret signal, so look there.</p>
<p>Example: "file exists". CREATE and DELETE <b>modify</b> it (M), and READ <b>reveals</b> it (R). So a high user can create or delete a file and a low user can notice: a possible storage channel.</p>
<p>SRM only points to <i>suspects</i>; a human still has to check each one. It was invented by <b>Kemmerer</b>.</p>
<p class="memo">Memory line: an M and an R in the same row = suspect a covert channel.</p>`,

w3t4: `<p>BLP only watches the <b>front door</b>: reading and writing files. Covert channels sneak through the <b>windows</b>: timing, file existence, error messages.</p>
<p><b>Non-interference (NI)</b> sets a much stronger rule: <b>"Nothing the high user does may cause any change the low user can notice."</b> No file changes, no timing differences, nothing at all. So it automatically blocks covert channels as well.</p>
<p>Analogy: BLP says "don't pass notes to the student next door". NI says "the student next door must not be able to tell <i>anything</i> about what you're doing: not your notes, not your noise, not when your light is on".</p>
<p>Extra facts: NI is written as arrows between <b>subjects</b> showing who may affect whom (L → H). Any BLP policy can be turned into NI, but not every NI policy can become BLP, because NI doesn't have to be transitive (Internet → Firewall → LAN, but <i>not</i> Internet → LAN). The downside is that NI is very hard to prove for a real system.</p>
<p class="memo">Memory line: BLP controls files. NI controls <i>every</i> visible effect, so it also stops covert channels.</p>`,

w3t5: `<p>So far we've protected <b>secrets</b> (confidentiality). Integrity is about <b>trust</b>: can I believe this information, and who is allowed to change it?</p>
<p>Example: a news story from an expert source is more trustworthy than a random gossip blog. So we give integrity labels too: high integrity = trustworthy, low = dubious.</p>
<p>The integrity goal is the opposite of secrecy: <b>don't let bad (low-trust) information pollute good (high-trust) information</b>. Like keeping clean drinking water away from dirty water.</p>
<p>Integrity labels are <b>separate</b> from secrecy labels. A document can be very secret but unreliable, or totally public but very reliable.</p>
<p class="memo">Memory line: Secrecy = who can SEE. Integrity = who can CHANGE or how TRUSTED.</p>`,

/* ---------- WEEK 4 ---------- */
w4t1: `<p>Biba is <b>BLP flipped upside down</b>, to protect <b>trust</b> instead of secrets.</p>
<p>Analogy: a <b>doctor</b> (high trust) and a <b>random internet forum</b> (low trust).</p>
<ul><li><b>Strict Integrity</b>: the doctor must <b>not read</b> the forum ("no read down"), so they don't pick up bad info. The forum must <b>not write</b> into medical records ("no write up").</li>
<li><b>Low Water Mark</b>: the doctor <i>may</i> read the forum, but then the doctor's trust level <b>drops</b> to the forum's level ("you touched dirty water, so now you're dirty too"). Problem: over time everyone drops to low (<b>label creep</b>).</li>
<li><b>Ring</b>: the doctor may read <b>anything</b>; we trust them to filter out nonsense. They still can't write up.</li></ul>
<p>How much each one <b>trusts the subject</b>: Ring (most) &gt; Low Water Mark &gt; Strict (least).</p>
<p>All three share one rule: <b>no write up</b>.</p>
<p class="memo">Memory line: BLP = read down, write up. Biba = read UP, write DOWN (the exact opposite, which is why it's called the "dual").</p>`,

w4t2: `<p>Sometimes we want <b>both</b>: keep secrets (BLP) <i>and</i> keep data trustworthy (Biba). Then every person and file has <b>two labels</b>, and an action is allowed only if <b>both models say yes</b>.</p>
<p>Recipe for each cell:</p>
<ol><li>Use the <b>secrecy labels</b> and BLP: what does it allow? (R, W, RW or –)</li>
<li>Use the <b>integrity labels</b> and Biba: what does it allow?</li>
<li>Keep only the letters that appear in <b>both</b>.</li></ol>
<p>Example: BLP says <b>RW</b> and Biba says <b>R</b> → answer <b>R</b>. BLP says <b>R</b> and Biba says <b>W</b> → nothing in common → <b>–</b>.</p>
<p>It's like needing <b>two keys</b> to open a safe: having one isn't enough.</p>
<p class="memo">Memory line: both models must agree. Take the overlap.</p>`,

w4t3: `<p>Lipner looked at a normal <b>company IT department</b> and listed what it needs:</p>
<ol><li>Normal staff just <b>use</b> the company software; they don't write their own programs.</li>
<li>Programmers build and test on a <b>separate test system</b>, not the live one.</li>
<li>Moving new software to the live system needs a <b>special, controlled and logged</b> step.</li>
<li>Managers and auditors must be able to <b>see the logs</b>.</li></ol>
<p>Lipner showed you can get this by <b>combining BLP (secrecy) and Biba (integrity)</b>, giving each role a pair of labels. Ordinary users can use production programs but can't change them. Programmers can't touch the live system. Only "system controllers" have a special right to <b>move software from development to production</b>, which BLP and Biba alone can't do because it means changing labels.</p>
<p class="memo">Memory line: Lipner = BLP + Biba glued together for a company's dev/production separation.</p>`,

w4t4: `<p>Clark-Wilson is designed for <b>businesses like banks</b>, where the main worry is that the books must always <b>balance</b>.</p>
<p>The four building blocks, in bank terms:</p>
<ul><li><b>CDI</b> (Constrained Data Item): important protected data, like <b>account balances</b>.</li>
<li><b>UDI</b> (Unconstrained Data Item): untrusted input, like <b>numbers typed at an ATM</b>.</li>
<li><b>TP</b> (Transformation Procedure): the <b>only approved programs</b> allowed to change CDIs, like "deposit" or "transfer". They always leave things balanced.</li>
<li><b>IVP</b> (Integrity Verification Procedure): a <b>checker</b> that confirms everything still balances, like the end-of-day audit.</li></ul>
<p>The four concerns: <b>Authentication</b> (who are you?), <b>Audit</b> (log everything), <b>Well-formed transactions</b> (change data only through approved TPs), <b>Separation of duty</b> (no one person can do everything).</p>
<p class="memo">Memory line: CDI = protected data, UDI = raw input, TP = approved program, IVP = checker.</p>`,

w4t5: `<p>Clark-Wilson has two kinds of rules:</p>
<ul><li><b>Certification (C) rules</b>: a <b>trusted human</b> (a security officer) checks and signs off that something is correct. Like an inspector approving a lift as safe.</li>
<li><b>Enforcement (E) rules</b>: the <b>computer automatically</b> enforces them every time. Like the lift refusing to move if it's overloaded.</li></ul>
<p>The two you must know:</p>
<ul><li><b>C4, logging</b>: every TP must write enough to an <b>append-only log</b> that someone can rebuild what happened later. Like a bank's CCTV plus transaction receipts.</li>
<li><b>E4, separation of duty</b>: the person who <b>approves</b> a program <b>can't also run</b> it. Like the person who signs cheques not being the one who writes them. This stops a single insider committing fraud; they'd need a partner.</li></ul>
<p><b>Access triple</b> = (user, TP, {CDIs}), meaning "this person may run this program on this data". For example (Alice, Transfer, {Savings, Current}).</p>
<p class="memo">Memory line: C = human checks, E = computer enforces. C4 = log it. E4 = approver can't execute.</p>`,

w4t6: `<p>Imagine you're a <b>consultant</b>. If you work for <b>Coca-Cola</b>, you mustn't also see <b>Pepsi's</b> secrets, because that's a conflict of interest. But working for Coca-Cola <i>and</i> HSBC is fine; they don't compete.</p>
<p>Three layers:</p>
<ul><li><b>Object</b>: one file about one company.</li>
<li><b>Company dataset (CD)</b>: all the files about one company (all of Coca-Cola's files).</li>
<li><b>Conflict of interest (COI) class</b>: a group of competitors: {Coca-Cola, Pepsi}, {HSBC, Citibank, StanChart}.</li></ul>
<p><b>Read rule</b>: you can read a company's files if (a) you've already been reading that same company, (b) you've never touched any of its competitors, or (c) the file is public (sanitized). The first time you open Coca-Cola, a "wall" goes up around Pepsi <b>forever</b>.</p>
<p><b>Write rule</b>: you can only write somewhere if everything you've read is from that same company. Otherwise you might copy Coca-Cola secrets into a shared file that a Pepsi consultant can read.</p>
<p>The key difference from BLP: <b>your past decides your future access</b>. At the start you can read anything.</p>
<p class="memo">Memory line: Chinese Wall = once you pick a side, you can't see the rival.</p>`,

w4t7: `<p>RBAC gives permissions to <b>jobs</b>, not to people. In a <b>restaurant</b>: the role "Cashier" can open the till; the role "Chef" can use the kitchen. When Amy is hired as a cashier, she just gets the Cashier role, with no need to set each permission separately.</p>
<p>The three rules:</p>
<ol><li><b>Role assignment</b>: you must have an <b>active role</b> to do anything. (Amy must be "on shift as cashier".)</li>
<li><b>Role authorization</b>: your active role must be one you're <b>allowed</b> to have. (Amy can't make herself manager.)</li>
<li><b>Transaction authorization</b>: you can only do actions your <b>active role allows</b>. (A cashier can't approve refunds if only managers can.)</li></ol>
<p><b>Separation of duty</b>: some roles must never go to the same person, like <b>cashier and auditor</b>, so nobody can steal money <i>and</i> check their own work.</p>
<p class="memo">Memory line: permissions belong to jobs. Have a role, be allowed it, only do what it permits.</p>`,

w4t8: `<p>A full access control matrix (a giant table of every person × every file) is huge and mostly empty, so systems store it in smarter ways:</p>
<ol><li><b>Rules on the fly</b>: don't store anything; just <b>calculate</b> each time (like BLP checking labels).</li>
<li><b>Access control list (ACL)</b>: store the list <b>on each file</b>: "who can use me". Like a <b>guest list at a party door</b>.</li>
<li><b>Capabilities</b>: store the list <b>with each person</b>: "what I can use". Like a <b>concert ticket in your pocket</b>; showing it gets you in, so tickets must be impossible to forge.</li></ol>
<p class="memo">Memory line: ACL = list on the door (object). Capability = ticket in your pocket (subject).</p>`,

/* ---------- WEEK 5 ---------- */
w5t1: `<p><b>ORCON</b> = "the <b>creator</b> stays in control of who sees the document, even after sharing it."</p>
<p>Example: your boss writes a memo for your team only. You may read it, but you <b>can't forward it</b> without your boss's permission, and any <b>copy</b> you make has the same restriction.</p>
<p>Why the normal models fail:</p>
<ul><li><b>DAC</b> fails: whoever <i>owns</i> a copy could change its permissions and share it freely.</li>
<li><b>MAC</b> fails: central administrators would need a new category for every little sharing decision (category explosion), which is too rigid.</li></ul>
<p>So ORCON is a <b>mix</b>: the copy's restrictions are locked (MAC-like), but the <b>original creator</b> can still adjust them (DAC-like).</p>
<p>Real-life ORCON = <b>DRM</b>. Netflix or Apple Music let you play a film or song on your devices but stop you copying it freely. The rules travel <b>with the content</b>.</p>
<p class="memo">Memory line: ORCON = creator controls sharing; copies keep the rules. DRM is the real-world version.</p>`,

w5t2: `<p>The <b>TCB (Trusted Computing Base)</b> is the set of parts of a computer you <b>must</b> trust for security to work: the kernel, hardware and firmware, and programs running as root. If any of these is broken, all security can be bypassed. So keep the TCB <b>as small as possible</b>, because it's easier to check.</p>
<p>The <b>reference monitor</b> is like a <b>security guard at the only door</b> of a building. Every request to access anything goes through the guard. A good guard is:</p>
<ol><li><b>Complete</b>: checks <b>everyone, every time</b>; there's no back door.</li>
<li><b>Isolated</b>: can't be <b>bribed or tampered with</b>.</li>
<li><b>Verifiable</b>: simple enough that you can <b>prove</b> the guard does the job correctly.</li></ol>
<p>Protection rings: ring 0 (the kernel) is the most trusted, in the centre; applications are in ring 3, on the outside.</p>
<p class="memo">Memory line: TCB = what you must trust (keep it small). Reference monitor = Complete, Isolated, Verifiable.</p>`,

w5t3: `<p>Attacks on encryption are named after <b>how much the attacker knows or can do</b>, from weakest to strongest:</p>
<ol><li><b>Ciphertext-only</b>: you only have the <b>scrambled messages</b>.</li>
<li><b>Known plaintext</b>: you have some scrambled messages <b>and</b> what they originally said (for example you know every email starts with "Dear Sir").</li>
<li><b>Chosen plaintext</b>: you can <b>make the system encrypt messages you choose</b> and see the result.</li>
<li><b>Adaptive chosen plaintext</b>: the same, but you pick each new message <b>based on the last result</b>.</li>
<li><b>Chosen ciphertext</b>: you can make the system <b>decrypt</b> scrambled messages you choose.</li></ol>
<p>The more the attacker controls, the easier the attack. Chosen plaintext beats known plaintext, which beats ciphertext-only.</p>
<p class="memo">Memory line: Only cipher → know a pair → choose to encrypt → choose adaptively → choose to decrypt.</p>`,

w5t4: `<p>A <b>one-time pad</b> is the only <b>perfectly unbreakable</b> encryption.</p>
<p>How it works: take a <b>truly random key</b> that is <b>as long as the message</b>, XOR them together, and <b>never reuse</b> the key.</p>
<p>Why it's perfect: suppose you intercept the 3-letter ciphertext "XQZ". With the right key it could decode to "CAT", "DOG", "YES", "RUN"... <b>every</b> 3-letter word is equally possible. The ciphertext gives you <b>zero clues</b>.</p>
<p>So why don't we use it everywhere? Because you need a key <b>as long as all your messages</b>, and you have to get that key to the other person <b>secretly</b> first. If you had a secret way to send the key, you could just send the message that way. That's the <b>key distribution problem</b>.</p>
<p>The practical copy is to generate a long key from a short secret seed with a pseudorandom generator. That's how stream ciphers work, but they aren't <i>perfect</i> any more.</p>
<p class="memo">Memory line: random + same length + used once = perfect. Hard part: sharing the key.</p>`,

w5t5: `<p>Almost all encryption is built from two simple moves:</p>
<ul><li><b>Substitution</b> = <b>replace</b> letters with other letters (A→Q, B→M...). It creates <b>confusion</b>: the link between the key and the ciphertext is hidden.</li>
<li><b>Transposition</b> = <b>shuffle</b> the order of the letters (HELLO → LOHEL). It creates <b>diffusion</b>: one bit of the message affects many bits of the output, so patterns spread out.</li></ul>
<p>Like making a smoothie: substitution changes each fruit into juice, and transposition mixes it all up. Do both many times (<b>rounds</b>) and you can't tell what went in. AES does exactly this.</p>
<p><b>Breakable</b>: possible to break with enough time (any cipher can be brute-forced eventually). <b>Strong</b>: no shortcut faster than trying every key.</p>
<p class="memo">Memory line: Substitution → Confusion. Transposition → Diffusion. ("S-C, T-D")</p>`,

w5t6: `<p><b>Symmetric</b> = <b>one shared key</b> locks and unlocks, like a house key you copy for a friend. Fast, but you must <b>hand over the key secretly first</b> (key exchange). With many people it gets messy: every <i>pair</i> needs its own key, so 100 people need 100×99/2 = <b>4,950 keys</b>.</p>
<p><b>Asymmetric</b> = <b>two keys</b>: a <b>public key</b> you give to everyone and a <b>private key</b> you keep. Think of a <b>mailbox with a slot</b>: anyone can drop a letter in (encrypt with the public key), but only you have the key to open it (decrypt with the private key).</p>
<p>That's how asymmetric <b>solves key distribution</b>: you can publish your public key openly, and no secret ever needs to be sent. 100 people need only 2 × 100 = <b>200 keys</b>. The downside: it's much <b>slower</b>, so in practice it's used to send a symmetric key, and the symmetric key does the heavy work.</p>
<p class="memo">Memory line: Symmetric = one shared key, fast, needs secret exchange. Asymmetric = public mailbox slot plus private key, no secret exchange, slow.</p>`,

w5t7: `<p>A <b>hash</b> is like a <b>fingerprint</b> for data: any file, big or small, gets turned into a short fixed-length code. Change even one letter and the fingerprint changes completely.</p>
<p>The three properties:</p>
<ol><li><b>Preimage resistance</b>: from a fingerprint, you can't work out the original (one-way).</li>
<li><b>Weak collision resistance</b>: given a file, you can't make a <i>different</i> file with the same fingerprint.</li>
<li><b>Strong collision resistance</b>: you can't find <i>any</i> two files with the same fingerprint.</li></ol>
<p>Use: download a file, compute its hash, and compare it with the one on the website. If they match, nobody tampered with it. So hashes give <b>integrity</b>. They use <b>no key</b> and don't hide anything, so they give no confidentiality.</p>
<p class="memo">Memory line: Hash = fingerprint. One-way + no twins. Integrity only, no key.</p>`,

w5t8: `<p>A <b>MAC</b> is a hash <b>with a secret key</b>, like a <b>wax seal</b> only you and your friend can make. When your friend gets a message with the right seal, they know (1) it <b>wasn't changed</b> (integrity) and (2) it <b>came from you</b> (authentication). But since you <i>both</i> have the seal, you can't prove to a judge which of you sent it, so there's <b>no non-repudiation</b>.</p>
<p><b>Authenticated encryption (AE)</b>, for example AES-GCM, is a <b>locked box with a tamper-evident seal</b>:</p>
<ol><li>It provides <b>ciphertext integrity</b> (nobody can change it unnoticed).</li>
<li>Decryption <b>rejects</b> anything that wasn't made with the correct key.</li></ol>
<p>So AE = secrecy <b>and</b> integrity together, while plain AES gives only secrecy.</p>
<p>Cheat sheet:</p>
<ul><li>Encryption → C (key ✓)</li><li>Hash → I (<b>no key</b>)</li><li>MAC → I + authentication (shared key ✓)</li><li>AE → C + I (key ✓)</li><li>Digital signature → I + authentication + <b>non-repudiation</b> (private key ✓)</li></ul>
<p class="memo">Memory line: only signatures give non-repudiation; only hashes need no key.</p>`,

/* ---------- WEEK 6 ---------- */
w6t1: `<p>Public-key crypto needs a <b>one-way street</b>: easy to go forward, almost impossible to come back unless you have a secret shortcut.</p>
<p>RSA's one-way street is <b>multiplying primes</b>:</p>
<ul><li>Easy: 61 × 53 = 3,233.</li>
<li>Hard: "Which two primes multiply to 3,233?" For a number with hundreds of digits, even supercomputers would take far too long.</li>
<li>Shortcut: if you know one prime, divide and you instantly get the other. That secret knowledge is what makes the private key work.</li></ul>
<p>So RSA is secure because <b>factoring a huge number into its two primes is infeasible</b>.</p>
<p>What problem public-key encryption solves: the <b>key distribution problem</b>. Strangers can communicate securely without meeting first to swap a secret key. It also makes <b>digital signatures</b> possible.</p>
<p class="memo">Memory line: RSA = easy to multiply, hard to factor. Public key solves "how do we share a key with a stranger?"</p>`,

w6t2: `<p>A <b>digital signature</b> works like a handwritten signature, but it can't be forged.</p>
<ul><li>You <b>sign</b> with your <b>private key</b> (only you have it).</li>
<li>Anyone <b>checks</b> it with your <b>public key</b>.</li></ul>
<p>It proves three things:</p>
<ol><li><b>Authenticity</b>: it really came from you.</li>
<li><b>Integrity</b>: nobody changed the message after you signed it.</li>
<li><b>Non-repudiation</b>: you can't deny it later, because only your private key could have made it.</li></ol>
<p>Example: signing an online contract or a software update.</p>
<p><b>PKI (Public Key Infrastructure)</b> is the whole <b>system of trusted organizations and certificates</b> that tells you "this public key really belongs to HSBC". Without it, a hacker could give you <i>their</i> public key and pretend to be your bank.</p>
<p class="memo">Memory line: sign with private, verify with public. PKI = proves whose public key it is.</p>`,

w6t3: `<p>Data can be in three places, and each needs protecting:</p>
<ul><li><b>At rest</b>: data <b>sitting in storage</b> (a disk, backups). Like money <b>in a safe</b>. Example: <b>AES-256</b> on Google's disks. If someone steals the hard drive, they get gibberish.</li>
<li><b>In transit</b>: data <b>travelling</b> across a network. Like money <b>in an armoured truck</b>. Example: <b>TLS</b> (the padlock in your browser), <b>S/MIME</b> for email.</li>
<li><b>In use</b>: data <b>being worked on</b> by a server. Like counting money <b>inside a locked glovebox</b>. Example: <b>homomorphic encryption</b>, which lets the server calculate without ever seeing the real data.</li></ul>
<p>Google also splits each file into <b>chunks</b>, and each chunk gets its <b>own key</b>. If one key leaks, only that one small chunk is exposed.</p>
<p class="memo">Memory line: Rest = safe (AES). Transit = armoured truck (TLS). Use = locked glovebox (homomorphic).</p>`,

w6t4: `<p>Google uses <b>keys locking keys</b>, like Russian dolls or a <b>key box hierarchy</b> in a hotel:</p>
<ol><li><b>DEK</b> (Data Encryption Key) locks <b>one data chunk</b>. Each chunk gets its own key, and the DEK is stored next to the chunk, but locked.</li>
<li><b>KEK</b> (Key Encryption Key) locks the <b>DEKs</b>. KEKs live in Google's <b>KMS</b> (Key Management Service), never leave it, and every use is logged.</li>
<li><b>KMS master key</b> locks the <b>KEKs</b>. It lives in <b>Root KMS</b>.</li>
<li><b>Root KMS master key</b> locks Root KMS. It's held only in the memory of special machines (the "distributor"), with backups in physical safes.</li></ol>
<p>Chain: <b>data ← DEK ← KEK ← KMS master key ← root KMS master key</b>.</p>
<p>Why bother? Because you never have to touch huge amounts of data to manage keys. You just protect a few keys at the top.</p>
<p><b>If a key is stolen</b> (hotel analogy):</p>
<ul><li><b>DEK stolen</b> = one room key lost → change the lock on <b>that one room</b> (re-encrypt that chunk with a new DEK).</li>
<li><b>KEK stolen</b> = a master key for a floor lost → <b>issue a new KEK</b> and <b>re-wrap every DEK</b> it protected, retire the old one, and check the logs for misuse.</li>
<li><b>Master or root key stolen</b> = the hotel's main key lost → the worst case. Replace it and re-wrap everything below it.</li></ul>
<p class="memo">Memory line: DEK locks data, KEK locks DEKs, master locks KEKs. The higher the key, the bigger the clean-up if it leaks.</p>`,

w6t5: `<p>Problem: you get a public key that says it's "HSBC". How do you know it isn't a hacker's?</p>
<p><b>Certificate</b> = a <b>digital ID card</b> that says "this public key belongs to HSBC", <b>signed by someone trusted</b>. Like a <b>passport</b>: your photo and name, stamped by the government.</p>
<p><b>Certification Authority (CA)</b> = the trusted organization that <b>checks who you are and signs your certificate</b>. Like the <b>passport office</b>. Examples: Hongkong Post CA, Verisign.</p>
<p><b>Chain of trust</b> = trust passed down a line:</p>
<ul><li>You trust the <b>Root CA</b> (it's built into your browser).</li>
<li>The Root CA signs an <b>intermediate CA</b>'s certificate.</li>
<li>The intermediate CA signs <b>HSBC</b>'s certificate.</li>
<li>So you can trust HSBC's key by following the signatures back up to the root.</li></ul>
<p>Like a reference: "I trust my teacher, my teacher vouches for this student, so I trust this student." The purpose is that you only need to trust a <b>few roots</b>, not everyone on the internet.</p>
<p>To check a certificate: verify the CA's signature with the CA's public key, recompute the hash and compare, and check it hasn't expired.</p>
<p class="memo">Memory line: Certificate = ID card. CA = passport office. Chain of trust = follow the signatures up to a root you already trust.</p>`
};
