/* ======= generated question types for variety ======= */
const LV = ['U','C','S','TS'];
const CATS = ['R','M','F'];
function randLabel(){ const c=CATS.filter(()=>Math.random()<.45); return {l:Math.floor(Math.random()*4), c:new Set(c)}; }
function genDom(){
  let a=randLabel(), b=randLabel(); let tries=0;
  while(tries++<10 && cmp(a,b)==='equal'){ b=randLabel(); }
  const r=cmp(a,b); const A=fmt(LV,a), B=fmt(LV,b);
  const opts=[`${A} dominates`,`${B} dominates`,'They are incomparable','They are equal'];
  const a_={A:0,B:1,none:2,equal:3}[r];
  const yn=(v)=>v?'是':'否';
  return {w:2,gen:true,q:`Levels U < C < S < TS. Compare ${A} and ${B}.`,opts,a:a_,fixed:true,
    ex:`Dominates needs a higher or equal level AND a superset of categories. ${A} ≥ ${B}? ${dom(a,b)?'yes':'no'}. ${B} ≥ ${A}? ${dom(b,a)?'yes':'no'}.`,
    zh:{q:`等級 U < C < S < TS。比較 ${A} 和 ${B}。`,opts:[`${A} 支配`,`${B} 支配`,'不可比較','相等'],
    ex:`支配需要等級較高或相等，而且類別是超集。${A} ≥ ${B}？${yn(dom(a,b))}。${B} ≥ ${A}？${yn(dom(b,a))}。`}};
}
const PERM_ZH={R:'R',W:'W',RW:'RW','-':'不可存取'};
function genBLP(){
  const s=randLabel(), o=randLabel(); const p=blpPerm(s,o);
  const opts=['R only','W only','RW','No access (–)']; const a={R:0,W:1,RW:2,'-':3}[p];
  const yn=(v)=>v?'是':'否';
  return {w:2,gen:true,q:`BLP, levels U < C < S < TS. Subject ${fmt(LV,s)} and object ${fmt(LV,o)}. What access does the subject have?`,opts,a,fixed:true,
    ex:`Read needs S ≥ O: ${dom(s,o)?'yes':'no'}. Write needs O ≥ S: ${dom(o,s)?'yes':'no'}. So the answer is ${p==='-'?'no access':p}.`,
    zh:{q:`BLP，等級 U < C < S < TS。主體 ${fmt(LV,s)}，客體 ${fmt(LV,o)}。主體有甚麼存取權？`,opts:['只有 R','只有 W','RW','不可存取（–）'],
    ex:`讀取需要 S ≥ O：${yn(dom(s,o))}。寫入需要 O ≥ S：${yn(dom(o,s))}。所以答案是${PERM_ZH[p]}。`}};
}
function genBiba(){
  const s=randLabel(), o=randLabel(); const p=bibaPerm(s,o);
  const opts=['R only','W only','RW','No access (–)']; const a={R:0,W:1,RW:2,'-':3}[p];
  const yn=(v)=>v?'是':'否';
  return {w:4,gen:true,q:`Biba Strict Integrity, integrity levels U < C < S < TS. Subject ${fmt(LV,s)} and object ${fmt(LV,o)}. What access does the subject have?`,opts,a,fixed:true,
    ex:`Read needs i(s) ≤ i(o): ${dom(o,s)?'yes':'no'}. Write needs i(o) ≤ i(s): ${dom(s,o)?'yes':'no'}. So the answer is ${p==='-'?'no access':p}. (These are the reverse of BLP.)`,
    zh:{q:`Biba 嚴格完整性，完整性等級 U < C < S < TS。主體 ${fmt(LV,s)}，客體 ${fmt(LV,o)}。主體有甚麼存取權？`,opts:['只有 R','只有 W','RW','不可存取（–）'],
    ex:`讀取需要 i(s) ≤ i(o)：${yn(dom(o,s))}。寫入需要 i(o) ≤ i(s)：${yn(dom(s,o))}。所以答案是${PERM_ZH[p]}。（這些與 BLP 相反。）`}};
}
function genALE(){
  const av=pick([200,250,400,500,600,750,800,1200])*1000, ef=pick([10,20,25,40,50,60,75]), yrs=pick([2,4,5,10,20,25]);
  const sle=av*ef/100, aro=1/yrs, ale=sle*aro;
  const cands=[sle, av*aro, ale*2, ale/2, av*ef/100*yrs].map(money).filter((v,i,a)=>v!==money(ale)&&a.indexOf(v)===i);
  const opts=[money(ale), ...cands.slice(0,3)];
  return {w:1,gen:true,q:`An asset is worth ${money(av)}. A flood would destroy ${ef}% of it, and one is expected once every ${yrs} years. What is the ALE?`,opts,a:0,
    ex:`SLE = ${money(av)} × ${ef}% = ${money(sle)}. ARO = 1/${yrs} = ${aro}. ALE = SLE × ARO = ${money(ale)}.`,
    zh:{q:`一項資產價值 ${money(av)}。水浸會摧毀其 ${ef}%，預計每 ${yrs} 年發生一次。ALE 是多少？`,opts,
    ex:`SLE = ${money(av)} × ${ef}% = ${money(sle)}。ARO = 1/${yrs} = ${aro}。ALE = SLE × ARO = ${money(ale)}。`}};
}
function genKeys(){
  const n=pick([10,20,25,50,100,200]); const sym=n*(n-1)/2;
  const opts=[sym.toLocaleString(), (n*n).toLocaleString(), (2*n).toLocaleString(), (n).toLocaleString()];
  return {w:5,gen:true,q:`${n} users each need a unique key for every pair of users, using symmetric encryption. How many keys?`,opts,a:0,
    ex:`n(n−1)/2 = ${n}×${n-1}/2 = ${sym.toLocaleString()}. Asymmetric would need only 2n = ${2*n}.`,
    zh:{q:`${n} 個用戶使用對稱加密，每對用戶都需要一條獨有金鑰。需要多少條金鑰？`,opts,
    ex:`n(n−1)/2 = ${n}×${n-1}/2 = ${sym.toLocaleString()}。非對稱只需 2n = ${2*n} 條。`}};
}

const qO = (q,i) => bi(q.opts[i], q.zh&&q.zh.opts&&q.zh.opts[i]!==q.opts[i] ? q.zh.opts[i] : null);

/* ======= render a single MCQ (instant feedback) ======= */
function prepQ(q){ // shuffle options unless fixed
  const idx=q.opts.map((_,i)=>i); const order=q.fixed?idx:shuffle(idx);
  return {...q, order};
}
function renderInstantQ(q, num, container){
  const p=prepQ(q);
  const box=el('div',{class:'q'});
  box.appendChild(el('div',{class:'qn'},`<span>Q${num}</span><span>${T('Week '+q.w,'第 '+q.w+' 週')}</span>`));
  box.appendChild(el('div',{class:'qt'},qQ(q)));
  const opts=el('div',{class:'opts'});
  const ex=el('div',{class:'ex',hidden:''});
  p.order.forEach((oi,k)=>{
    const b=el('button',{class:'opt',type:'button'},`<span class="k">${'ABCD'[k]}</span><span>${qO(q,oi)}</span>`);
    b.addEventListener('click',()=>{
      [...opts.children].forEach((c,kk)=>{ c.disabled=true; if(p.order[kk]===q.a) c.classList.add('right'); });
      if(oi!==q.a) b.classList.add('wrong');
      ex.hidden=false; ex.innerHTML=(oi===q.a?`<b class="ok">${T('Correct.','正確。')}</b> `:`<b class="no">${T('Not quite.','不太對。')}</b> `)+qEx(q);
    });
    opts.appendChild(b);
  });
  box.appendChild(opts); box.appendChild(ex);
  container.appendChild(box);
}

  body.querySelectorAll('.latfig').forEach(d=>{ const pr=LAT_PRESETS[d.dataset.k]; const labs=pr.labels.map(([l,c])=>L(pr.levels,l,c)); d.className='svgwrap latfig'; d.innerHTML=hasse(pr,labs); });
  const chk=el('div',{class:'check'});
  chk.appendChild(el('h3',{},T(`Check yourself: Week ${w.n}`,`自我測驗：第 ${w.n} 週`)));
  const qs=shuffle(BANK.filter(q=>q.w===w.n)).slice(0,5);
  const holder=el('div'); qs.forEach((q,i)=>renderInstantQ(q,i+1,holder)); chk.appendChild(holder);
  const nav=el('div',{class:'row'});
  nav.appendChild(el('button',{class:'btn',type:'button',onclick:()=>renderWeek()},T('New check questions','換一組題目')));

  chk.appendChild(nav);

}

function coverEdges(labs){
  const n=labs.length, E=[];
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){ if(i===j) continue; if(dom(labs[j],labs[i]) && !dom(labs[i],labs[j])){ let between=false; for(let k=0;k<n;k++){ if(k===i||k===j) continue; if(dom(labs[k],labs[i])&&!dom(labs[i],labs[k])&&dom(labs[j],labs[k])&&!dom(labs[k],labs[j])){between=true;break;} } if(!between) E.push([i,j]); } }
  return E;
}
function edgeText(pr,labs){ const E=coverEdges(labs); return `<b>${T('Arrows (information flows up):','箭咀（資訊向上流）：')}</b><br>`+E.map(([i,j])=>`${fmt(pr.levels,labs[i])} → ${fmt(pr.levels,labs[j])}`).join('<br>'); }
function hasse(pr,labs){
  const n=labs.length, E=coverEdges(labs);
  // rows = longest chain from the bottom; x from category "centre of mass"
  const rank=labs.map(()=>0); for(let it=0;it<n;it++) E.forEach(([i,j])=>{ if(rank[j]<rank[i]+1) rank[j]=rank[i]+1; }); const maxR=Math.max(...rank); const used=[...Array(maxR+1).keys()];
  const allC=[...new Set(labs.flatMap(l=>[...l.c]))].sort();
  const pref=labs.map(l=>{ const c=[...l.c]; if(!c.length||c.length===allC.length) return .5; return allC.length<2?.5:c.reduce((s,x)=>s+allC.indexOf(x),0)/c.length/(allC.length-1); });
  const bw=labs.map(l=>fmt(pr.levels,l).length*7.4+16); const gap=24;
  const W=Math.max(620, ...used.map((_,r)=>labs.reduce((s,l,i)=>rank[i]===r?s+bw[i]+gap:s,0)+60)); const H=(maxR+1)*95+20;
  const pos=[];
  for(let r=0;r<=maxR;r++){
    const ids=labs.map((_,i)=>i).filter(i=>rank[i]===r).sort((a,b)=>pref[a]-pref[b]||labs[a].c.size-labs[b].c.size);
    let xs=ids.map(i=>40+bw[i]/2+pref[i]*(W-80-bw[i]));
    for(let k=1;k<xs.length;k++){ const need=xs[k-1]+bw[ids[k-1]]/2+gap+bw[ids[k]]/2; if(xs[k]<need) xs[k]=need; }
    const over=xs.length?xs[xs.length-1]+bw[ids[ids.length-1]]/2-(W-20):0; if(over>0) xs=xs.map(x=>x-over);
    ids.forEach((id,k)=>pos[id]={x:xs[k], y:H-28-r*95});
  }
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Lattice diagram"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>`;
  const clip=(dx,dy,hw)=>Math.min(Math.abs(dx)>0.01?(hw+3)/Math.abs(dx):1e9, Math.abs(dy)>0.01?18/Math.abs(dy):1e9);
  E.forEach(([i,j])=>{ const a=pos[i],b=pos[j]; const dx=b.x-a.x, dy=b.y-a.y; const t1=clip(dx,dy,bw[i]/2), t2=clip(dx,dy,bw[j]/2); s+=`<line x1="${a.x+dx*t1}" y1="${a.y+dy*t1}" x2="${b.x-dx*t2}" y2="${b.y-dy*t2}" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#ar)"/>`; });
  labs.forEach((lb,i)=>{ const t=fmt(pr.levels,lb); s+=`<rect x="${pos[i].x-bw[i]/2}" y="${pos[i].y-14}" width="${bw[i]}" height="28" rx="6" fill="var(--surface)" stroke="var(--line)"/><text x="${pos[i].x}" y="${pos[i].y+4}" text-anchor="middle">${t}</text>`; });
  return s+'</svg>';
}
function toolCW(p){
  const COI=[['Banks',['HSBC','Standard Chartered','Citibank'],'銀行'],['Oil & gas',['Shell','BP'],'石油及天然氣'],['Airlines',['Cathay Pacific','HK Airlines'],'航空公司']];
  let read=new Set(), log=[];
  const coiOf=c=>COI.find(([_,cs])=>cs.includes(c));
  function canRead(c){ const [_,cs]=coiOf(c); return ![...read].some(r=>cs.includes(r)&&r!==c); }
  function canWrite(c){ if(!canRead(c)) return false; return [...read].every(r=>r===c); }
  function draw(){
    let h=`<h3>${T('Chinese Wall simulator','中國牆模擬器')}</h3><p>${bi("You're a consultant. Read company datasets and watch the wall build up from your history. <b>Read rule:</b> allowed if it's a company you've already read, it's in a different COI class, or the object is sanitized. <b>Write rule:</b> allowed only if you can read it <i>and</i> every unsanitized dataset you've read is that same company.",'你是一名顧問。讀取公司資料集，看看牆如何按你的歷史築起。<b>讀取規則：</b>如果是你已讀過的公司、屬於不同的 COI 類別，或客體已淨化，就容許。<b>寫入規則：</b>只有當你能讀它，<i>而且</i>你讀過的每個未淨化資料集都是同一間公司，才容許。')}</p><div class="cw">`;
    COI.forEach(([name,cs,zn])=>{ h+=`<div class="coi"><h4>COI: ${T(name,zn)}</h4>`; cs.forEach(c=>{ const r=canRead(c), w=canWrite(c), isR=read.has(c); h+=`<div class="co ${isR?'read':''} ${!r?'blocked':''}"><span>${c}</span><span><button class="btn small" type="button" data-r="${c}" ${!r?'disabled':''}>${T('Read','讀')}</button> <button class="btn small" type="button" data-w="${c}">${T('Write','寫')}</button></span></div>`; }); h+='</div>'; });
    h+=`</div><div class="row"><button class="btn" type="button" id="cw-reset">${T('Reset history','重設歷史')}</button><span class="stat">${T('Datasets read:','已讀資料集：')} ${[...read].join(', ')||Tp('none','無')}</span></div><div class="log" aria-live="polite">${log.map(m=>Tp(m[0],m[1])).join('\n')||Tp('Actions will appear here.','操作會顯示在這裡。')}</div>`;
    p.innerHTML=h;
    const L2=(en,zh)=>[en, LANG==='both'?'\n  '+zh:zh];
    p.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ const c=b.dataset.r; if(canRead(c)){ read.add(c); const [n,cs]=coiOf(c); const blk=cs.filter(x=>x!==c); log.unshift(L2(`READ ${c}: allowed. ${blk.length?'Now blocked: '+blk.join(', ')+' (same COI)':''}`,`讀取 ${c}：容許。${blk.length?'現已封鎖：'+blk.join('、')+'（同一 COI）':''}`)); } draw(); });
    p.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ const c=b.dataset.w; const others=[...read].filter(r=>r!==c).join(', '); if(canWrite(c)) log.unshift(L2(`WRITE ${c}: allowed (all you've read is ${c}${read.size?'':'; nothing read yet'}).`,`寫入 ${c}：容許（你讀過的全部都是 ${c}${read.size?'':'；尚未讀過任何東西'}）。`)); else if(!canRead(c)) log.unshift(L2(`WRITE ${c}: denied, because you can't even read it (conflict of interest).`,`寫入 ${c}：拒絕，因為你連讀取它也不可以（利益衝突）。`)); else log.unshift(L2(`WRITE ${c}: denied by the *-property. You've read ${others}, which could leak into ${c}.`,`寫入 ${c}：被 *-特性拒絕。你讀過 ${others}，可能洩露到 ${c}。`)); draw(); });
    $('#cw-reset',p).onclick=()=>{read=new Set();log=[];draw();};
  }
  draw();
}

const SORTS={
 treat:{name:'Risk treatment',cats:['Acceptance','Avoidance','Mitigation','Transfer'],items:[
  ['Buying cyber liability insurance','Transfer'],['Installing a firewall','Mitigation'],['Shutting down an insecure legacy FTP service entirely','Avoidance'],['The fix costs $50k for an ALE of $2k, so do nothing','Acceptance'],['Outsourcing payment handling to a provider who takes on liability','Transfer'],['Patching servers monthly','Mitigation'],['Banning USB drives on all machines','Avoidance'],['Training staff to spot phishing','Mitigation']]},
 cov:{name:'Covert channel type',cats:['Storage','Timing'],items:[
  ['High process creates or deletes a file that low checks for','Storage'],['High process uses its full CPU slice or gives it up early','Timing'],['"Not found" vs "access denied" error messages','Storage'],['Order in which disk requests at cylinders 139 and 161 are served','Timing'],['High process fills or empties a shared disk quota','Storage'],['Varying how long a computation takes before replying','Timing'],['Changing a file\'s size attribute','Storage'],['Modulating cache access latency (as in Meltdown-style attacks)','Timing']]},
 atk:{name:'Cryptanalysis attack',cats:['Ciphertext-only','Known plaintext','Chosen plaintext','Adaptive chosen plaintext','Chosen ciphertext'],items:[
  ['Attacker intercepts lots of encrypted radio traffic, nothing else','Ciphertext-only'],['Attacker knows every message starts "Dear Sir" and has the ciphertexts','Known plaintext'],['Attacker tricks a server into encrypting messages they wrote','Chosen plaintext'],['Attacker picks each new plaintext based on the previous ciphertext results','Adaptive chosen plaintext'],['Attacker can submit ciphertexts to a decryption oracle','Chosen ciphertext'],['Attacker has old messages and their decrypted versions from a leak','Known plaintext']]},
 prim:{name:'What does it provide?',cats:['Confidentiality','Integrity only (no key)','Integrity + authentication (shared key)','Confidentiality + integrity','Integrity + authentication + non-repudiation'],items:[
  ['AES-CBC encryption','Confidentiality'],['SHA-256 hash of a file','Integrity only (no key)'],['HMAC-SHA-256 tag','Integrity + authentication (shared key)'],['AES-GCM','Confidentiality + integrity'],['RSA digital signature','Integrity + authentication + non-repudiation'],['CMAC-AES','Integrity + authentication (shared key)']]},
};
function toolSort(p){
  let set='treat', score=0, total=0, items=[];
  function start(k){ set=k; score=0; total=0; items=shuffle(SORTS[k].items.map((it,i)=>[...it,i])); draw(); }
  function draw(){
    const S=SORTS[set], Z=SORTS_ZH[set];
    let h=`<h3>${T('Classify it','分類練習')}</h3><div class="row">`;
    for(const k in SORTS) h+=`<button class="btn small" type="button" data-k="${k}" ${k===set?'aria-pressed="true"':''}>${T(SORTS[k].name, SORTS_ZH[k].name)}</button>`;
    h+=`</div><p class="stat">${T('Score','得分')}: ${score} / ${total}${items.length?'':' · '+T('finished','完成')}</p>`;
    p.innerHTML=h;
    if(!items.length){ p.appendChild(el('button',{class:'btn pri',type:'button',onclick:()=>start(set)},T('Go again','再做一次'))); }
    else{
      const [txt,ans,idx]=items[0]; const ai=S.cats.indexOf(ans);
      const box=el('div',{class:'q'}); box.innerHTML=`<div class="qt">${bi(txt, Z.items[idx])}</div>`;
      const opts=el('div',{class:'opts'}); const ex=el('div',{class:'ex',hidden:''});
      S.cats.forEach((c,i)=>{ const b=el('button',{class:'opt',type:'button'},`<span class="k">${i+1}</span><span>${bi(c, Z.cats[i])}</span>`); b.onclick=()=>{ total++; if(i===ai) score++; [...opts.children].forEach((x,xi)=>{x.disabled=true; if(xi===ai) x.classList.add('right');}); if(i!==ai) b.classList.add('wrong'); ex.hidden=false; ex.innerHTML=(i===ai?`<b class="ok">${T('Correct.','正確。')}</b>`:`<b class="no">${T('Answer: '+ans+'.','答案：'+Z.cats[ai]+'。')}</b>`); items.shift(); p.querySelector('.stat').innerHTML=`${T('Score','得分')}: ${score} / ${total}`; p.appendChild(el('button',{class:'btn pri',type:'button',onclick:draw},items.length?T('Next →','下一題 →'):T('Finish','完成'))); }; opts.appendChild(b); });
      box.append(opts,ex); p.appendChild(box);
    }
    p.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>start(b.dataset.k));
  }
  start('treat');
}

/* ================= MOCK QUIZ ================= */
const MOCK_N=25, MOCK_SEC=30*60;
let mock=null, timerId=null;
function mockIntro(){
  clearInterval(timerId);
  const best=store.get('best',null);
  $('#mockroot').innerHTML=`<div class="intro"><h2>${T('30-minute mock quiz','30 分鐘模擬測驗')}</h2>
  <p>${bi(`${MOCK_N} multiple-choice questions drawn from all six weeks, about 4 per week, including calculation questions (ALE, dominates, BLP and Biba access, key counts). That's roughly 70 seconds per question, the same pace as a real 30-minute short quiz.`,`從全部六週抽出 ${MOCK_N} 條選擇題，每週約 4 條，包括計算題（ALE、支配關係、BLP 及 Biba 存取權、金鑰數目）。每題約 70 秒，與真正 30 分鐘小測的節奏相同。`)}</p>
  <ul><li>${bi('You can jump between questions and flag ones to come back to.','你可以在題目之間跳轉，並標記想稍後再看的題目。')}</li><li>${bi('Answers are only marked when you submit or when time runs out.','只有在你提交或時間用完時才會評分。')}</li><li>${bi('Afterwards you get a score by week and a full review with explanations.','完成後你會得到按週劃分的分數，以及附解釋的完整檢討。')}</li></ul>
  ${best?`<p class="stat">${T('Your best so far:','目前最佳成績：')} ${best.s} / ${best.n}</p>`:''}
  <div class="row"><button class="btn pri" type="button" id="mk-go">${T('Start quiz','開始測驗')}</button></div></div>`;
  $('#mk-go').onclick=startMock;
}
function startMock(){
  const qs=[];
  for(let w=1;w<=6;w++){ qs.push(...shuffle(BANK.filter(q=>q.w===w)).slice(0,3)); }
  GENS.forEach(g=>qs.push(g()));
  while(qs.length<MOCK_N){ const q=pick(BANK); if(!qs.includes(q)) qs.push(q); }
  mock={qs:shuffle(qs).slice(0,MOCK_N).map(prepQ), ans:{}, flag:{}, end:Date.now()+MOCK_SEC*1000, done:false};
  drawMock();
  timerId=setInterval(tick,1000); tick();
}
function tick(){
  if(!mock||mock.done) return; const left=Math.max(0,Math.round((mock.end-Date.now())/1000));
  const t=$('#mk-t'); if(t){ t.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`; t.classList.toggle('low',left<=300); }
  if(left===0) submitMock();
}
function drawMock(){
  const root=$('#mockroot'); root.innerHTML='';
  const bar=el('div',{class:'mockbar'});
  bar.innerHTML=`<div class="timer" id="mk-t" aria-live="off">30:00</div><div class="dots" id="mk-dots"></div><div class="row"><span class="stat" id="mk-cnt"></span><button class="btn pri" type="button" id="mk-sub">${T('Submit','提交')}</button></div>`;
  root.appendChild(bar);
  const list=el('div'); root.appendChild(list);
  const flagTxt=f=>f?Tp('★ flagged','★ 已標記'):Tp('☆ flag','☆ 標記');
  mock.qs.forEach((q,i)=>{
    const box=el('div',{class:'q',id:'mq'+i});
    box.innerHTML=`<div class="qn"><span>${T(`Q${i+1} of ${MOCK_N}`,`第 ${i+1} / ${MOCK_N} 題`)}</span><button class="flagbtn" type="button" aria-pressed="${mock.flag[i]?'true':'false'}">${flagTxt(mock.flag[i])}</button></div><div class="qt">${qQ(q)}</div>`;
    const opts=el('div',{class:'opts'});
    q.order.forEach((oi,k)=>{ const b=el('button',{class:'opt'+(mock.ans[i]===oi?' sel':''),type:'button'},`<span class="k">${'ABCD'[k]}</span><span>${qO(q,oi)}</span>`); b.onclick=()=>{ mock.ans[i]=oi; [...opts.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel'); dots(); }; opts.appendChild(b); });
    box.appendChild(opts);
    box.querySelector('.flagbtn').onclick=e=>{ mock.flag[i]=!mock.flag[i]; e.target.setAttribute('aria-pressed',mock.flag[i]); e.target.textContent=flagTxt(mock.flag[i]); dots(); };
    list.appendChild(box);
  });
  $('#mk-sub').onclick=()=>{ const left=MOCK_N-Object.keys(mock.ans).length; if(left>0){ const b=$('#mk-sub'); if(b.dataset.c!=='1'){ b.dataset.c='1'; b.innerHTML=T(`${left} unanswered. Submit anyway?`,`尚有 ${left} 題未答。仍要提交？`); return; } } submitMock(); };
  dots();
}
function dots(){
  const d=$('#mk-dots'); d.innerHTML='';
  mock.qs.forEach((q,i)=>{ const b=el('button',{class:'dot'+(i in mock.ans?' ans':'')+(mock.flag[i]?' flag':''),type:'button','aria-label':Tp('Go to question '+(i+1),'前往第 '+(i+1)+' 題')},String(i+1)); b.onclick=()=>$('#mq'+i).scrollIntoView({behavior:'smooth',block:'center'}); d.appendChild(b); });
  $('#mk-cnt').innerHTML=`${Object.keys(mock.ans).length}/${MOCK_N} ${T('answered','已作答')}`;
}
function submitMock(){
  if(!mock||mock.done) return; mock.done=true; clearInterval(timerId);
  const used=Math.min(MOCK_SEC, Math.round((Date.now()-(mock.end-MOCK_SEC*1000))/1000));
  let s=0; const byW={}; mock.qs.forEach((q,i)=>{ const ok=mock.ans[i]===q.a; if(ok) s++; byW[q.w]=byW[q.w]||{s:0,n:0}; byW[q.w].n++; if(ok) byW[q.w].s++; });
  const best=store.get('best',null); if(!best||s>best.s) store.set('best',{s,n:MOCK_N});
  const pct=Math.round(100*s/MOCK_N);
  const root=$('#mockroot'); root.innerHTML='';
  const weakW=Object.entries(byW).filter(([w,v])=>v.s/v.n<0.7).map(([w])=>w);
  const weak=weakW.map(w=>'Week '+w), weakZ=weakW.map(w=>'第 '+w+' 週');
  const r=el('div',{class:'result'});
  r.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="big">${s} / ${MOCK_N}</div><div class="stat">${pct}% · ${T('time used','用時')} ${Math.floor(used/60)}m ${used%60}s</div></div><div class="row"><button class="btn pri" type="button" id="mk-again">${T('New mock quiz','新的模擬測驗')}</button><button class="btn" type="button" id="mk-home">${T('Back to intro','返回簡介')}</button></div></div>
  <div class="wk">${Object.keys(byW).sort().map(w=>{ const v=byW[w]; const good=v.s/v.n>=0.7; return `<div><b>${T('Week '+w,'第 '+w+' 週')}</b>${v.s}/${v.n} <span class="pill ${good?'ok':'no'}">${good?T('solid','穩固'):T('revise','要溫習')}</span></div>`; }).join('')}</div>
  <p>${weak.length?bi(`Go back to <b>${weak.join(', ')}</b> in Revise, then take another mock. Each one draws a fresh set of questions.`,`回到「溫習」重溫<b>${weakZ.join('、')}</b>，然後再做一次模擬測驗。每次都會抽出一組新題目。`):bi("Strong across every week. Take another mock to check it wasn't luck.",'每週都表現穩固。再做一次模擬測驗，確認不是運氣。')}</p>`;
  root.appendChild(r);
  const dd=el('div',{class:'dots',style:'margin-bottom:12px'}); root.appendChild(dd);
  mock.qs.forEach((q,i)=>{
    const ok=mock.ans[i]===q.a; const dot=el('button',{class:'dot '+(ok?'right':'wrong'),type:'button'},String(i+1)); dot.onclick=()=>$('#mq'+i).scrollIntoView({behavior:'smooth',block:'center'}); dd.appendChild(dot);
    const box=el('div',{class:'q',id:'mq'+i});
    box.innerHTML=`<div class="qn"><span>Q${i+1} · ${T('Week '+q.w,'第 '+q.w+' 週')}</span><span class="pill ${ok?'ok':'no'}">${ok?T('correct','正確'):(i in mock.ans?T('wrong','錯誤'):T('unanswered','未作答'))}</span></div><div class="qt">${qQ(q)}</div>`;
    const opts=el('div',{class:'opts'});
    q.order.forEach((oi,k)=>{ const cls=oi===q.a?' right':(mock.ans[i]===oi?' wrong':''); opts.appendChild(el('button',{class:'opt'+cls,type:'button',disabled:''},`<span class="k">${'ABCD'[k]}</span><span>${qO(q,oi)}</span>`)); });
    box.appendChild(opts); box.appendChild(el('div',{class:'ex'},qEx(q)));
    root.appendChild(box);
  });
  $('#mk-again').onclick=startMock; $('#mk-home').onclick=mockIntro;
  window.scrollTo({top:0});
}

/* ================= tabs & routing ================= */
function show(v){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===v?'true':'false'));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  if(v==='practice') renderPractice();
  if(v==='mock' && !(mock && !mock.done)) mockIntro();
  try{ if(location.hash!=='#'+v) history.replaceState(null,'','#'+v); }catch(e){}
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>show(t.dataset.v)));
function applyChrome(){
  document.documentElement.dataset.lang=LANG;
  document.documentElement.lang = LANG==='zh' ? 'zh-Hant-HK' : 'en';
  $('#tab-revise').innerHTML=T('Revise','溫習'); $('#tab-practice').innerHTML=T('Practice','練習'); $('#tab-mock').innerHTML=T('30-min mock quiz','30 分鐘模擬測驗');
  $('#brandsub').innerHTML=T('Information Security and Management · short quiz revision','資訊保安與管理 · 小測溫習');
  document.title = LANG==='en' ? 'CS4394 Weeks 1–6 Revision' : 'CS4394 Weeks 1–6 Revision 中英對照';
  document.querySelectorAll('.langsw button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===LANG?'true':'false'));
}
function setLang(l){
  LANG=l; store.set('lang',l); applyChrome();
  renderRail(); renderWeek();
  const cur=document.querySelector('.tab[aria-selected="true"]').dataset.v;
  if(cur==='practice') renderPractice();
  if(mock && !mock.done){ drawMock(); tick(); } else if(mock && mock.done){ /* keep result as is */ } else if(cur==='mock') mockIntro();
}
document.querySelectorAll('.langsw button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
applyChrome();
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(['revise','practice','mock'].includes(h)) show(h); });
renderRail(); renderWeek();
{ const h=location.hash.slice(1); if(['practice','mock'].includes(h)) show(h); }
