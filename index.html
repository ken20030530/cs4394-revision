 topics:[
 { id:'w1t1', t:'Asset, vulnerability, threat, attack, countermeasure', obj:'Define each and know how they differ.',
   b:`<p>Security means <b>protecting assets against threats</b>. Use the chain below. Each term is a different link.</p>
<table class="t"><tr><th>Term</th><th>Definition (slides)</th><th>Example</th></tr>
<tr><td><b>Asset</b></td><td>The thing we are trying to protect from threats.</td><td>Customer database</td></tr>
<tr><td><b>Vulnerability</b></td><td>A known weakness or flaw in the system that can be exploited.</td><td>Unpatched SQL injection bug</td></tr>
<tr><td><b>Threat</b></td><td>What the asset needs protection <i>from</i>; a potential cause of harm.</td><td>A criminal group wanting card data</td></tr>
<tr><td><b>Attack</b></td><td>When a potential threat becomes reality by <i>exploiting a vulnerability</i>.</td><td>The group runs SQL injection and dumps the table</td></tr>
<tr><td><b>Countermeasure</b></td><td>A control that reduces risk by removing the vulnerability, blocking the attack or limiting impact.</td><td>Patch, WAF, input validation</td></tr></table>
<div class="trap"><b>Exam trap:</b> A threat is only potential. An attack is the threat actually happening. A vulnerability is a weakness in <i>your</i> system, not the attacker.</div>
<p><b>Risk</b> is the possibility that a particular threat will adversely impact an information system by exploiting a particular vulnerability. Perfect security is impossible, so security is "all about managing risk". The defender must close every hole, but the attacker only needs one.</p><div class="eg try"><b>Try it · Name the parts</b><div class="tq">A hospital runs an old Windows server holding patient records. It has an unpatched remote-desktop bug. A ransomware gang scans the internet for that bug, breaks in and encrypts the records. The hospital then installs the patch and turns on multi-factor login. Identify the asset, vulnerability, threat, attack and countermeasures.</div><details><summary>Show answer</summary><div class="ta"><b>Asset</b>: patient records (and the server). <b>Vulnerability</b>: the unpatched remote-desktop bug. <b>Threat</b>: the ransomware gang, before it acts. <b>Attack</b>: the gang exploiting the bug and encrypting the records. <b>Countermeasures</b>: the patch and multi-factor login.</div></details></div>`},
 { id:'w1t2', t:'Risk management lifecycle', obj:'List and describe identification, assessment and treatment.',
   b:`<ul><li><b>1. Risk identification</b>: identify the vulnerabilities and threats in the environment.</li>
<li><b>2. Risk assessment</b>: judge how <i>likely</i> each risk is and how <i>severe</i> its impact would be. A common tool is ALE.</li>
<li><b>3. Risk treatment</b>: select the best strategy to address each risk (accept, avoid, mitigate or transfer).</li></ul>
<p>Risk management is the process an organization uses to identify and address the risks in its environment. Use the order identify → assess → treat.</p>
<div class="eg try"><b>Try it · Ford Pinto case study</b><div class="tq">Fixing the fuel tank would cost $11 per vehicle for 12.5M vehicles. Not fixing it was expected to cause 180 deaths ($200k each), 180 serious injuries ($67k each) and 2,100 burned vehicles ($700 each). Work out the cost and the benefit of the fix. What did Ford decide, and what is the lesson for risk management?</div><details><summary>Show answer</summary><div class="ta">Cost = 12.5M × $11 ≈ <b>$137.5M</b>. Benefit = 180×200k + 180×67k + 2,100×700 ≈ <b>$49.5M</b>. The cost exceeded the benefit by ≈ $88M, so Ford didn't fix it, which led to lawsuits, a recall and a reckless homicide charge. Lesson: pure monetary risk assessment can ignore ethics, legal and reputational costs.</div></details></div>`},
 { id:'w1t3', t:'Annualized Loss Expectancy (ALE)', obj:'Apply ALE to calculate and assess risk (Tutorial 1 Q1–Q2).',
   b:`<p><b>ALE = SLE × ARO</b> (the slides call ARO "incidence").</p>
<ul><li><b>SLE</b> (single loss expectancy) = cost of one occurrence = <b>Asset value × Exposure factor</b>.</li>
<li><b>ARO</b> (annualized rate of occurrence) = expected occurrences per year. "Once every 10 years" → ARO = 1/10 = 0.1.</li>
<li><b>ALE</b> = expected loss per year.</li></ul>
<div class="eg try"><b>Try it · Tutorial 1 Q1</b><div class="tq">A remote office is worth $800,000. A fire is expected once every 10 years and would destroy 60% of the facility. Find (a) the SLE, (b) the ARO and (c) the ALE.</div><details><summary>Show answer</summary><div class="ta">(a) SLE = 800,000 × 0.6 = <b>$480,000</b><br>(b) ARO = 1/10 = <b>0.1</b><br>(c) ALE = 480,000 × 0.1 = <b>$48,000 per year</b></div></details></div>
<p><b>Cost-benefit of a control:</b> value = ALE<sub>before</sub> − ALE<sub>after</sub> − annual cost of control. Positive means it's worth buying.</p>
<div class="eg try"><b>Try it · Tutorial 1 Q2</b><div class="tq">Current ALE is $80,000. ALE after installing a web application firewall would be $20,000. The WAF costs $15,000 a year. Based strictly on cost-benefit, should they buy it?</div><details><summary>Show answer</summary><div class="ta">80,000 − 20,000 − 15,000 = <b>$45,000 net benefit per year</b>, so yes. The WAF costs $15k but removes $60k of expected loss.</div></details></div>
<p><b>Prioritizing:</b> rank risks by ALE, not by single-loss size. In the bank example, SWIFT fraud ($50M × 0.005 = $250k ALE) outranks large ATM fraud ($250k × 0.2 = $50k), even though one is much rarer.</p>`},
 { id:'w1t4', t:'Risk treatment strategies', obj:'Describe acceptance, avoidance, mitigation, transfer and choose one for a scenario.',
   b:`<table class="t"><tr><th>Strategy</th><th>Meaning</th><th>Typical signal in a question</th></tr>
<tr><td><b>Acceptance</b></td><td>Tolerate the risk.</td><td>Cost of the control/insurance is greater than the potential loss; low ALE.</td></tr>
<tr><td><b>Avoidance</b></td><td>Don't do the activity that creates the risk.</td><td>"Disallow remote login", stop offering a service.</td></tr>
<tr><td><b>Mitigation</b></td><td>Act to reduce the loss (likelihood or impact).</td><td>Most technical countermeasures: firewall, patching, backups, encryption.</td></tr>
<tr><td><b>Transfer</b></td><td>Shift the risk to someone else.</td><td>Insurance contracts, outsourcing with liability clauses.</td></tr></table>
<div class="eg try"><b>Try it · Tutorial 1 Q3</b><div class="tq">An organization facing many web attacks buys cyber liability insurance and also deploys a firewall. Which two risk treatment strategies is it using?</div><details><summary>Show answer</summary><div class="ta"><b>Transfer</b> (the insurance shifts the financial risk) and <b>mitigation</b> (the firewall reduces the likelihood of loss).</div></details></div>
<div class="trap"><b>Exam trap:</b> A firewall doesn't avoid the risk, because the website still runs. It mitigates it. Avoidance means removing the activity itself.</div>`},
 { id:'w1t5', t:'Security principles: C, I, A, authentication, non-repudiation', obj:'Define each and give applications where each is most important.',
   b:`<ul><li><b>Confidentiality</b>: information is only accessed by authorized entities. Goal: prevent <i>unauthorized disclosure</i>. Matters most for: military and government secrets, medical records, HR data.</li>
<li><b>Integrity</b>: information is free from unauthorized alteration. Goal: prevent <i>unauthorized modification</i>. Matters most for: stock exchanges, banking ledgers, grade records. The slides say that for many commercial applications (for example, public stock exchanges) integrity matters more than confidentiality.</li>
<li><b>Availability</b>: reliable and timely access for authorized users. Threats are called <i>Denial of Service</i>. Matters most for: e-commerce sites, hospital systems, power grid control, emergency services.</li>
<li><b>Authentication</b>: we can trust that something comes from its claimed source.</li>
<li><b>Non-repudiation</b>: prevents an entity from denying its actions on data or transactions. Matters most for: contracts, online banking transfers, e-signatures.</li></ul>
<p>The "big three" are <b>CIA</b>. Which one matters most depends on context.</p>
<div class="eg try"><b>Try it · Slide scenarios</b><div class="tq">Which principle is violated in each? (1) A corporation's systems are penetrated and thousands of customers' data is stolen. (2) A student hacks the registrar's system and changes his grades. (3) An online retailer's site is overwhelmed by malicious traffic.</div><details><summary>Show answer</summary><div class="ta">(1) <b>Confidentiality</b>; (2) <b>Integrity</b>; (3) <b>Availability</b> (a DoS attack).</div></details></div>`}
 ]},
{ n:2, title:'Metapolicy, policy & Bell-LaPadula', sub:'Policy vs metapolicy, labels, PoLP, dominates, BLP properties, tranquility, MAC vs DAC',
 topics:[
 { id:'w2t1', t:'Policy vs metapolicy', obj:'Define both, explain the difference: policy = how, metapolicy = what and why.',
   b:`<ul><li><b>Policy</b>: a set of rules for implementing specific security goals. It's a <i>system-specific refinement</i> of the metapolicy that guides developers and users (the "rulebook"). It's written in terms of <i>mechanisms</i>: firewalls, encryption, locked drawers. → <b>HOW</b></li>
<li><b>Metapolicy</b>: a high-level policy stating the <i>overall security goals</i>. It's the framework for defining and managing sub-policies, usually expressed in terms of C, I, A. → <b>WHAT and WHY</b></li></ul>
<p>Without a clear metapolicy, a policy seems arbitrary and is hard to justify or evaluate. We still need the policy because the metapolicy is too general, can be interpreted in several ways, may allow multiple acceptable policies, and isn't directly enforceable.</p>
<div class="eg try"><b>Try it · HKID rules and Anne and Bill</b><div class="tq">(a) A university has the rules "staff may not use student HKIDs in documents" and "documents with HKIDs that must be kept are stored securely". Are these the policy or the metapolicy? What larger goal do they serve?<br>(b) The policy forbids copying homework. Anne forgets to read-protect her file and Bill copies it. Who breached security?</div><details><summary>Show answer</summary><div class="ta">(a) They are the <b>policy</b> (the how). The goal they serve, protecting the confidentiality of students' personal data, is the <b>metapolicy</b> (what and why).<br>(b) <b>Bill</b> breached security: the policy forbids copying and he did it. Anne didn't, because the policy didn't require her to protect her file. If it had, she would have breached it too.</div></details></div>
<div class="eg try"><b>Try it · Tutorial 1 Q6</b><div class="tq">What is the metapolicy and what is the policy of BLP?</div><details><summary>Show answer</summary><div class="ta">Metapolicy: information may only flow <b>upwards</b> in the lattice of security levels (protect confidentiality). Policy: the <b>Simple Security Property</b>, the <b>*-Property</b> and <b>tranquility</b>.</div></details></div>`},
 { id:'w2t2', t:'Security labels, clearances & least privilege', obj:'Recognise labels on objects and clearances on subjects; define PoLP.',
   b:`<p>A label has two parts:</p>
<ul><li>A <b>hierarchical level</b> from a linearly ordered set: Unclassified &lt; Confidential &lt; Secret &lt; Top Secret.</li>
<li>A set of <b>need-to-know categories</b> from an <i>unordered</i> set, for example {Nuclear, Crypto}.</li></ul>
<p>Example: <span class="lab">(Secret: {Nuclear, Crypto})</span>. On an <b>object</b> (document, file) it's a <i>sensitivity label</i>. On a <b>subject</b> (person, process) it's a <i>clearance</i>, with the same form.</p>
<p>A document with mixed content takes the <b>highest</b> level and <b>all</b> the categories it contains.</p>
<p><b>Principle of Least Privilege (PoLP):</b> any subject should have access to the <i>minimum</i> amount of information needed to do its job. Need-to-know categories are an instance of it: even at Top Secret, not everyone needs to know everything.</p>
<p>Terms: <b>Objects</b> are information containers; <b>subjects</b> are entities (users, processes) that request access; <b>actions</b> are the operations performed.</p><div class="eg try"><b>Try it · Labels and least privilege</b><div class="tq">(a) A report contains Secret information about Nuclear and Confidential information about Crypto. What label should it get?<br>(b) A payroll clerk is given admin rights to every company system "just in case". Which principle is broken?</div><details><summary>Show answer</summary><div class="ta">(a) <b>(Secret, {Nuclear, Crypto})</b>: use the highest level present and include every category.<br>(b) The <b>Principle of Least Privilege</b>. They should only get access to what payroll work needs.</div></details></div>`},
 { id:'w2t3', t:'The dominates relation', obj:'Compare two labels: which dominates, or are they incomparable?',
   b:`<p><span class="lab">(L1, S1) ≥ (L2, S2)</span> if and only if <b>L1 ≥ L2</b> <i>and</i> <b>S1 ⊇ S2</b> (superset).</p>
<p>Both conditions must hold. Dominates is a <b>partial order</b>: some pairs are <b>incomparable</b> (neither dominates).</p>
<div class="eg try"><b>Try it · Dominates pairs</b><div class="tq">Which label dominates, or are they incomparable? (Exercises 1 Q4 and Tutorial 1 Q4)<ol><li>(S,{R}) vs (C,{R})</li><li>(S,{R}) vs (S,{R,M})</li><li>(C,{F}) vs (C,{R})</li><li>(S,{R}) vs (C,{R,M})</li><li>(TS,{R}) vs (S,{R,M})</li><li>(S,{R,M}) vs (C,{M})</li><li>(U,{}) vs (C,{})</li><li>(H,{A,B}) vs (H,{C,D})</li></ol></div><details><summary>Show answer</summary><div class="ta"><ol><li>First dominates: S ≥ C and {R} ⊇ {R}</li><li>Second dominates: levels equal, {R,M} ⊇ {R}</li><li>Incomparable. Levels are equal, but {F} ⊉ {R} and {R} ⊉ {F}, so both directions fail on categories.</li><li>Incomparable. (S,{R}) ≥ (C,{R,M})? S ≥ C ✓ but {R} ⊉ {R,M} ✗ (missing M). (C,{R,M}) ≥ (S,{R})? {R,M} ⊇ {R} ✓ but C ≥ S ✗. Both directions fail.</li><li>Incomparable. (TS,{R}) ≥ (S,{R,M})? TS ≥ S ✓ but {R} ⊉ {R,M} ✗. (S,{R,M}) ≥ (TS,{R})? {R,M} ⊇ {R} ✓ but S ≥ TS ✗. Both directions fail.</li><li>First dominates: S ≥ C and {R,M} ⊇ {M}</li><li>Second dominates: C ≥ U, {} ⊇ {}</li><li>Incomparable. Levels are equal, but {A,B} and {C,D} don't contain each other, so both directions fail.</li></ol></div></details></div>
<div class="trap"><b>Exam trap:</b> Top Secret doesn't automatically beat Secret. Check the category sets <i>first</i>; a missing category makes the labels incomparable. The empty set {} is a subset of every set.</div>`},
 { id:'w2t4', t:'Bell-LaPadula: Simple Security & *-Property, building an ACM', obj:'Apply both properties with dominates to give R, W, RW or N/A, and fill in an ACM.',
   b:`<ul><li><b>Simple Security Property</b> (no read up): S may <b>read</b> O only if <b>S ≥ O</b>.</li>
<li><b>*-Property</b> (star, no write down): S may <b>write</b> O only if <b>S ≤ O</b> (O dominates S).</li></ul>
<p>The permission recipe for each cell:</p>
<table class="t"><tr><th>Relationship</th><th>Permission</th></tr>
<tr><td>S dominates O (strictly)</td><td><b>R</b></td></tr>
<tr><td>O dominates S (strictly)</td><td><b>W</b> (write up, "blind write")</td></tr>
<tr><td>Labels equal</td><td><b>RW</b>: the only way to get both</td></tr>
<tr><td>Incomparable</td><td><b>–</b> (no access)</td></tr></table>
<div class="eg try"><b>Try it · Tutorial 1 Q9</b><div class="tq">Levels U &lt; C &lt; S &lt; TS; categories R, M, F. Fill in R, W, RW or – for each cell before revealing.<div class="scroll"><table class="t"><tr><th></th><th>Public (U,ø)</th><th>Internal (C,ø)</th><th>Research (S,{R})</th><th>Military (S,{R,M})</th></tr><tr><th>Alice (C,{R})</th><td></td><td></td><td></td><td></td></tr><tr><th>Bob (S,{R,M})</th><td></td><td></td><td></td><td></td></tr><tr><th>Carol (TS,{R,M,F})</th><td></td><td></td><td></td><td></td></tr><tr><th>Dave (U,ø)</th><td></td><td></td><td></td><td></td></tr></table></div>You can also fill it in and get marked under <b>Practice → Access control matrix</b>.</div><details><summary>Show answer</summary><div class="ta"><div class="scroll"><table class="t"><tr><th></th><th>Public</th><th>Internal</th><th>Research</th><th>Military</th></tr><tr><th>Alice</th><td>R</td><td>R</td><td>W</td><td>W</td></tr><tr><th>Bob</th><td>R</td><td>R</td><td>R</td><td>RW</td></tr><tr><th>Carol</th><td>R</td><td>R</td><td>R</td><td>R</td></tr><tr><th>Dave</th><td>RW</td><td>W</td><td>W</td><td>W</td></tr></table></div></div></details></div>
<p>Typical short questions: Confidential user denied reading a Secret file → <b>Simple Security Property</b>. Secret process writing to a Confidential file → <b>denied by the *-Property</b> (no write down), because it could leak Secret data. TS admin copying a log to an Unclassified server → blocked by the <b>*-Property</b>. Read <i>and</i> write access needs <b>identical labels</b>.</p>
<p>Why the *-Property matters for computers: the subject may be a <i>program</i> (possibly a Trojan horse) running on behalf of a cleared user, so it can't be trusted not to leak downwards. BLP doesn't stop a low subject from overwriting a high file; that's an integrity problem, not a confidentiality one.</p>
<p>For a large system the ACM would be huge. It's implicit in the rules, so permissions are computed on the fly.</p>`},
 { id:'w2t5', t:'Weak vs strong tranquility', obj:'Describe both tranquility properties.',
   b:`<ul><li><b>Strong tranquility</b>: subjects and objects <i>never change labels</i> during the system's lifetime.</li>
<li><b>Weak tranquility</b>: labels may change, but <i>not in a way that violates the spirit of the security policy</i>.</li></ul>
<p>Why we need tranquility: lowering an object from (TS,{Crypto}) to (U,{Crypto}) without changing its contents is effectively a <b>write down</b> and breaks confidentiality. Simple Security and the *-Property alone don't prevent it.</p>
<div class="eg try"><b>Try it · Tutorial 1 Q5</b><div class="tq">(a) In a BLP system, would raising the classification of an object violate any properties?<br>(b) An admin securely wipes every file on a "Top Secret" partition, then the system downgrades the partition to "Unclassified". Would BLP allow this?</div><details><summary>Show answer</summary><div class="ta">(a) No leak happens: some subjects lose access, but confidentiality isn't violated. It's acceptable under <b>weak</b> tranquility (not strong).<br>(b) No classified information remains, so it doesn't violate the spirit of the policy. <b>Weak tranquility allows it; strong tranquility doesn't.</b></div></details></div>
<p><b>BLP = Simple Security + *-Property + Tranquility</b> (Bell and LaPadula, 1973–75, US DoD). It focuses on <b>confidentiality</b> only.</p>`},
 { id:'w2t6', t:'MAC vs DAC', obj:'Describe the difference and give examples of each.',
   b:`<ul><li><b>Mandatory Access Control (MAC)</b>: rules are enforced on <i>every</i> access attempt by a system-wide policy, and ordinary users can't change them. Examples: <b>BLP</b>, Biba, Lipner (military classification systems).</li>
<li><b>Discretionary Access Control (DAC)</b>: enforcement may be waived or modified by some users, typically the object's <i>owner</i>. Examples: <b>Unix file permissions</b> (chmod by the owner), <b>Windows NTFS permissions</b>.</li></ul>
<p>Any access control policy can be represented by an <b>access control matrix</b>: subjects as rows, objects as columns, and the allowed actions in each cell.</p><div class="eg try"><b>Try it · MAC or DAC?</b><div class="tq">Classify each: (1) you share a Google Drive file with a friend; (2) a military system blocks a Secret user from a Top Secret file, and no one can override it; (3) <code>chmod 777 report.txt</code> on Unix; (4) Biba integrity labels enforced by the OS.</div><details><summary>Show answer</summary><div class="ta">(1) <b>DAC</b>, the owner decides. (2) <b>MAC</b>, system-wide and not changeable. (3) <b>DAC</b>, the owner changes permissions. (4) <b>MAC</b>.</div></details></div>`}
 ]},
{ n:3, title:'Lattices, covert channels & non-interference', sub:'Lattice drawing, storage vs timing channels, SRM, NI vs BLP',
 topics:[
 { id:'w3t1', t:'Drawing a lattice of security labels', obj:'Draw the lattice for a set of labels; information flows upward.',
   b:`<p>Labels under dominates form a partial order, which gives a <b>lattice</b>. It structures labels by hierarchy and is used for <b>information flow control</b>.</p>
<ul><li>Put the lowest label (for example (U,{})) at the <b>bottom</b> and the highest at the top.</li>
<li>Draw an arrow from A <b>up</b> to B when A ≤ B and there's <i>no label in between</i>. Skip arrows implied by <b>transitivity</b> (A≤B, B≤C ⇒ A≤C).</li>
<li>Never draw an arrow between <b>incomparable</b> labels.</li>
<li>A path from L1 to L2 means information may flow from L1 to L2: an L2 subject can read L1, or an L1 subject can write to L2.</li></ul>
<div class="trap"><b>Exam trap:</b> Arrows point <b>upward</b>, from the dominated label to the dominating one. Any downward flow is a violation of the BLP metapolicy.</div>
<p>Practice Tutorial 1 Q10 under <b>Practice → Lattice builder</b>: sketch it yourself, then reveal the answer.</p><div class="eg"><b>Worked example · Week 3 slide: levels H &gt; L, categories {A, B}</b><div class="tq">Labels: (L,{}), (L,{A}), (L,{B}), (L,{A,B}), (H,{}), (H,{A}), (H,{B}), (H,{A,B}).<ol><li>Bottom: <b>(L,{})</b>, the lowest level with the fewest categories. Top: <b>(H,{A,B})</b>.</li><li>Directly above (L,{}) are the labels that add exactly one thing: (L,{A}), (L,{B}) and (H,{}).</li><li>Keep adding one step at a time: (L,{A}) goes up to (L,{A,B}) (add B) and to (H,{A}) (raise level).</li><li>Don't draw (L,{}) → (L,{A,B}): it's implied by (L,{}) → (L,{A}) → (L,{A,B}) (transitivity).</li><li>No arrow between (L,{A}) and (L,{B}), or between (H,{}) and (L,{A}): incomparable.</li></ol><div class="latfig" data-k="w3"></div>It looks like a cube. Information can only travel <b>up</b> the arrows.</div></div><div class="eg try"><b>Try it · Tutorial 1 Q10</b><div class="tq">Draw the lattice for: (Public,{}), (Secret,{Alpha}), (Secret,{Beta}), (Confidential,{Beta}), (Top Secret,{Alpha,Beta}), (Confidential,{Alpha,Beta}).<br><i>Hint: Secret{Alpha} doesn't dominate Confidential{Beta} (missing Beta), so Public must connect to Secret{Alpha} directly.</i></div><details><summary>Show answer</summary><div class="ta"><div class="latfig" data-k="t1q10"></div>Arrows: Public → Secret{Alpha}; Public → Conf{Beta}; Conf{Beta} → Secret{Beta}; Conf{Beta} → Conf{Alpha,Beta}; Secret{Alpha} → TS{Alpha,Beta}; Secret{Beta} → TS{Alpha,Beta}; Conf{Alpha,Beta} → TS{Alpha,Beta}.<br>No arrow between Secret{Alpha} and Conf{Alpha,Beta}: Secret is higher but missing Beta, so they're incomparable.</div></details></div><div class="eg try"><b>Try it · Week 3 slide: total order?</b><div class="tq">Labels: (L,{}), (H,{A,B,C}), (L,{A}), (H,{A,B}), (L,{A,B}). (a) Can they be put in a single line (total order) where each dominates the one before? (b) What if (L,{B,C}) is added?</div><details><summary>Show answer</summary><div class="ta">(a) <b>Yes</b>: (L,{}) ≤ (L,{A}) ≤ (L,{A,B}) ≤ (H,{A,B}) ≤ (H,{A,B,C}). Each step adds a category or raises the level.<br>(b) <b>No</b>. (L,{B,C}) is incomparable with (L,{A}), (L,{A,B}) and (H,{A,B}), because none of their sets contains {B,C} and {B,C} doesn't contain theirs. Now it's only a <b>partial order</b>, so you get a lattice with branches:<div class="latfig" data-k="w3b"></div></div></details></div><div class="eg try"><b>Try it · Practice set using the slide's Air/Sea labels</b><div class="tq">Draw the lattice for: (U,{}), (C,{Air}), (C,{Sea}), (S,{Air,Sea}), (TS,{Sea}), (TS,{Air,Sea}).</div><details><summary>Show answer</summary><div class="ta"><div class="latfig" data-k="ex"></div>(TS,{Sea}) and (S,{Air,Sea}) are incomparable: TS is higher, but {Sea} is missing Air. Both lead up to (TS,{Air,Sea}).</div></details></div>`},
 { id:'w3t2', t:'Covert channels: storage vs timing', obj:'Define, give examples and classify a description as storage or timing.',
   b:`<p><b>Definition:</b> a path for the <i>illegal flow of information between subjects</i> within a system, using system resources not designed for inter-subject communication. It violates the <i>metapolicy</i> but not necessarily the <i>policy</i>, so BLP's rules can be satisfied while information still leaks from high to low.</p>
<table class="t"><tr><th></th><th>Covert storage channel</th><th>Covert timing channel</th></tr>
<tr><td>Information is carried in</td><td>The <b>system state</b>: an attribute of a shared object</td><td>The <b>ordering or duration of events</b></td></tr>
<tr><td>Receiver needs</td><td>To see the attribute</td><td>A <b>time reference</b> (clock, timer, ordering)</td></tr>
<tr><td>Examples</td><td>CREATE/DESTROY a file that low checks for; "resource not found" vs "access denied" errors; toggling a file's existence (Exercises 2 Q1)</td><td>KVM/370: use the full CPU time slice or give it up early; varying CPU usage (Exercises 2 Q2); disk-arm order: q gets 139 then 161, or 161 then 139</td></tr></table>
<p>Other types: implicit (control flow, <code>if h==1 then l=1</code>), termination, probability, resource exhaustion, power. In practice, most people distinguish only storage and timing.</p>
<p><b>Characteristics:</b> existence, bandwidth (real channels can reach thousands of bits per second), noisy or noiseless. <b>Responses:</b> eliminate (modify the implementation), reduce bandwidth (add noise), or monitor (intrusion detection). For the CPU timing channel: give every process a fixed time slice it can't give up early, or remove or add noise to the clock the receiver uses.</p>
<p><b>Why they're hard to eliminate</b> (Exercises 2 Q4): large systems have huge numbers of shared resources and attributes, and many interferences are benign. Finding all channels needs deep knowledge of the semantics of every operation, so it's usually infeasible.</p>
<p>Microarchitecture examples: <b>Meltdown</b> (kernel memory) and <b>Foreshadow</b> (L1 cache) both exploit out-of-order execution.</p><div class="eg try"><b>Try it · Storage or timing?</b><div class="tq">(1) A high process makes the printer queue full (1) or empty (0); a low process checks if its print job is accepted. (2) A high process does heavy disk work (1) or none (0); a low process measures how long its own disk reads take. (3) A high process locks (1) or unlocks (0) a shared file; a low process tries to open it. (4) Exercises 2 Q2: how could you shut down a CPU-time channel?</div><details><summary>Show answer</summary><div class="ta">(1) <b>Storage</b>: the state "queue full" carries the bit. (2) <b>Timing</b>: the receiver measures duration. (3) <b>Storage</b>: the lock state carries the bit. (4) Give every process a <b>fixed time slice</b> it can't give up early, or <b>remove or add noise to the clock</b> the receiver uses.</div></details></div>`},
 { id:'w3t3', t:'Shared Resource Matrix methodology (SRM)', obj:'Explain how SRM detects potential covert channels (you won\'t be asked to do one).',
   b:`<ul><li>Proposed by <b>Kemmerer</b> (early 1980s) to find potential <b>storage and timing</b> channels.</li>
<li>Build a table from the system's <b>functional specification</b>: <b>rows = shared attributes</b> (file existence, size, level...), <b>columns = operations</b> (READ, WRITE, CREATE, DESTROY).</li>
<li>Mark <b>R</b> if the operation <i>references</i> (reveals information about) the attribute in some circumstances, and <b>M</b> if it <i>modifies</i> the attribute.</li>
<li><b>An R and an M in the same row indicate a potential covert channel</b>: one subject can modify the attribute and another can observe it.</li>
<li>SRM doesn't identify channels outright; it suggests where to look. Each matrix is specific to one system.</li></ul>
<p>This follows from the storage-channel conditions: the sender must be able to modify a shared attribute and the receiver must be able to view it. In practice, you use BLP for normal flows, SRM to find covert channels, then close, restrict or monitor them.</p><div class="eg"><b>Worked example · A small SRM table</b><div class="tq">Using the Week 3 operations (READ, WRITE, CREATE, DESTROY) on a shared file:<div class="scroll"><table class="t"><tr><th>Attribute</th><th>READ</th><th>WRITE</th><th>CREATE</th><th>DESTROY</th></tr><tr><td>File existence</td><td>R</td><td></td><td>R, M</td><td>M</td></tr><tr><td>File size</td><td>R</td><td>M</td><td>M</td><td>M</td></tr><tr><td>File level</td><td>R</td><td></td><td>M</td><td>M</td></tr></table></div>Every row has an <b>R and an M</b>, so each attribute could carry a covert signal. For example, a high subject CREATEs or DESTROYs a file (M on existence), and a low subject tries CREATE with the same name and notices whether anything happens (R). This is the slides' 1-bit channel. The table only marks the <b>suspects</b>; an analyst then checks each one.</div></div><div class="eg try"><b>Try it · Explain SRM</b><div class="tq">In your own words, how does SRM help detect covert channels? (You won't be asked to build one, just to explain it.)</div><details><summary>Show answer</summary><div class="ta">Build a matrix from the system's functional spec: <b>rows = shared attributes</b>, <b>columns = operations</b>. Mark <b>M</b> where an operation can modify the attribute and <b>R</b> where it can reveal it. A row with <b>both R and M</b> means one subject could change the attribute and another could observe it: a <b>potential</b> storage or timing channel to investigate. It points to suspects; it doesn't prove a channel exists (Kemmerer, 1980s).</div></details></div>`},
 { id:'w3t4', t:'Non-interference (NI) and what BLP misses', obj:'Define NI; explain what it addresses that BLP doesn\'t (covert channels).',
   b:`<p><b>Non-interference</b> is an <b>information flow policy</b>. Instead of rules about which subject reads or writes which object, it states <i>which subjects may interfere with which</i>. "A interferes with B" means A does something with an effect visible to B.</p>
<ul><li>Specified as a <b>reflexive binary relation</b> over subjects, for example S1 → S2, S2 → S3.</li>
<li>For L → H only: <b>nothing H does may have any effect visible to L</b>.</li></ul>
<p><b>Why it's more comprehensive than BLP:</b> BLP only controls flows through the <i>contents of objects</i> (read and write). NI covers <b>everything L can observe</b>: file existence, system flags, the system clock. So it rules out covert storage <i>and</i> timing channels by definition. NI mimics the confidentiality metapolicy directly.</p>
<ul><li>Any MLS (BLP) policy can be rewritten as an NI policy: Si → Sj if Sj dominates Si.</li>
<li>Not every NI policy can be written as MLS, because NI need not be <b>transitive</b>. Example: a firewall policy INTERNET → Firewall → LAN with no direct Internet → LAN.</li>
<li>Downside: proving NI for realistic systems is extremely difficult, because interferences are common and many are benign.</li></ul><div class="eg try"><b>Try it · Non-interference</b><div class="tq">(a) Exercises 2 Q5: why is NI more comprehensive than BLP for leakage?<br>(b) A firewall policy is INTERNET → Firewall → LAN, with no direct INTERNET → LAN. Can this be written as a BLP (MLS) policy?</div><details><summary>Show answer</summary><div class="ta">(a) BLP only controls reading and writing <b>object contents</b>. NI says <b>nothing</b> H does may have an effect visible to L, so covert storage and timing channels are covered too.<br>(b) <b>No.</b> MLS policies are transitive (A → B and B → C means A → C), but this NI policy deliberately isn't.</div></details></div>`},
 { id:'w3t5', t:'Integrity basics (bridge to Week 4)', obj:'Background used by Biba and Lipner.',
   b:`<ul><li>Integrity asks who can write, modify or generate information. It's fuzzier and more context-dependent than confidentiality, and a program can damage integrity on its own just by computing incorrectly.</li>
<li><b>Integrity labels</b> have the same form as BLP labels (a level of trustworthiness plus categories of competence, for example (Expert: {Physics})), and dominates works the same way. They <b>aren't</b> clearance labels: confidentiality and integrity are <b>orthogonal</b>, so a system that enforces both needs both sets of labels.</li>
<li>Integrity metapolicy: <b>don't let bad information "taint" good</b>, meaning information shouldn't flow <i>up</i> in integrity. So: no write up and no read down (in integrity).</li>
<li>Commercial principles: separation of duty, separation of function, auditing.</li></ul><div class="eg try"><b>Try it · Integrity labels</b><div class="tq">(a) Do (Expert,{Physics}) and (Student,{Physics}) compare? (b) What about (Novice,{Physics, Arts}) vs (Expert,{Physics})? (c) State the integrity metapolicy in one line.</div><details><summary>Show answer</summary><div class="ta">(a) Yes: <b>Expert dominates</b> (higher level, same set). (b) <b>Incomparable</b>: the Novice has the bigger set but the lower level, so they point opposite ways. (c) <b>Information must not flow up in integrity</b>: bad data mustn't taint good data.</div></details></div>`}
 ]},
{ n:4, title:'Integrity models & commercial policies', sub:'Biba ×3, BLP+Biba, Lipner, Clark-Wilson, Chinese Wall, RBAC, storing the ACM',
 topics:[
 { id:'w4t1', t:'Biba: Strict Integrity, Low Water Mark, Ring', obj:'Know the read and write rules for each of Biba\'s three policies.',
   b:`<table class="t"><tr><th>Policy</th><th>Read rule</th><th>Write rule</th><th>Trust in subject</th></tr>
<tr><td><b>Strict Integrity</b> (the "Biba model")</td><td>Simple Integrity Property: s reads o only if <b>i(s) ≤ i(o)</b> (no read down)</td><td>Integrity *-Property: s writes o only if <b>i(o) ≤ i(s)</b> (no write up)</td><td>Least trusting</td></tr>
<tr><td><b>Low Water Mark</b></td><td>Can read anything, but afterwards <b>i′(s) = min(i(s), i(o))</b>, so the subject's level drops</td><td>Only if i(o) ≤ i(s)</td><td>Middle</td></tr>
<tr><td><b>Ring</b></td><td><b>Any</b> subject can read any object</td><td>Only if i(o) ≤ i(s)</td><td>Most trusting: assumes the subject filters what it reads</td></tr></table>
<ul><li><b>Common to all three</b> (Tutorial 2 Q4): none allows <b>writing up</b> in integrity.</li>
<li><b>Ranking by trust in subjects</b> (Tutorial 2 Q3): Ring &gt; Low Water Mark &gt; Strict.</li>
<li>Low Water Mark problem: <b>label creep</b>. Subjects keep falling until none can access high-integrity objects.</li>
<li>Low Water Mark, like the Chinese Wall, depends on <b>past accesses</b> (Tutorial 2 Q2).</li>
<li><b>Why is Strict Integrity the "dual" of BLP?</b> (Tutorial 2 Q1) Its rules are BLP's rules with the inequalities reversed. BLP is no read up and no write down (for confidentiality); Strict Integrity is no read down and no write up (for integrity).</li></ul><div class="eg try"><b>Try it · Week 4 slide: Biba Strict matrix</b><div class="tq">Integrity levels H &gt; L. Subjects: Subj1 (H,{A,B,C}), Subj2 (L,{}), Subj3 (L,{A,B}). Objects: Obj1 (L,{A,B,C}), Obj2 (L,{}), Obj3 (L,{B,C}). Use read if i(s) ≤ i(o) and write if i(o) ≤ i(s). Fill in R, W, RW or –.</div><details><summary>Show answer</summary><div class="ta"><div class="scroll"><table class="t"><tr><th></th><th>Obj1 (L,{A,B,C})</th><th>Obj2 (L,{})</th><th>Obj3 (L,{B,C})</th></tr><tr><td><b>Subj1</b> (H,{A,B,C})</td><td>W</td><td>W</td><td>W</td></tr><tr><td><b>Subj2</b> (L,{})</td><td>R</td><td>RW</td><td>R</td></tr><tr><td><b>Subj3</b> (L,{A,B})</td><td>R</td><td>W</td><td>–</td></tr></table></div>Subj1 dominates every object, so it can only write (down). Subj3 vs Obj3 is incomparable, so there's no access. Compare with BLP, where the same "subject dominates" case gives R instead of W.</div></details></div><div class="eg try"><b>Try it · Low Water Mark</b><div class="tq">A subject at integrity <b>High</b> reads an object at integrity <b>Low</b> under Low Water Mark. (a) Is the read allowed? (b) What happens to the subject? (c) Can it now write to a High object?</div><details><summary>Show answer</summary><div class="ta">(a) <b>Yes</b>, Low Water Mark allows reads. (b) Its level drops: i′(s) = min(High, Low) = <b>Low</b>. (c) <b>No</b>: writing requires i(o) ≤ i(s), and High ≤ Low is false. Repeated reads like this cause <b>label creep</b>.</div></details></div>`},
 { id:'w4t2', t:'Combining BLP with Strict Integrity', obj:'Apply all four properties to find read and write permissions.',
   b:`<p>Each subject and object has a confidentiality label <i>and</i> an integrity label. Access is allowed <b>only if both BLP and Biba allow it</b>.</p>
<ul><li><b>Read</b> needs C(s) ≥ C(o) [BLP Simple Security] <b>and</b> I(s) ≤ I(o) [Simple Integrity].</li>
<li><b>Write</b> needs C(s) ≤ C(o) [BLP *-Property] <b>and</b> I(s) ≥ I(o) [Integrity *-Property].</li></ul>
<div class="eg try"><b>Try it · Combining the results</b><div class="tq">For one subject and object, BLP gives <b>RW</b> and Biba gives <b>W</b>. In another cell, BLP gives <b>R</b> and Biba gives <b>W</b>. What is the combined permission in each?</div><details><summary>Show answer</summary><div class="ta">Keep only letters allowed by <b>both</b>: RW ∩ W = <b>W</b>; R ∩ W = <b>–</b> (no access).</div></details></div>
<p>Practise in <b>Practice → Access control matrix</b> using the "BLP + Biba" mode.</p>`},
 { id:'w4t3', t:'Lipner\'s Integrity Matrix Model', obj:'Give a general description: which concerns does it address?',
   b:`<p>Lipner's model addresses the <b>commercial integrity concerns</b> Lipner described:</p>
<ol><li>Users don't write their own programs; they use existing production software.</li>
<li>Programmers develop and test on a <i>non-production</i> system, possibly with contrived data.</li>
<li>Moving applications from development to production needs a special <b>controlled and audited</b> process.</li>
<li>Managers and auditors must have access to system state and system logs.</li></ol>
<p>It's a <b>hybrid of BLP and Biba Strict Integrity</b>. Confidentiality levels are AM (audit manager) &gt; SL (system low), with categories SP, SD, SSD. Integrity levels are ISP &gt; IO &gt; ISL, with categories ID, IP. Labels are assigned by role and need-to-know.</p>
<p>A special <b>downgrade</b> privilege (held by system controllers) is needed to move software from development to production. This means changing labels, which BLP and Biba alone can't do, so it relaxes tranquility.</p>
<div class="eg try"><b>Try it · Tutorial 2 Q5</b><div class="tq">In Lipner's model (SL &lt; AM), an ordinary user has confidentiality (SL,{SP}) and integrity (ISL,{IP}). Production code is (SL,{SP}) / (IO,{IP}). System logs are (AM,{SP,SD,SSD}) / (ISL,ø). Can the user (a) read production code, (b) write to system logs?</div><details><summary>Show answer</summary><div class="ta">(a) BLP read OK (equal labels); Biba read OK because ISL ≤ IO → <b>permitted</b>.<br>(b) BLP write up OK (user ≤ logs); Biba write OK because (ISL,ø) ≤ (ISL,{IP}) → <b>permitted</b>. Users can add to the logs but can't read them, since that would be a BLP read up.</div></details></div>`},
 { id:'w4t4', t:'Clark-Wilson: concerns and the four categories', obj:'The four fundamental concerns, plus CDI, UDI, TP and IVP.',
   b:`<p>Commercial integrity is about <b>consistency</b>: data must satisfy integrity constraints (for a bank, start-of-day funds + deposits − withdrawals = end-of-day funds).</p>
<p><b>Four fundamental concerns:</b></p>
<ol><li><b>Authentication</b>: the identity of every user is properly authenticated.</li>
<li><b>Audit</b>: modifications are logged (what program ran, and by whom) in a way that can't be subverted.</li>
<li><b>Well-formed transactions</b>: users manipulate data only in constrained ways.</li>
<li><b>Separation of duty</b>: each user is tied to a valid set of programs, which prevents unauthorized modification.</li></ol>
<p><b>Four categories:</b></p>
<ul><li><b>CDI</b> (constrained data item): data whose integrity is protected, for example account balances.</li>
<li><b>UDI</b> (unconstrained data item): data not covered by the policy, for example keyboard input.</li>
<li><b>TP</b> (transformation procedure): the <i>only</i> procedures allowed to modify CDIs or turn UDIs into CDIs; they move the system from one valid state to another.</li>
<li><b>IVP</b> (integrity verification procedure): checks that CDIs are in a valid state.</li></ul><div class="eg try"><b>Try it · Name the Clark-Wilson parts</b><div class="tq">Online banking: (1) customers' account balances; (2) the amount typed into the "transfer" box; (3) the "Transfer funds" program; (4) the nightly job checking that total deposits − withdrawals match the balances; (5) the transaction log. Classify each as CDI, UDI, TP or IVP.</div><details><summary>Show answer</summary><div class="ta">(1) <b>CDI</b>. (2) <b>UDI</b>: untrusted input until a TP validates it. (3) <b>TP</b>. (4) <b>IVP</b>. (5) <b>CDI</b>: an append-only log, as required by C4.</div></details></div>`},
 { id:'w4t5', t:'Clark-Wilson rules: certification vs enforcement, C4, E4, access triples', obj:'Know what each rule type is for; describe C4 and E4; explain access triples.',
   b:`<ul><li><b>Certification rules (C1–C5)</b>: checked by a trusted human <b>certifier</b> or security officer. They confirm that procedures are correct, for example that IVPs and TPs are valid. The system can't check these itself.</li>
<li><b>Enforcement rules (E1–E4)</b>: enforced <b>automatically by the system</b>. They maintain the certified relations at runtime.</li></ul>
<table class="t"><tr><th>Rule</th><th>Content</th></tr>
<tr><td>C1</td><td>IVPs must ensure CDIs are in a valid state when run</td></tr>
<tr><td>C2</td><td>TPs must be certified as integrity-preserving (valid → valid)</td></tr>
<tr><td>C3</td><td>Assignment of TPs to users must satisfy separation of duty</td></tr>
<tr><td><b>C4</b></td><td><b>Operation of TPs must be logged</b>: each TP appends enough information to reconstruct the operation to an <i>append-only CDI</i> (the log), so auditors can see what happened</td></tr>
<tr><td>C5</td><td>TPs taking UDIs must only perform valid transformations (reject the input or turn it into a valid CDI)</td></tr>
<tr><td>E1</td><td>Only certified TPs may manipulate CDIs</td></tr>
<tr><td>E2</td><td>Users may only access CDIs through TPs they're authorized for</td></tr>
<tr><td>E3</td><td>Each user executing a TP must be authenticated</td></tr>
<tr><td><b>E4</b></td><td><b>Only the certifier of a TP may change the list of entities associated with that TP, and no certifier may have execute permission on that entity</b>. This enforces separation of duty.</td></tr></table>
<p><b>Why E4 matters</b> (Tutorial 2 Q6b): it prevents one person from both certifying and executing a TP. That stops a single insider from approving their own fraudulent transactions; collusion would be needed. <b>Why C4 matters:</b> accountability and recoverability, since an auditor can reconstruct every transaction.</p>
<p><b>Access triple:</b> <span class="lab">(user, TP, {CDI set})</span>. The user may run that TP on those CDIs. Triples encode the <i>allowed relation</i>, and every triple must satisfy all the C and E rules.</p>
<p>Compared with Biba: Biba has no certification rules and relies on trusted subjects. Clark-Wilson certifies the <i>method</i> used to upgrade untrusted data, not the data itself.</p><div class="eg try"><b>Try it · Certification vs enforcement</b><div class="tq">Which rule applies, and is it certification or enforcement? (1) The system refuses to let Bob run "Approve payment" because he isn't in its allowed list. (2) A security officer reviews the "Transfer" program's code to confirm it keeps the books balanced. (3) Carol certified the "Payroll" TP, so the system won't let her run it. (4) Every TP writes a record to an append-only log.</div><details><summary>Show answer</summary><div class="ta">(1) <b>E2</b>, enforcement: users access CDIs only through TPs they're authorized for. (2) <b>C2</b>, certification: TPs certified as integrity-preserving. (3) <b>E4</b>, enforcement and separation of duty: the certifier can't execute. (4) <b>C4</b>, certification: logging.</div></details></div>`},
 { id:'w4t6', t:'Chinese Wall policy', obj:'Commercial concern; objects, company datasets, COI classes; CW Simple Security and *-Property.',
   b:`<p><b>Concern:</b> <b>conflicts of interest</b> and inadvertent disclosure by a consultant or contractor (Brewer and Nash, 1989). Example: a lawyer advising Cathay Pacific shouldn't also advise Hong Kong Airlines, but McDonald's is fine. Strictly, it's an access control <i>confidentiality</i> policy.</p>
<p><b>Three levels of abstraction:</b></p>
<ul><li><b>Objects</b>: individual items such as files, each about <i>one</i> company.</li>
<li><b>Company dataset (CD)</b>: all objects about one company.</li>
<li><b>Conflict of interest (COI) class</b>: the datasets of competing companies, for example {Ford, Chrysler, GM} or {HSBC, StanChart, Citibank}.</li></ul>
<p><b>CW Simple Security (read):</b> s can read o only if o is in a CD that s has <i>already accessed</i> (inside the wall), <b>or</b> in an entirely different COI class, <b>or</b> o is <b>sanitized</b>.</p>
<p><b>CW *-Property (write):</b> s can write o only if (1) s is allowed to read o, <b>and</b> (2) every <i>unsanitized</i> object s can read is in the <b>same CD</b> as o. This prevents <i>indirect</i> leaks: if Anthony (who has read Bank 1) could write to Gas, Susan (who has read Bank 2) could then read Bank 1's information through Gas.</p>
<p><b>How the read rule addresses conflict of interest:</b> once you read one company in a COI class, all its competitors are permanently blocked. You can't hold insider knowledge of two competitors.</p>
<p>Compared with BLP: CW has <b>no labels</b> and depends on the <b>history of past accesses</b>, so permissions change dynamically. Initially a subject can read anything.</p><div class="eg try"><b>Try it · Chinese Wall</b><div class="tq">COI classes: Banks {HSBC, Citi} and Oil {Shell, BP}. Anthony has read <b>HSBC</b> and <b>Shell</b>. (a) Can he read Citi? (b) BP? (c) More HSBC files? (d) Can he <b>write</b> to an HSBC file? (e) Why or why not?</div><details><summary>Show answer</summary><div class="ta">(a) <b>No</b>: same COI as HSBC. (b) <b>No</b>: same COI as Shell. (c) <b>Yes</b>: same dataset, inside the wall. (d) <b>No.</b> (e) The *-property allows writing only if every unsanitized dataset he can read is HSBC. He has also read Shell, so writing into HSBC could leak Shell information to someone who later reads HSBC and BP. Try it in <b>Practice → Chinese Wall simulator</b>.</div></details></div>`},
 { id:'w4t7', t:'Role-Based Access Control (RBAC)', obj:'The three primary RBAC rules and the purpose of separation of duty.',
   b:`<p>Permissions are attached to <b>roles</b> (job functions: teller, manager, auditor), not to individual subjects. A subject has <i>authorized</i> roles and currently <i>active</i> roles.</p>
<ol><li><b>Role assignment</b>: a subject can execute a transaction only if it has an <i>active role</i>.</li>
<li><b>Role authorization</b>: a subject's active role must be one of its <i>authorized roles</i>.</li>
<li><b>Transaction authorization</b>: a subject can execute a transaction only if it's authorized for one of the subject's <i>active roles</i>.</li></ol>
<p><b>Separation of duty in RBAC:</b> one person can't hold two conflicting roles. For example, if teller is among S's authorized roles, auditor is excluded. This prevents one person from both performing and checking a critical function, so fraud needs collusion.</p>
<p>Subsumption: a senior role (trainer) can do everything the junior role (trainee) can. Advantages: easy to administer, permissions match the organization ("open account" rather than "read file"), and people can change roles without changing identity.</p><div class="eg try"><b>Try it · RBAC</b><div class="tq">At a bank, Mary's authorized roles are {Teller, Trainer}. She's currently logged in as Teller. (a) Can she run "Cash a cheque" (a Teller transaction)? (b) "Run training session" (Trainer only)? (c) Can she be given the Auditor role as well? Which rules decide each?</div><details><summary>Show answer</summary><div class="ta">(a) <b>Yes</b>: she has an active role (rule 1), it's authorized (rule 2), and the transaction belongs to it (rule 3). (b) <b>Not right now</b>: Trainer isn't active (rule 3). She must switch her active role first. (c) <b>No</b>: <b>separation of duty</b>, because Teller and Auditor conflict.</div></details></div>`},
 { id:'w4t8', t:'Three ways to store an access control matrix', obj:'Describe how an ACM can be built or stored.',
   b:`<ol><li><b>Rules computed on the fly</b> from attributes of subjects and objects (for example BLP's dominates check). No matrix is stored.</li>
<li><b>Access control lists (ACLs)</b>: store permissions <b>with each object</b> as pairs &lt;S, P&gt; (a column of the matrix).</li>
<li><b>Capabilities</b>: store permissions <b>with each subject</b> as pairs &lt;O, A&gt; (a row of the matrix). A capability is like a ticket: holding it proves permission, so it must be unforgeable (for example via a tag bit or protected memory).</li></ol>
<p>An explicit full matrix is expensive and mostly empty, so it's rarely stored.</p>
<p><b>Clinical Information Systems</b> (also in Week 4): each record has an ACL; a responsible clinician manages it; the patient is notified; all accesses are logged; confinement (the ACL of the destination ⊆ ACL of the source); aggregation controls. It combines confidentiality and integrity.</p><div class="eg try"><b>Try it · ACL or capability?</b><div class="tq">Matrix: Alice can read File1 and write File2; Bob can read File2. (a) Write File2's ACL. (b) Write Alice's capability list. (c) What's the third way to "store" the matrix?</div><details><summary>Show answer</summary><div class="ta">(a) File2: &lt;Alice, W&gt;, &lt;Bob, R&gt; (stored with the <b>object</b>). (b) Alice: &lt;File1, R&gt;, &lt;File2, W&gt; (stored with the <b>subject</b>). (c) Store nothing and <b>compute it on the fly from rules</b> (like BLP's dominates).</div></details></div>`}
 ]},
{ n:5, title:'ORCON, TCB & cryptography basics', sub:'ORCON/DRM, TCB and reference monitor, attack types, OTP, ciphers, symmetric/asymmetric, hash, MAC, AE',
 topics:[
 { id:'w5t1', t:'Originator Controlled Access Control (ORCON)', obj:'What it is and its purpose.',
   b:`<p><b>Purpose:</b> the <b>originator</b> (creator) of a document controls how it is <i>disseminated</i>, even after copies are given out. Example: the Secretary of Agriculture's memo to her subordinates can't be passed on without her permission.</p>
<p>Requirements: (1) o can't be released to other organizations without the originator X's permission; (2) <b>any copies of o carry the same restrictions</b>.</p>
<ul><li><b>DAC fails</b>: the <i>owner</i> (not necessarily the originator) can set any permissions, so requirement 2 can't be enforced.</li>
<li><b>MAC alone fails</b>: categories are centrally managed, which leads to <b>category explosion</b> and can't flexibly authorize unforeseen subjects.</li>
<li><b>ORCON is a combination of MAC and DAC</b>: restrictions are bound to every copy and the owner can't change them (MAC-like), but the <i>originator</i> can change them per subject and object (DAC-like).</li></ul>
<p><b>DRM</b> applies ORCON: it gives persistent control over how digital content is used and redistributed. Elements: content, license, grant, issuer, principal, device. Rules are tied to the content, not the user, and persist for its whole life. Examples: Microsoft <b>PlayReady</b> (AES content, a license server, TEE on the device) and Apple <b>FairPlay</b> (master key locked by a user key; at most 5 authorized systems).</p><div class="eg try"><b>Try it · ORCON</b><div class="tq">(a) Exercises 4 Q1: what specific problem does ORCON address? (b) Why can't plain DAC enforce it? (c) Name a real-world example.</div><details><summary>Show answer</summary><div class="ta">(a) Letting the <b>originator</b> control further dissemination, with <b>copies keeping the same restrictions</b>. (b) Under DAC, whoever owns a copy can change its permissions and pass it on. (c) <b>DRM</b>: Microsoft PlayReady, Apple FairPlay, Netflix downloads.</div></details></div>`},
 { id:'w5t2', t:'Trusted Computing Base & reference monitor', obj:'Define TCB and list the three properties of a reference monitor.',
   b:`<p><b>TCB:</b> the complete collection of <b>hardware, firmware and software</b> components that are critical to enforcing the security policy. Keep it <b>as small as possible</b> so it's easier to verify and has fewer bugs. Faults <i>outside</i> the TCB can't help an attacker violate the policy. Unix example: the kernel and drivers, root processes, setuid-root programs, the build tools for these, the CPU, storage firmware, and file servers.</p>
<p><b>Reference monitor:</b> an abstract machine that mediates <b>all</b> accesses from any subject to any object and can't be bypassed. A <b>security kernel</b> is an implementation of one. Its three properties:</p>
<ol><li><b>Complete</b>: mediates every access, so it can't be bypassed.</li>
<li><b>Isolated</b>: protected from modification by other entities.</li>
<li><b>Verifiable</b>: small and simple enough to be tested and shown correct.</li></ol>
<p>Protection rings: ring 0 = kernel (most trusted), 1 = non-privileged OS, 2 = drivers and utilities, 3 = applications. Trust increases inward. In networked rings of trust, a host trusts inner rings, never outer ones (compare Biba).</p><div class="eg try"><b>Try it · Reference monitor</b><div class="tq">For each failure, name the reference monitor property that's broken: (1) a hidden admin API lets programs read files without going through the access check; (2) malware can patch the access-checking code in memory; (3) the access-check module is 2 million lines of code that nobody can review.</div><details><summary>Show answer</summary><div class="ta">(1) <b>Complete</b>: not every access is mediated. (2) <b>Isolated</b>: it can be tampered with. (3) <b>Verifiable</b>: too big to prove correct. This is why the TCB should be small.</div></details></div>`},
 { id:'w5t3', t:'Five categories of attacks on encryption', obj:'Describe them and classify a given attack.',
   b:`<p>Attacks are classified by <b>what information the attacker has</b>:</p>
<table class="t"><tr><th>Attack</th><th>Attacker has</th></tr>
<tr><td><b>Ciphertext-only</b></td><td>Only encrypted text</td></tr>
<tr><td><b>Known plaintext</b></td><td>Some ciphertext/plaintext <i>pairs</i></td></tr>
<tr><td><b>Chosen plaintext</b></td><td>Can get messages of their choosing encrypted</td></tr>
<tr><td><b>Adaptive chosen plaintext</b></td><td>Chosen plaintext, adjusted based on earlier results</td></tr>
<tr><td><b>Chosen ciphertext</b></td><td>Can get selected ciphertexts <i>decrypted</i></td></tr></table>
<div class="eg try"><b>Try it · Exercises 4 Q8</b><div class="tq">Classify each attack: (a) the attacker has several encrypted messages; (b) the attacker has several encrypted messages and knows the plaintext for some; (c) the attacker can choose messages and get them encrypted. Which is most likely to succeed?</div><details><summary>Show answer</summary><div class="ta">(a) <b>Ciphertext-only</b>; (b) <b>known plaintext</b>; (c) <b>chosen plaintext</b>. Chosen plaintext is most likely to succeed because the attacker controls the input.</div></details></div>
<p>The cryptanalyst's job is to <b>reduce the search space</b> (uncertainty) using all available information. Redundancy in the plaintext helps the attacker.</p>`},
 { id:'w5t4', t:'One-time pad: why it\'s perfect', obj:'Explain the OTP and why it\'s perfect.',
   b:`<p><b>Perfect cipher:</b> knowing the algorithm and ciphertext gives <b>no reduction of the search space</b>. The attacker's chance of guessing the plaintext is the same with or without the ciphertext. Shannon showed this needs <b>at least as many keys as plaintexts</b>, chosen randomly.</p>
<p><b>One-time pad</b> (Miller 1882; Vernam and Mauborgne 1917): a <b>truly random key as long as the message</b>, <b>XORed</b> with the plaintext and <b>used only once</b>.</p>
<p><b>Why it's perfect:</b> for any intercepted ciphertext (say <code>101</code>), <i>every</i> possible plaintext of that length could have produced it under some key. So the ciphertext tells the attacker nothing.</p>
<p><b>Its problem is practical:</b> it needs as much key material as plaintext and suffers from the <b>key distribution problem</b>. If you already had a secure channel to send the key, why not send the message? An approximation uses a <b>PRNG</b> seeded with a shared secret, which inspired stream ciphers (AES-CTR/OFB/CFB, RC4). These are no longer perfect.</p><div class="eg"><b>Worked example · One-time pad with XOR</b><div class="tq">Message <code>101</code>, key <code>110</code> (random, used once). Ciphertext = 101 XOR 110 = <b>011</b>. To decrypt: 011 XOR 110 = 101. (XOR: same bits → 0, different → 1.)</div></div><div class="eg try"><b>Try it · Why perfect?</b><div class="tq">An attacker intercepts the 3-bit ciphertext <code>011</code> and knows a one-time pad was used. Which plaintexts are still possible? What has the attacker learned?</div><details><summary>Show answer</summary><div class="ta"><b>All 8</b> (000 to 111). For any guessed plaintext P there's a key K = P XOR 011 that produces it. The attacker has learned <b>nothing</b>; the search space isn't reduced at all. That's what "perfect" means. The catch: the key must be truly random, as long as the message, never reused, and shared secretly (the key distribution problem).</div></details></div>`},
 { id:'w5t5', t:'Substitution & transposition: confusion & diffusion', obj:'Why they matter and what they achieve.',
   b:`<ul><li><b>Substitution</b>: each symbol is replaced by another. It gives <b>confusion</b>: an interceptor can't readily extract the information or the relationship to the key. Example: AES SubBytes (an 8-bit lookup table).</li>
<li><b>Transposition</b>: the order of symbols is rearranged. It gives <b>diffusion</b>: information from one part of the plaintext is spread widely over the ciphertext. Example: the AES byte-reordering step.</li></ul>
<p>They look simple, but almost all modern symmetric ciphers combine them over many <b>rounds</b> (iterated block ciphers) to get both confusion and diffusion.</p>
<p><b>Breakable</b>: with enough time and data, the plaintext can be recovered (brute force always works in theory). <b>Strong</b>: no attack substantially faster than brute force. A larger key space means a longer search; 256-bit symmetric keys are recommended. AES: 128-bit blocks, 128/192/256-bit keys, the Rijndael algorithm.</p><div class="eg try"><b>Try it · Confusion or diffusion?</b><div class="tq">(1) AES replaces each byte using a lookup table (S-box). (2) AES shifts the bytes in each row to new positions. Which step gives confusion and which gives diffusion? Why do ciphers use both, over many rounds?</div><details><summary>Show answer</summary><div class="ta">(1) Substitution → <b>confusion</b>: it hides the relationship between key and ciphertext. (2) Transposition → <b>diffusion</b>: it spreads each plaintext bit across the ciphertext. Together, over many rounds, patterns in the plaintext disappear and there's no shortcut better than brute force.</div></details></div>`},
 { id:'w5t6', t:'Symmetric vs asymmetric keys & key distribution', obj:'Which keys are used, whether key exchange is needed, and how asymmetric solves distribution.',
   b:`<table class="t"><tr><th></th><th>Symmetric (private or secret key)</th><th>Asymmetric (public key)</th></tr>
<tr><td>Keys</td><td><b>Same</b> key K encrypts and decrypts (K<sub>E</sub> = K<sub>D</sub>)</td><td>A <b>public key PK</b> anyone can use to encrypt, and a <b>private key SK</b> only the owner holds to decrypt</td></tr>
<tr><td>Key exchange?</td><td><b>Yes</b>: the shared secret must be exchanged securely beforehand</td><td><b>No secret exchange</b>: public keys can be published openly</td></tr>
<tr><td>Keys for n users (pairwise)</td><td><b>n(n−1)/2</b>, O(n²)</td><td><b>2n</b> (one pair each), O(n)</td></tr>
<tr><td>Key properties</td><td>Random k-bit strings, cheap to generate</td><td>Special structure (large primes), expensive to generate</td></tr>
<tr><td>Speed</td><td><b>Fast</b>, the workhorse for bulk data</td><td>Up to ~10,000× slower</td></tr></table>
<p><b>How asymmetric solves key distribution:</b> to send M to A, encrypt with A's public key: {M}<sub>PKA</sub>. Only the holder of SK<sub>A</sub> can decrypt it. No shared secret ever has to travel over the channel. (You still need to be sure PK<sub>A</sub> really belongs to A; that's what certificates are for.)</p>
<div class="eg try"><b>Try it · Exercises 4 Q4–Q6</b><div class="tq">Q4: Name one advantage of symmetric over asymmetric encryption, and one the other way round.<br>Q5: 100 users. How many symmetric keys if (a) each user has a unique key to the company database, (b) every pair of users has a unique key?<br>Q6: How can Alice and Bob exchange confidential messages using PK<sub>A</sub>, PK<sub>B</sub>, SK<sub>A</sub>, SK<sub>B</sub>? Does this require key exchange?</div><details><summary>Show answer</summary><div class="ta">Q4: symmetric = <b>much faster</b> and more efficient; asymmetric = <b>no shared secret to distribute</b> (and it enables signatures).<br>Q5: (a) <b>100 keys</b>; (b) 100×99/2 = <b>4,950 keys</b>.<br>Q6: Alice sends {M}<sub>PKB</sub>, which Bob decrypts with SK<sub>B</sub>; Bob replies with {M′}<sub>PKA</sub>, which Alice decrypts with SK<sub>A</sub>. <b>No secret key exchange is needed</b>; only public keys are shared.</div></details></div>
<p>Note: 256-bit symmetric ≈ 2048-bit public-key strength; key sizes aren't directly comparable.</p>`},
 { id:'w5t7', t:'Cryptographic hash functions', obj:'List and describe the three properties.',
   b:`<p>A hash maps a variable-length input to a short, fixed-length <b>message digest</b>, using an efficient deterministic algorithm.</p>
<ol><li><b>Preimage resistance</b>: given a hash, it's hard to construct a text that has it (one-way).</li>
<li><b>Weak collision resistance</b> (second preimage): given a text, it's hard to <i>modify</i> it without changing its hash.</li>
<li><b>Strong collision resistance</b>: it's infeasible to find <i>any</i> two different messages with the same hash.</li></ol>
<p><b>Hashes protect integrity</b>, not confidentiality. They "seal" a file so any change shows. <b>No key is used.</b> Use SHA-2 or SHA-3. MD4, MD5 and SHA-1 have known collisions and shouldn't be used where collision resistance matters.</p><div class="eg try"><b>Try it · Hash properties</b><div class="tq">Match each to its property: (1) given a hash, you can't find any message that produces it; (2) given a contract, you can't make a different contract with the same hash; (3) you can't find any two messages with the same hash. Also: which CIA principle do hashes protect, and do they need a key?</div><details><summary>Show answer</summary><div class="ta">(1) <b>Preimage resistance</b>. (2) <b>Weak collision resistance</b> (second preimage). (3) <b>Strong collision resistance</b>. Hashes protect <b>integrity</b> and need <b>no key</b>.</div></details></div>`},
 { id:'w5t8', t:'MAC, authenticated encryption, and which primitive gives what', obj:'What MACs are for; the two features of AE; map primitives to principles and keys.',
   b:`<p><b>Message Authentication Code (MAC):</b> used by parties with a <b>pre-shared secret key</b> for <b>message authentication</b>. MAC<sub>K</sub>(M) gives an n-bit tag that an attacker without K can't forge (better than ≈2<sup>−n</sup>). It provides <b>integrity + authentication</b> (the data came from a key holder). Examples: CMAC-AES, HMAC-SHA-2.</p>
<p><b>Authenticated Encryption (AE)</b>, a private-key scheme, has two features:</p>
<ol><li>It provides <b>ciphertext integrity</b>.</li>
<li>Its decryption <b>rejects as invalid any ciphertext not produced by the encryption function with the same key K</b>.</li></ol>
<p>So AE = confidentiality <b>and</b> integrity together, whereas plain AES encryption gives only confidentiality (Exercises 4 Q7). Examples: <b>AES-GCM</b>, AES-CCM, AES-EAX, AES-OCB. Construction: encrypt-then-MAC with keys derived by a KDF. Don't invent your own scheme.</p>
<table class="t"><tr><th>Primitive</th><th>Provides</th><th>Key?</th></tr>
<tr><td>Encryption (AES)</td><td>Confidentiality</td><td>Yes</td></tr>
<tr><td>Hash (SHA-256)</td><td>Integrity</td><td><b>No</b></td></tr>
<tr><td>MAC (HMAC)</td><td>Integrity + authentication</td><td>Yes (shared secret)</td></tr>
<tr><td>Authenticated encryption</td><td>Confidentiality + integrity (+ authentication)</td><td>Yes</td></tr>
<tr><td>Digital signature</td><td>Integrity + authentication + <b>non-repudiation</b></td><td>Yes (private key signs, public key verifies)</td></tr></table>
<div class="trap"><b>Exam trap:</b> A MAC <b>can't</b> give non-repudiation, because both parties share the key and either could have made the tag. Only a digital signature can. None of these give availability.</div><div class="eg try"><b>Try it · Which primitive?</b><div class="tq">Pick the right tool: (1) prove a file downloaded intact (no secret needed); (2) two servers sharing a secret key want to detect tampering; (3) send data so it's both secret and tamper-proof; (4) sign a contract you can't later deny. Also, Exercises 4 Q10: which of encryption, hash, MAC and signature need a key?</div><details><summary>Show answer</summary><div class="ta">(1) <b>Hash</b>. (2) <b>MAC</b> (HMAC). (3) <b>Authenticated encryption</b> (AES-GCM). (4) <b>Digital signature</b>. Keys: <b>encryption, MAC and signature</b> need one; a plain <b>hash</b> doesn't.</div></details></div>`}
 ]},
{ n:6, title:'Public-key crypto, Google Cloud & certificates', sub:'RSA, signatures, PKI, encryption states, key hierarchy, certificates, CAs, chains of trust',
 topics:[
 { id:'w6t1', t:'Public-key encryption & RSA', obj:'What RSA relies on and why it\'s secure; what problem public-key encryption solves.',
   b:`<p>Diffie and Hellman (1976) proposed public-key encryption; GCHQ had developed it secretly earlier as "non-secret encryption". It requires {{M}<sub>PK</sub>}<sub>SK</sub> = M. It's built on a <b>one-way function</b>: easy to compute, hard to invert without extra (trapdoor) information.</p>
<p><b>RSA</b> (Rivest-Shamir-Adleman, late 1970s) relies on the difficulty of <b>prime factorization</b>. Multiplying two large primes p1 × p2 = N is easy. Recovering p1 and p2 from N is computationally infeasible for large N. But if you know N and one prime, the other is just N ÷ p, which is the trapdoor.</p>
<p><b>Problem it solves:</b> the <b>key distribution problem</b>. Parties who never met can communicate confidentially without first sharing a secret. It also enables <b>digital signatures</b> and <b>key derivation</b> (the Diffie-Hellman protocol establishes a shared secret over a public channel).</p>
<p>In practice, public-key crypto is ~10,000× slower, so it's used to exchange a symmetric key, and the symmetric cipher encrypts the bulk data.</p><div class="eg try"><b>Try it · RSA</b><div class="tq">(a) What does RSA's security rely on? (b) Why is that secure? (c) If someone learns N and one of its prime factors, what happens? (d) What problem does public-key encryption solve?</div><details><summary>Show answer</summary><div class="ta">(a) The difficulty of <b>prime factorization</b>. (b) Multiplying two huge primes is easy, but factoring N back into them is computationally infeasible for large N. (c) They get the other factor instantly (N ÷ p) and RSA is broken. (d) The <b>key distribution problem</b>: no shared secret has to be exchanged first. It also enables signatures.</div></details></div>`},
 { id:'w6t2', t:'Digital signatures & PKI', obj:'What signatures are and are used for; the purpose of PKI.',
   b:`<p><b>Digital signature:</b> Sig ← Sign<sub>SK</sub>(M), produced with the signer's <b>private key</b> (usually over a hash of M). Anyone verifies it with the <b>public key</b>: Verify<sub>PK</sub>(M, Sig) = 1, and = 0 for any M′ ≠ M.</p>
<p><b>Used for:</b> <b>authenticity</b> (it came from the key owner), <b>integrity</b> (any change breaks verification) and <b>non-repudiation</b> (only the owner has SK, so they can't deny signing). Signatures are also how certificates are built.</p>
<p><b>PKI (public key infrastructure):</b> the trusted system that <b>creates and manages digital certificates</b>, which <b>verify that a public key belongs to a particular entity</b>. Without PKI, an attacker could hand you their own public key while claiming to be your bank (man-in-the-middle).</p><div class="eg try"><b>Try it · Signatures and PKI</b><div class="tq">Alice signs a contract and sends it to Bob. (a) Which key does she sign with, and which does Bob verify with? (b) What three things does a valid signature give Bob? (c) How does Bob know the public key really is Alice's?</div><details><summary>Show answer</summary><div class="ta">(a) Signs with <b>Alice's private key</b>; Bob verifies with <b>Alice's public key</b>. (b) <b>Authenticity, integrity, non-repudiation</b>. (c) Through <b>PKI</b>: a certificate from a trusted CA binding Alice's identity to her public key.</div></details></div>`},
 { id:'w6t3', t:'Google Cloud: three states of encryption', obj:'Describe the three states with examples.',
   b:`<table class="t"><tr><th>State</th><th>Protects against</th><th>Examples</th></tr>
<tr><td><b>At rest</b></td><td>System compromise or exfiltration of stored data</td><td><b>AES-256</b> on disks and backups (AES-GCM mostly; AES-CBC + HMAC; AES-CTR + HMAC), Cloud Storage, Compute Engine disk snapshots</td></tr>
<tr><td><b>In transit</b></td><td>Interception while data moves between parties</td><td><b>TLS</b> (transport), <b>S/MIME</b> (email)</td></tr>
<tr><td><b>In use</b></td><td>Exposure while servers compute on the data</td><td><b>Homomorphic encryption</b> (computing on encrypted data)</td></tr></table>
<p>Benefits of encryption at rest: defense in depth, it "cuts out" lower layers (stolen disks are useless without keys), access is enforced and audited through key management, and engineers can run backups without seeing content.</p>
<p>Layers: the <b>storage system layer</b> (data split into chunks, each with its own key, a new key on every update, encrypted before writing to disk, ACLs per chunk ID), the <b>storage device layer</b> (a separate AES-256 device key on HDDs and SSDs), and <b>backups</b> (each file has its own DEK from a KMS key plus a per-file seed).</p><div class="eg try"><b>Try it · Which state?</b><div class="tq">Classify each as encryption at rest, in transit or in use: (1) HTTPS between your browser and Gmail; (2) a Compute Engine disk snapshot encrypted with AES-256; (3) a cloud server computing statistics on encrypted salaries without decrypting them; (4) an encrypted backup tape; (5) S/MIME email.</div><details><summary>Show answer</summary><div class="ta">(1) <b>In transit</b> (TLS). (2) <b>At rest</b>. (3) <b>In use</b> (homomorphic encryption). (4) <b>At rest</b>. (5) <b>In transit</b>.</div></details></div>`},
 { id:'w6t4', t:'Google Cloud key hierarchy & compromise response', obj:'Each level, what encrypts what, and what to do if a key is compromised.',
   b:`<table class="t"><tr><th>Level</th><th>Key</th><th>Encrypts (wraps)</th><th>Stored in</th></tr>
<tr><td>1</td><td><b>DEK</b>, data encryption key (AES-256, one per chunk)</td><td>A <b>data chunk</b></td><td>Next to the chunk, <i>wrapped</i> by a KEK</td></tr>
<tr><td>2</td><td><b>KEK</b>, key encryption key (one or more per service; far fewer than DEKs)</td><td><b>DEKs</b></td><td>Google <b>KMS</b>: not exportable, ACL per key, every use logged, rotated (Cloud Storage: every 90 days, up to 20 versions)</td></tr>
<tr><td>3</td><td><b>KMS master key</b> (AES-256)</td><td>All <b>KEKs</b> in KMS</td><td><b>Root KMS</b> (about a dozen keys, dedicated machines)</td></tr>
<tr><td>4</td><td><b>Root KMS master key</b> (AES-256)</td><td>Keys in <b>Root KMS</b></td><td><b>Root KMS master key distributor</b>: peer-to-peer, in RAM only, gossip protocol; backed up on hardware in physical safes at two locations (fewer than 20 staff can access them)</td></tr></table>
<p>Chain: <b>chunk ← DEK ← KEK ← KMS master key ← root KMS master key</b>. Reading data: the storage system sends the wrapped DEK to KMS; KMS checks that the service may use the KEK and unwrap that DEK, then returns the plaintext DEK; the storage system decrypts the chunk.</p>
<p><b>If a key is compromised</b> (in-class exercise; this is a suggested answer based on the hierarchy, so check it against your class notes):</p>
<ul><li><b>DEK</b>: only <i>that one chunk</i> is exposed. Generate a new DEK, re-encrypt the chunk, wrap the new DEK with the KEK, and destroy the old DEK.</li>
<li><b>KEK</b>: every DEK it wraps is at risk. <b>Rotate the KEK</b> (new version), unwrap and <b>re-wrap all affected DEKs</b> under the new KEK, disable or destroy the old version, check the KMS <b>audit logs</b> for misuse, and re-encrypt data whose DEKs may have been unwrapped.</li>
<li><b>KMS master key / root key</b>: the most serious case. Rotate it and re-wrap every key below it, in the order root → master → KEKs. Restrict and audit access to Root KMS and the safes.</li>
<li>In general: revoke the compromised key, investigate through the logs, and use the hierarchy to limit how much has to be re-encrypted. Re-wrapping keys is much cheaper than re-encrypting all the data.</li></ul><div class="eg try"><b>Try it · Key hierarchy and compromise</b><div class="tq">(a) Fill in the chain: data chunk ← ___ ← ___ ← KMS master key ← ___. (b) Where are DEKs stored, and where are KEKs stored? (c) An attacker steals one KEK for Cloud Storage. What's exposed, and what should be done?</div><details><summary>Show answer</summary><div class="ta">(a) Chunk ← <b>DEK</b> ← <b>KEK</b> ← KMS master key ← <b>root KMS master key</b>. (b) DEKs are stored (wrapped) <b>next to the data</b>; KEKs are in <b>KMS</b>, not exportable. (c) Every <b>DEK wrapped by that KEK</b> is at risk. <b>Rotate the KEK</b>, <b>re-wrap all affected DEKs</b> with the new version, disable or destroy the old one, review the <b>KMS audit logs</b>, and re-encrypt any chunks whose DEKs may have been unwrapped. (This is a suggested answer; check it against your class exercise.)</div></details></div>`},
 { id:'w6t5', t:'Certificates, CAs & chains of trust', obj:'Define a certificate; the role of CAs; what a chain of trust is for.',
   b:`<p><b>Certificate:</b> the electronic equivalent of a "letter of introduction". It <b>binds a public key to an identity</b>, signed by a certification authority (CA) that vouches for the binding. It's built from <b>digital signatures and hash functions</b>: X issues Y's certificate as <span class="lab">{Y, PK_Y, Sign_SKX(h({Y, PK_Y}))}</span>.</p>
<p><b>Purpose in public-key encryption:</b> public keys solve distribution, but how does A know a key really belongs to B? A certificate answers that, which prevents an attacker from substituting their own key. Anyone holding a trusted copy of the CA's public key can check the binding and that it wasn't altered.</p>
<p><b>Certification authority (CA):</b> a trusted third party that <b>verifies identities and signs certificates</b>. It gets its authority from its <i>position</i> rather than familiarity (offline equivalents are a notary or a personnel officer). Root CAs on the Internet include Verisign, SecureNet, Baltimore Technologies and Deutsche Telecom; in Hong Kong, the Hongkong Post CA, Digi-Sign and the Hong Kong Certification Authority.</p>
<p><b>Chain of trust:</b> Y (certified by X) certifies W and appends X's certificate, giving W → Y → X. You can trust an unknown party's key by following signatures up to a <b>root CA</b> you already trust. <b>Purpose:</b> trust scales, because you don't need to know every party directly, just one trusted root. The chain must end at an unimpeachable root.</p>
<p><b>X.509v3 fields:</b> version, serial number, signature algorithm ID, issuer's distinguished name, validity interval, subject's distinguished name, subject's public key info, issuer unique ID, subject unique ID, extensions, signature. <b>To validate:</b> get the issuer's public key, verify the signature, recompute the hash and compare, and check the validity period.</p><div class="eg try"><b>Try it · Certificates and chains</b><div class="tq">Your browser visits bank.hk and receives: bank.hk's certificate signed by "HK Intermediate CA", whose certificate is signed by "Root CA X". Root CA X is built into your browser. (a) What does bank.hk's certificate bind together? (b) How does your browser decide to trust it? (c) What are the CA's role and the purpose of the chain?</div><details><summary>Show answer</summary><div class="ta">(a) The <b>identity bank.hk</b> and its <b>public key</b>, signed by the CA. (b) It verifies bank.hk's certificate with the Intermediate CA's public key, verifies the intermediate's with Root CA X's public key, and stops at the trusted root. For each certificate it also recomputes the hash and checks the validity dates. (c) The CA <b>verifies identities and vouches for key-to-identity bindings</b>. The chain lets trust in a <b>few roots</b> extend to any site, without knowing every site directly.</div></details></div>`}
