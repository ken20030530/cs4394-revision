<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS4394 Weeks 1–6 Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: top bar with three modes (Revise / Practice / Mock quiz); Revise = sticky week rail + reading column. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#18212b; --muted:#5a6876; --line:#d9e0e7;
  --accent:#1d5d8c; --accent-soft:#e3eef7;
  --good:#1f7a4d; --good-soft:#e2f3ea; --bad:#b3362c; --bad-soft:#f9e5e3; --warn:#9a6a00; --warn-soft:#fbf1d9;
  --display:"IBM Plex Serif", Georgia, "Noto Sans TC", serif; --body:"IBM Plex Sans", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif; --mono:"IBM Plex Mono", ui-monospace, Consolas, "Noto Sans TC", monospace;
  --zh:#33536e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --surface:#19212a; --ink:#e4eaf0; --muted:#98a6b4; --line:#2c3743;
    --accent:#6fb1e3; --accent-soft:#1d3247;
    --good:#5ec58f; --good-soft:#173527; --bad:#f08a80; --bad-soft:#3d1f1c; --warn:#e3b44f; --warn-soft:#3a2f14;
    --zh:#a9c7e0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --ink:#e4eaf0; --muted:#98a6b4; --line:#2c3743;
  --accent:#6fb1e3; --accent-soft:#1d3247;
  --good:#5ec58f; --good-soft:#173527; --bad:#f08a80; --bad-soft:#3d1f1c; --warn:#e3b44f; --warn-soft:#3a2f14;
  --zh:#a9c7e0;
  color-scheme: dark;
}
*{box-sizing:border-box}
/* bilingual */
.zh{display:block;color:var(--zh);font-weight:inherit;margin-top:.12rem;line-height:1.6}
.zh-blk{margin-top:.45rem;padding-top:.35rem;border-top:1px dashed var(--line)}
summary .zh,.k .zh,.lab .zh{display:inline;margin:0 0 0 .4em}
.zhi{color:var(--zh);margin-left:.3em}
.qn .zhi{margin-left:.2em}
[data-lang="zh"] .zhi{margin-left:0}
.langsw{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--line)}
.langsw button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.langsw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2,h3{text-wrap:balance;line-height:1.25}
h1{font-family:var(--display);font-size:1.45rem;margin:0}
h2{font-family:var(--display);font-size:1.35rem;margin:0 0 .25rem}
h3{font-size:1.05rem;margin:0 0 .4rem}
code,.mono{font-family:var(--mono);font-size:.9em}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand small{display:block;color:var(--muted);font-size:.82rem}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px;border:1px solid var(--line)}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.prog{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.bar{width:110px;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0}

main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.view{display:none}.view.on{display:block}

/* revise */
.rev{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
.rail{position:sticky;top:78px;display:flex;flex-direction:column;gap:4px}
.rail button{text-align:left;border:1px solid transparent;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;color:var(--ink)}
.rail button span.cnt{color:var(--muted);font-size:.8rem;font-family:var(--mono)}
.rail button[aria-current="true"]{background:var(--surface);border-color:var(--line);font-weight:600}
.weekhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:14px}
.weekhead p{margin:0;color:var(--muted)}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.topic-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.topic .obj{color:var(--muted);font-size:.88rem;margin:-.1rem 0 .7rem;max-width:70ch}
.topic .body{max-width:72ch}
.topic .body p{margin:.45rem 0}
.topic .body ul{margin:.3rem 0 .5rem;padding-left:1.2rem}
.topic .body li{margin:.2rem 0}
.done{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);white-space:nowrap;cursor:pointer}
.easy{background:var(--good-soft);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:0 10px 10px 0;padding:12px 16px;margin:.2rem 0 1rem;max-width:72ch}
.easy p{margin:.4rem 0}.easy ul,.easy ol{margin:.3rem 0 .4rem;padding-left:1.2rem}.easy li{margin:.15rem 0}
.easy-h,.detail-h{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--good);margin-bottom:.2rem}
.detail-h{color:var(--muted);margin-top:.2rem}
.nutshell{background:var(--surface);border:2px solid var(--good);border-radius:10px;padding:10px 14px;margin:.7rem 0}
.nutshell table.t{margin:.4rem 0}
.easy .memo{background:var(--surface);border-radius:7px;padding:6px 10px;font-weight:500;margin-top:.6rem}
.trap{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 8px 8px 0;margin:.6rem 0;font-size:.94rem}
.trap b{color:var(--warn)}
.eg{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 8px 8px 0;margin:.6rem 0;font-size:.94rem}
.try .tq{margin:.3rem 0 .4rem}
.try details{margin-top:.4rem}
.try summary{display:inline-block;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--accent);border:1px solid var(--accent);border-radius:7px;padding:3px 10px;list-style:none;background:var(--surface)}
.try summary::-webkit-details-marker{display:none}
.try details[open] summary{margin-bottom:.4rem}
.try .ta{border-top:1px dashed var(--line);padding-top:.4rem}
.try table.t td:empty{min-width:56px;height:28px}
table.t{border-collapse:collapse;margin:.5rem 0;font-size:.92rem}
table.t th,table.t td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--bg);font-weight:600}
.scroll{overflow-x:auto}

/* quiz items */
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.q .qn{font-size:.78rem;color:var(--muted);font-family:var(--mono);display:flex;gap:10px;justify-content:space-between}
.q .qt{font-weight:500;margin:.35rem 0 .7rem;max-width:75ch}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:1.2em;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.ex{margin-top:10px;font-size:.93rem;color:var(--ink);background:var(--bg);border-radius:8px;padding:9px 12px;max-width:75ch}
.ex b.ok{color:var(--good)} .ex b.no{color:var(--bad)}
.check h3{margin-top:22px}

/* practice */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:18px}
.pcard{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;color:var(--ink)}
.pcard b{display:block;margin-bottom:2px}
.pcard small{color:var(--muted);font-size:.84rem}
.pcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.panel p{max-width:75ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:.5rem 0}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.small{padding:4px 10px;font-size:.88rem}
.field{display:flex;flex-direction:column;gap:3px;font-size:.88rem;color:var(--muted)}
.field input{width:150px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-family:var(--mono);color:var(--ink)}
.field input.ok{border-color:var(--good);background:var(--good-soft)}
.field input.no{border-color:var(--bad);background:var(--bad-soft)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:600}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.no{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.lab{font-family:var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
table.acm{border-collapse:collapse;font-size:.9rem}
table.acm th,table.acm td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.acm th{background:var(--bg);font-weight:600}
table.acm th small{display:block;font-family:var(--mono);font-weight:400;color:var(--muted);font-size:.78rem}
table.acm select{padding:3px 4px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono)}
table.acm td.ok{background:var(--good-soft)} table.acm td.no{background:var(--bad-soft)}
table.acm td .ans{display:block;font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.svgwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;margin-top:10px}
.svgwrap svg text{font-family:var(--mono);font-size:12px;fill:var(--ink)}
.cw{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.coi{border:1px dashed var(--line);border-radius:10px;padding:10px}
.coi h4{margin:0 0 6px;font-size:.85rem;color:var(--muted);font-weight:600}
.co{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;background:var(--bg);margin-bottom:5px;font-size:.92rem}
.co.blocked{opacity:.55;text-decoration:line-through}
.co.read{background:var(--accent-soft)}
.log{font-family:var(--mono);font-size:.82rem;background:var(--bg);border-radius:8px;padding:8px 10px;max-height:150px;overflow:auto;white-space:pre-wrap}
.stat{font-family:var(--mono);font-size:.9rem;color:var(--muted)}

/* mock */
.mockbar{position:sticky;top:66px;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:14px}
.timer{font-family:var(--mono);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:.7rem;font-family:var(--mono);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.dot.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.dot.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.dot.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dot.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.intro ul{padding-left:1.2rem}
.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.big{font-family:var(--display);font-size:2.2rem}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.wk div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.88rem}
.wk div b{display:block}
.flagbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:.78rem;font-family:var(--mono)}
.flagbtn[aria-pressed="true"]{color:var(--warn);font-weight:600}

@media (max-width:820px){
  .rev{grid-template-columns:1fr}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px}
  .rail button{white-space:nowrap}
  .mockbar{top:110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>CS4394 · Weeks 1–6</h1><small id="brandsub">Information Security and Management · short quiz revision</small></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-revise" aria-selected="true" data-v="revise">Revise</button>
      <button class="tab" role="tab" id="tab-practice" aria-selected="false" data-v="practice">Practice</button>
      <button class="tab" role="tab" id="tab-mock" aria-selected="false" data-v="mock">30-min mock quiz</button>
    </div>
    <div class="langsw" role="group" aria-label="Language 語言"><button type="button" data-lang="en">EN</button><button type="button" data-lang="both">中英</button><button type="button" data-lang="zh">中</button></div>
    <div class="prog"><span id="progtxt">0 / 0 topics done</span><span class="bar"><i id="progbar"></i></span></div>
  </div>
</header>

<main>
  <section class="view on" id="v-revise">
    <div class="rev">
      <nav class="rail" id="rail" aria-label="Weeks"></nav>
      <div id="weekbody"></div>
    </div>
  </section>

  <section class="view" id="v-practice">
    <div class="pgrid" id="pgrid"></div>
    <div class="panel" id="ppanel"></div>
  </section>

  <section class="view" id="v-mock"><div id="mockroot"></div></section>
</main>

<script>
const EASY_ZH = {
/* ---------- WEEK 1 ---------- */
w1t1: `<p>想像你的<b>房子</b>。</p>
<ul><li><b>資產</b> = 你重視的東西：屋內的手提電腦。</li>
<li><b>漏洞</b> = 弱點：一扇鎖不上的窗。</li>
<li><b>威脅</b> = <i>可能</i>傷害你的東西：附近出沒的竊賊。</li>
<li><b>攻擊</b> = 真的發生了：竊賊從壞窗爬進來，偷走手提電腦。</li>
<li><b>對策</b> = 你採取的行動：修好窗鎖、裝警報器。</li></ul>
<p><b>風險</b> = 竊賊利用那扇壞窗偷走電腦的可能性。沒有房子是 100% 安全的，所以你要<i>管理</i>風險，而不是消除它。</p>
<p class="memo">記憶口訣：威脅是<i>可能</i>發生，攻擊是<i>已經</i>發生，漏洞是<i>你自己</i>的弱點。</p>`,

w1t2: `<p>風險管理就像分三步準備迎接颱風：</p>
<ol><li><b>識別</b>：有甚麼可能出錯？（「窗可能會爆，地庫可能會水浸。」）</li>
<li><b>評估</b>：有多大機會發生？後果有多嚴重？（「水浸年年都有，損失很大；爆窗就很少見。」）</li>
<li><b>處理</b>：決定每一項怎樣應對。（「在地庫放沙包，為窗戶買保險。」）</li></ol>
<p><b>福特 Pinto</b> 事件說明了「評估」只計金錢會出甚麼問題。福特計算出修改油缸的成本高過賠償死傷，於是決定不修。這忽略了道德、訴訟和聲譽，結果是一場災難。</p>
<p class="memo">記憶口訣：找出來 → 量度它 → 處理它。</p>`,

w1t3: `<p>ALE 回答一個問題：<b>「平均而言，這個問題每年會令我們損失多少錢？」</b></p>
<p>例子：你的手機值 $8,000。跌一次會爆屏，維修費約為機價的 25%。你一年大約跌兩次。</p>
<ul><li><b>SLE</b>（一次意外的損失）= 8,000 × 25% = <b>$2,000</b></li>
<li><b>ARO</b>（每年發生次數）= <b>2</b></li>
<li><b>ALE</b>（每年損失）= 2,000 × 2 = <b>每年 $4,000</b></li></ul>
<p>應否買一個每年 $500、幾乎能令你不再跌爛手機（ALE 約 $0）的保護殼？節省 = 4,000 − 0 − 500 = <b>$3,500</b>。應該買。</p>
<p>留意「每 N 年一次」的 ARO：每 10 年一次即 1 ÷ 10 = 每年 0.1 次，不是 10。</p>
<p class="memo">記憶口訣：SLE = 價值 × 損失百分比。ALE = SLE × 每年次數。若（原 ALE − 新 ALE − 成本）&gt; 0，控制措施就值得。</p>`,

w1t4: `<p>知道風險後，你有四個選擇。以<b>駕車</b>為例：</p>
<ul><li><b>接受</b>：「可能會有小刮花，算吧。」（修理的成本高過它的價值。）</li>
<li><b>避免</b>：「我索性不駕車。」（取消有風險的活動。）</li>
<li><b>緩解</b>：「我小心駕駛、扣好安全帶。」（減低發生機會或損害。）</li>
<li><b>轉移</b>：「我買汽車保險。」（出事時由別人付錢。）</li></ul>
<p>在 IT 中：接受 = 不做任何事；避免 = 關掉有風險的服務；緩解 = 防火牆、修補程式、備份、培訓；轉移 = 保險或外判。</p>
<p class="memo">記憶口訣：A-A-M-T。忍受它、不做它、減少它，或讓別人付錢。</p>`,

w1t5: `<p>想像你的<b>銀行戶口</b>：</p>
<ul><li><b>機密性</b>：陌生人<i>看</i>不到你的結餘。</li>
<li><b>完整性</b>：沒有人能偷偷<i>更改</i>你的結餘。</li>
<li><b>可用性</b>：你需要時可以<i>使用</i>戶口；應用程式沒有停擺。</li>
<li><b>認證</b>：銀行知道登入的<i>真的是你</i>。</li>
<li><b>不可否認性</b>：你做過的轉賬，事後不能說「我沒有做過」。</li></ul>
<p>哪一項最重要視乎業務：醫院紀錄最需要 <b>C</b>，證券交易所最需要 <b>I</b>，網上商店或緊急服務最需要 <b>A</b>。</p>
<p class="memo">記憶口訣：C = 看，I = 改，A = 用。</p>`,

/* ---------- WEEK 2 ---------- */
w2t1: `<p>想像一間<b>學校</b>。</p>
<ul><li><b>元政策 (Metapolicy)</b> = 大目標：「學生的考試成績必須保密。」這是<b>做甚麼和為甚麼</b>。</li>
<li><b>政策 (Policy)</b> = 實現目標的具體規則：「成績存放在上鎖的櫃內；只有老師有鎖匙；成績永不貼在牆上。」這是<b>怎樣做</b>。</li></ul>
<p>為甚麼兩者都要？單有目標太模糊（「要保密」……但怎樣做？）。單有規則，若不知背後目標，就顯得很隨意。</p>
<p>以 BLP 為例，元政策是「資訊絕不能向下流到未獲授權的人」。政策就是 BLP 的三條規則。</p>
<p class="memo">記憶口訣：元政策 = 為甚麼／做甚麼（目標）。政策 = 怎樣做（規則）。</p>`,

w2t2: `<p>每個<b>檔案</b>都貼上一張貼紙（它的<b>標籤</b>），每個<b>人</b>都有一個證章（他們的<b>許可等級</b>）。兩者都由相同的兩部分組成：</p>
<ol><li><b>等級</b>，就像大廈的樓層：Unclassified &lt; Confidential &lt; Secret &lt; Top Secret。</li>
<li><b>類別</b>，就像同一層的不同房間：{Nuclear}、{Crypto}……</li></ol>
<p>例子：標籤為 <span class="lab">(Secret, {Nuclear})</span> 的檔案在 Secret 層的 Nuclear 房。持證章 <span class="lab">(Top Secret, {Crypto})</span> 的人在更高的樓層，但只有 Crypto 房的鎖匙，進不了 Nuclear 房。</p>
<p><b>最小權限原則</b>：每人<i>只</i>獲得工作所需的權限，不多也不少。清潔工拿到清潔用品櫃的鎖匙，而不是夾萬的鎖匙。</p>
<p class="memo">記憶口訣：等級 = 有多高。類別 = 哪些房間。最小權限 = 只拿你需要的鎖匙。</p>`,

w2t3: `<p>「A <b>支配 (dominates)</b> B」的意思是「A 在每方面都至少和 B 一樣強」。要檢查兩點：</p>
<ol><li>A 的等級是否<b>較高或相等</b>？</li>
<li>A 是否擁有 B 的<b>全部</b>類別（可以更多）？</li></ol>
<p>兩者都要是「是」。想像一串<b>鎖匙</b>：A 支配 B，代表 A 所在樓層夠高，<i>而且</i> A 的鎖匙串包含 B 擁有的每一條鎖匙。</p>
<ul><li>(Secret, {Crypto, Nuclear}) 對 (Confidential, {Crypto})：樓層較高 ✓，有 Crypto 鎖匙 ✓ → <b>前者支配</b>。</li>
<li>(Top Secret, {Crypto}) 對 (Secret, {Nuclear})：樓層較高 ✓，但沒有 Nuclear 鎖匙 ✗。而 (Secret, {Nuclear}) 樓層較低 ✗。→ <b>不可比較</b>：兩者都勝不過對方。</li></ul>
<p>要判斷，必須檢查<b>兩個方向</b>。如果 A ≥ B 不成立，B ≥ A 也不成立，就是不可比較。</p>
<div class="nutshell"><b>一句話總結：兩部分必須指向同一方向</b>
<table class="t"><tr><th>等級</th><th>類別集合</th><th>結果</th></tr>
<tr><td>較高或相等</td><td>較大或相等（包含對方）</td><td><b>支配</b></td></tr>
<tr><td>較低或相等</td><td>較小或相等（被對方包含）</td><td><b>被支配</b></td></tr>
<tr><td>相等</td><td>相等</td><td><b>相等</b>（BLP 中為 RW）</td></tr>
<tr><td>較高</td><td>較小</td><td><b>不可比較</b>（方向相反）</td></tr>
<tr><td>較低</td><td>較大</td><td><b>不可比較</b>（方向相反）</td></tr>
<tr><td>任何</td><td>兩個集合互不包含，例如 {F} 對 {R}</td><td>直接<b>不可比較</b></td></tr></table>
<p><b>例子：</b></p>
<ul><li>Military (S,{R,M}) 對 Alice (C,{R})：等級較高<i>而且</i>集合較大 → Military 支配 → Alice 得到 <b>W</b>。</li>
<li>(S,{R}) 對 (C,{R,M})：S 較高，但 {R,M} 集合較大 → 方向相反 → <b>不可比較</b> → 沒有存取權（–）。</li></ul>
<p><b>步驟：</b>1) 比較兩個標籤（哪個是主體都沒關係）。2) 套用 BLP：主體勝 → R；客體勝 → W；相等 → RW；不可比較 → –。</p></div>
<p class="memo">記憶口訣：同方向 = 可比較；反方向 = 不可比較。欠一條鎖匙，樓層再高也沒用。</p>`,

w2t4: `<p>BLP 用兩條簡單規則保護機密：</p>
<ul><li><b>不可向上讀</b>（簡單安全特性）：你不能讀取高於你許可等級的東西。Secret 的人不能讀 Top Secret 檔案。</li>
<li><b>不可向下寫</b>（*-特性）：你不能寫<i>入</i>低於你等級的東西。Secret 的人不能寫入 Confidential 檔案，因為他們可能把機密抄進去，洩露給較低許可的人。</li></ul>
<p>比喻：將軍可以<b>讀</b>士兵的報告（向下讀沒問題），但不能把作戰計劃<b>貼</b>在士兵的告示板上（向下寫會洩密）。士兵可以把字條<b>投入</b>將軍的信箱（向上寫沒問題），但不能<b>打開</b>將軍的信箱（不准向上讀）。</p>
<p>填表（ACM）時，對每個主體和客體：</p>
<ul><li>主體較高 → <b>R</b></li><li>客體較高 → <b>W</b></li><li>完全相等 → <b>RW</b></li><li>不可比較 → <b>–</b></li></ul>
<p class="memo">記憶口訣：向下讀，向上寫。標籤相同 = 可讀可寫。</p>`,

w2t5: `<p>BLP 的兩條規則假設標籤固定不變。但如果有人把 Top Secret 檔案的貼紙<b>直接換成</b>「Unclassified」呢？沒有人「向下寫」，也沒有人「向上讀」，但機密已經公開。<b>寧靜性 (Tranquility)</b> 就是關於更改標籤的規則。</p>
<ul><li><b>強寧靜性</b>：貼紙<b>永久黏死</b>。標籤永不改變。</li>
<li><b>弱寧靜性</b>：可以換貼紙，<b>只要沒有機密向下洩露</b>。</li></ul>
<p>弱寧靜性下的例子：</p>
<ul><li>令檔案<i>更</i>機密（Secret → Top Secret）：✅ 安全，沒有洩露。</li>
<li>機密內容仍在檔案內時降低其機密程度：❌ 洩露。</li>
<li>先徹底清除磁碟，<i>然後</i>標為 Unclassified：✅ 已沒有東西可洩露。</li></ul>
<p><b>綜合 BLP</b>：BLP = 簡單安全特性 + *-特性 + 寧靜性。每條規則堵住一條洩密途徑：</p>
<table class="t"><tr><th>洩密途徑</th><th>由此堵截</th></tr><tr><td>讀取高於你等級的東西</td><td>簡單安全特性（不可向上讀）</td></tr><tr><td>把機密抄到較低的檔案</td><td>*-特性（不可向下寫）</td></tr><tr><td>把檔案重新標籤為較低等級</td><td>寧靜性</td></tr></table>
<p class="memo">記憶口訣：強 = 永不改變。弱 = 只在沒有向下洩露時才可改。</p>`,

w2t6: `<p><b>MAC（強制存取控制）</b> = <b>由系統決定</b>，你無法改變規則。就像軍事基地：即使文件是你的，你也不能決定給朋友看；許可規則照樣適用。例子：<b>BLP、Biba、Lipner</b>。</p>
<p><b>DAC（自主存取控制）</b> = <b>由擁有者決定</b>。就像你自己的 Google Drive：你可以把檔案分享給任何人。例子：<b>Unix 檔案權限 (chmod)、Windows NTFS 權限</b>。</p>
<p><b>存取控制矩陣</b>只是一個表：人在左邊、檔案在上面，每格寫該人可做甚麼（R、W……）。</p>
<p class="memo">記憶口訣：強制 = 系統的規則。自主 = 擁有者的選擇。</p>`,

/* ---------- WEEK 3 ---------- */
w3t1: `<p><b>格 (lattice)</b> 是一個像族譜的標籤圖，<b>最低的在底部</b>、<b>最高的在頂部</b>。箭咀<b>向上</b>，因為資訊只能向上流。</p>
<p>逐步畫法：</p>
<ol><li>把最弱的標籤（例如 (Public, {})）放在底部，最強的放在頂部。</li>
<li>對每一對，問「B 是否支配 A？」如是，B 放在 A 之上。</li>
<li><b>只有中間沒有其他標籤時</b>才畫 A → B。如果 A → B → C，就不再畫 A → C。</li>
<li>不可比較的標籤之間不畫箭咀。</li></ol>
<p>想像水<b>只能往上流</b>：它可以由 Public 升到 Confidential 再到 Top Secret，但永遠不能倒流。</p>
<p class="memo">記憶口訣：底 = 最弱，頂 = 最強，箭咀向上，省略捷徑。</p>`,

w3t2: `<p><b>隱蔽通道 (covert channel)</b> 是利用某些本來不是用作通訊的東西來傳送的<b>秘密訊號</b>。BLP 的所有規則都遵守了，但資訊仍然洩露。</p>
<p>想像兩個囚犯關在不同囚室，不准交談：</p>
<ul><li><b>儲存通道</b>：囚犯 A <i>開燈</i> = 1、<i>關燈</i> = 0，囚犯 B 看燈。訊息藏在<b>某樣東西的狀態</b>中。電腦版本：檔案存在與否；磁碟滿了與否；錯誤訊息是「找不到」還是「拒絕存取」。</li>
<li><b>時序通道</b>：囚犯 A <i>洗長澡</i> = 1、<i>洗短澡</i> = 0，B 計算水流多久。訊息藏在事情<b>持續多久或發生次序</b>中。電腦版本：用盡你的 CPU 時間或提早讓出；磁碟請求被處理的次序。</li></ul>
<p>快速測試：接收者需要<b>時鐘或次序</b>來解碼？那就是<b>時序</b>。只是看某個<b>數值或狀態</b>？那就是<b>儲存</b>。</p>
<p>應對方法：<b>移除</b>它、<b>加入雜訊</b>減慢它，或<b>監察</b>它。很難全部移除，因為大型系統有數不清的共享資源。</p>
<p class="memo">記憶口訣：儲存 = 甚麼狀態。時序 = 甚麼時候或多久。</p>`,

w3t3: `<p><b>共享資源矩陣 (SRM)</b> 是一個<b>檢查表</b>，用來找出<i>可能</i>存在隱蔽通道的地方。</p>
<ul><li><b>行</b> = 系統追蹤的共享東西（檔案是否存在、大小、等級……）。</li>
<li><b>列</b> = 操作（READ、WRITE、CREATE、DELETE）。</li>
<li>如果操作能<b>改變</b>那東西，填 <b>M</b>；如果能<b>透露</b>它，填 <b>R</b>。</li></ul>
<p>若某一行同時有 <b>M 和 R</b>，代表一個人可以改變它，另一個人可以看到它。這就是可能的秘密訊號，要查一查。</p>
<p>例子：「檔案存在」。CREATE 和 DELETE <b>修改</b>它 (M)，READ <b>透露</b>它 (R)。所以高等級用戶可以建立或刪除檔案，低等級用戶察覺得到：一個可能的儲存通道。</p>
<p>SRM 只指出<i>嫌疑</i>；仍要人逐一檢查。它由 <b>Kemmerer</b> 提出。</p>
<p class="memo">記憶口訣：同一行有 M 又有 R = 懷疑有隱蔽通道。</p>`,

w3t4: `<p>BLP 只看守<b>正門</b>：讀寫檔案。隱蔽通道從<b>窗口</b>溜走：時序、檔案是否存在、錯誤訊息。</p>
<p><b>不干擾性 (NI)</b> 定下更嚴格的規則：<b>「高等級用戶做的任何事，都不能引起低等級用戶察覺得到的變化。」</b>沒有檔案變化、沒有時間差異，甚麼都沒有。因此它自動連隱蔽通道也堵住。</p>
<p>比喻：BLP 說「不要傳字條給隔籬同學」。NI 說「隔籬同學不能知道你在做的<i>任何</i>事：不能知道你的筆記、你的聲音，甚至你何時開燈」。</p>
<p>補充：NI 以<b>主體</b>之間的箭咀表示誰可以影響誰（L → H）。任何 BLP 政策都能轉成 NI，但並非每個 NI 政策都能變成 BLP，因為 NI 不一定有傳遞性（Internet → Firewall → LAN，但<i>沒有</i> Internet → LAN）。缺點是 NI 很難在真實系統上證明。</p>
<p class="memo">記憶口訣：BLP 控制檔案。NI 控制<i>每一個</i>可見的影響，所以連隱蔽通道也能阻止。</p>`,

w3t5: `<p>到目前為止我們保護的是<b>機密</b>（機密性）。完整性關乎<b>信任</b>：我能相信這資訊嗎？誰可以更改它？</p>
<p>例子：專家來源的新聞比隨便一個八卦網誌可信。所以我們也給資訊完整性標籤：高完整性 = 可信，低 = 可疑。</p>
<p>完整性的目標與機密相反：<b>不要讓壞（低可信度）資訊污染好（高可信度）資訊</b>。就像把乾淨食水和污水分開。</p>
<p>完整性標籤與機密標籤<b>互相獨立</b>。一份文件可以非常機密但不可靠，也可以完全公開但非常可靠。</p>
<p class="memo">記憶口訣：機密 = 誰可以看。完整性 = 誰可以改，或有多可信。</p>`,

/* ---------- WEEK 4 ---------- */
w4t1: `<p>Biba 就是<b>把 BLP 倒轉</b>，用來保護<b>信任</b>而不是機密。</p>
<p>比喻：一位<b>醫生</b>（高信任）和一個<b>隨便的網上論壇</b>（低信任）。</p>
<ul><li><b>嚴格完整性</b>：醫生<b>不可讀</b>論壇（「不可向下讀」），以免吸收錯誤資訊。論壇<b>不可寫入</b>醫療紀錄（「不可向上寫」）。</li>
<li><b>低水位線</b>：醫生<i>可以</i>讀論壇，但之後醫生的信任等級會<b>降</b>到論壇的等級（「你碰過污水，所以你也變髒了」）。問題：久而久之所有人都降到低等級（<b>標籤蔓延</b>）。</li>
<li><b>環 (Ring)</b>：醫生可以讀<b>任何東西</b>；我們信任他們能過濾廢話。他們仍然不可向上寫。</li></ul>
<p>各政策<b>對主體的信任程度</b>：Ring（最高）&gt; 低水位線 &gt; 嚴格（最低）。</p>
<p>三者共通的一條規則：<b>不可向上寫</b>。</p>
<p class="memo">記憶口訣：BLP = 向下讀、向上寫。Biba = 向上讀、向下寫（完全相反，所以叫「對偶」）。</p>`,

w4t2: `<p>有時我們<b>兩樣都要</b>：保密 (BLP) <i>和</i>保持資料可信 (Biba)。這時每個人和檔案都有<b>兩個標籤</b>，只有<b>兩個模型都說可以</b>才准許操作。</p>
<p>每格的做法：</p>
<ol><li>用<b>機密標籤</b>和 BLP：它允許甚麼？（R、W、RW 或 –）</li>
<li>用<b>完整性標籤</b>和 Biba：它允許甚麼？</li>
<li>只保留<b>兩者都有</b>的字母。</li></ol>
<p>例子：BLP 說 <b>RW</b>，Biba 說 <b>R</b> → 答案 <b>R</b>。BLP 說 <b>R</b>，Biba 說 <b>W</b> → 沒有共同部分 → <b>–</b>。</p>
<p>就像開夾萬需要<b>兩條鎖匙</b>：只有一條不夠。</p>
<p class="memo">記憶口訣：兩個模型都要同意。取交集。</p>`,

w4t3: `<p>Lipner 觀察一般<b>公司 IT 部門</b>，列出它的需要：</p>
<ol><li>普通員工只<b>使用</b>公司軟件；他們不自己寫程式。</li>
<li>程式員在<b>獨立的測試系統</b>上開發和測試，而不是在正式系統上。</li>
<li>把新軟件搬到正式系統需要一個<b>特別、受控並有記錄</b>的步驟。</li>
<li>經理和核數師必須能<b>查看記錄</b>。</li></ol>
<p>Lipner 證明可以<b>結合 BLP（機密）和 Biba（完整性）</b>做到這點，為每個角色配一對標籤。普通用戶可以使用正式程式但不能修改。程式員碰不到正式系統。只有「系統控制員」有特權<b>把軟件由開發環境搬到正式環境</b>，單靠 BLP 和 Biba 做不到，因為這涉及更改標籤。</p>
<p class="memo">記憶口訣：Lipner = BLP + Biba 黏在一起，用於公司的開發／正式環境分隔。</p>`,

w4t4: `<p>Clark-Wilson 是為<b>銀行一類的企業</b>設計的，主要關注賬目必須永遠<b>平衡</b>。</p>
<p>四個組成部分（以銀行說明）：</p>
<ul><li><b>CDI</b>（受約束資料項）：重要且受保護的資料，例如<b>戶口結餘</b>。</li>
<li><b>UDI</b>（不受約束資料項）：不可信的輸入，例如<b>在 ATM 輸入的數字</b>。</li>
<li><b>TP</b>（轉換程序）：<b>唯一獲批准</b>可更改 CDI 的程式，例如「存款」或「轉賬」。它們總會保持賬目平衡。</li>
<li><b>IVP</b>（完整性驗證程序）：一個<b>檢查器</b>，確認一切仍然平衡，例如每日收市後的審核。</li></ul>
<p>四大關注點：<b>認證</b>（你是誰？）、<b>審計</b>（記錄一切）、<b>良構交易</b>（只能透過批准的 TP 更改資料）、<b>職責分離</b>（沒有人可以包辦一切）。</p>
<p class="memo">記憶口訣：CDI = 受保護資料，UDI = 原始輸入，TP = 批准程式，IVP = 檢查器。</p>`,

w4t5: `<p>Clark-Wilson 有兩類規則：</p>
<ul><li><b>認證 (C) 規則</b>：由<b>可信的人</b>（保安主任）檢查並簽署確認某東西正確。就像驗樓宇升降機是否安全的檢查員。</li>
<li><b>執行 (E) 規則</b>：<b>電腦自動</b>每次執行。就像升降機超重時拒絕開動。</li></ul>
<p>必須記住的兩條：</p>
<ul><li><b>C4，記錄</b>：每個 TP 都要把足夠資料寫入<b>只可附加的記錄</b>，讓人事後能重組發生了甚麼。就像銀行的閉路電視加交易收據。</li>
<li><b>E4，職責分離</b>：<b>批核</b>程式的人<b>不能同時執行</b>它。就像簽支票的人不是開支票的人。這可阻止單一內鬼舞弊；他們需要同謀。</li></ul>
<p><b>存取三元組</b> = (用戶, TP, {CDIs})，意思是「此人可以對這些資料執行這個程式」。例如 (Alice, Transfer, {Savings, Current})。</p>
<p class="memo">記憶口訣：C = 人手檢查，E = 電腦執行。C4 = 要記錄。E4 = 批核者不能執行。</p>`,

w4t6: `<p>想像你是<b>顧問</b>。如果你替<b>可口可樂</b>工作，就不能同時看<b>百事</b>的機密，因為有利益衝突。但同時替可口可樂<i>和</i> HSBC 工作沒問題；它們不是對手。</p>
<p>三個層次：</p>
<ul><li><b>客體</b>：關於某一間公司的一個檔案。</li>
<li><b>公司資料集 (CD)</b>：關於一間公司的所有檔案（可口可樂的所有檔案）。</li>
<li><b>利益衝突 (COI) 類別</b>：一組競爭對手：{可口可樂, 百事}、{HSBC, Citibank, 渣打}。</li></ul>
<p><b>讀取規則</b>：你可以讀某公司的檔案，如果 (a) 你一直在讀同一間公司，(b) 你從未接觸它的任何對手，或 (c) 檔案是公開（已淨化）的。第一次打開可口可樂時，百事周圍就<b>永久</b>築起一道「牆」。</p>
<p><b>寫入規則</b>：只有當你讀過的全部都來自同一間公司，你才可以寫入。否則你可能把可口可樂的機密抄進一個百事顧問也能讀的共用檔案。</p>
<p>與 BLP 的關鍵分別：<b>你過去的行為決定你將來的存取權</b>。一開始你可以讀任何東西。</p>
<p class="memo">記憶口訣：中國牆 = 一旦選了一邊，就看不到對手。</p>`,

w4t7: `<p>RBAC 把權限給予<b>職位</b>，而不是個人。在<b>餐廳</b>中：「收銀員」角色可以開錢箱；「廚師」角色可以用廚房。Amy 被聘為收銀員時，只需給她收銀員角色，不用逐項設定權限。</p>
<p>三條規則：</p>
<ol><li><b>角色指派</b>：你必須有一個<b>啟用中的角色</b>才能做任何事。（Amy 必須「正在當收銀員更」。）</li>
<li><b>角色授權</b>：你啟用的角色必須是你<b>獲准擁有</b>的。（Amy 不能自封經理。）</li>
<li><b>交易授權</b>：你只能做<b>啟用角色允許</b>的操作。（若只有經理可批退款，收銀員就不能批。）</li></ol>
<p><b>職責分離</b>：某些角色絕不能給同一人，例如<b>收銀員和核數員</b>，這樣沒有人能既偷錢<i>又</i>核查自己的工作。</p>
<p class="memo">記憶口訣：權限屬於職位。要有角色、要獲准擁有、只做它允許的事。</p>`,

w4t8: `<p>完整的存取控制矩陣（每個人 × 每個檔案的巨表）又大又大部分是空的，所以系統會用更聰明的方法儲存：</p>
<ol><li><b>即時按規則計算</b>：不儲存任何東西；每次<b>計算</b>（就像 BLP 檢查標籤）。</li>
<li><b>存取控制清單 (ACL)</b>：把清單存在<b>每個檔案上</b>：「誰可以用我」。就像<b>派對門口的賓客名單</b>。</li>
<li><b>能力 (Capabilities)</b>：把清單存在<b>每個人身上</b>：「我可以用甚麼」。就像<b>你袋中的演唱會門票</b>；出示就能入場，所以門票必須無法偽造。</li></ol>
<p class="memo">記憶口訣：ACL = 門上的名單（客體）。能力 = 袋中的門票（主體）。</p>`,

/* ---------- WEEK 5 ---------- */
w5t1: `<p><b>ORCON</b> = 「<b>創作者</b>在分享文件後，仍然控制誰可以看它。」</p>
<p>例子：上司寫了一份只給你團隊的備忘錄。你可以讀，但未經上司允許<b>不能轉寄</b>，而你製作的任何<b>副本</b>都有相同限制。</p>
<p>為甚麼一般模型做不到：</p>
<ul><li><b>DAC</b> 不行：<i>擁有</i>副本的人可以更改其權限並隨意分享。</li>
<li><b>MAC</b> 不行：中央管理員需要為每一個小小的分享決定建立新類別（類別爆炸），太僵化。</li></ul>
<p>所以 ORCON 是<b>混合體</b>：副本的限制被鎖定（類似 MAC），但<b>原創者</b>仍可調整（類似 DAC）。</p>
<p>現實中的 ORCON = <b>DRM</b>。Netflix 或 Apple Music 讓你在自己的裝置上播放電影或歌曲，但阻止你隨意複製。規則<b>跟隨內容</b>。</p>
<p class="memo">記憶口訣：ORCON = 創作者控制分享；副本保留規則。DRM 是現實版本。</p>`,

w5t2: `<p><b>TCB（可信計算基）</b>是電腦中保安要運作就<b>必須</b>信任的部分：核心、硬件和韌體，以及以 root 身份運行的程式。若其中任何一個出問題，所有保安都可被繞過。所以要令 TCB <b>盡量細小</b>，因為較容易檢查。</p>
<p><b>參考監視器</b>就像大廈<b>唯一入口的保安員</b>。所有存取請求都要經過他。一個好的保安員是：</p>
<ol><li><b>完整</b>：<b>每個人、每一次</b>都檢查；沒有後門。</li>
<li><b>隔離</b>：不能被<b>賄賂或篡改</b>。</li>
<li><b>可驗證</b>：簡單到可以<b>證明</b>他正確地履行職責。</li></ol>
<p>保護環：環 0（核心）位於中心，最受信任；應用程式在外圍的環 3。</p>
<p class="memo">記憶口訣：TCB = 你必須信任的部分（要細小）。參考監視器 = 完整、隔離、可驗證。</p>`,

w5t3: `<p>針對加密的攻擊是按<b>攻擊者知道多少或能做多少</b>來命名，由弱至強：</p>
<ol><li><b>唯密文</b>：你只有<b>亂碼訊息</b>。</li>
<li><b>已知明文</b>：你有一些亂碼訊息，<b>以及</b>它們原本的內容（例如你知道每封電郵都以「Dear Sir」開頭）。</li>
<li><b>選擇明文</b>：你可以<b>令系統加密你選擇的訊息</b>並看到結果。</li>
<li><b>適應性選擇明文</b>：同上，但你根據<b>上一次的結果</b>挑選下一個訊息。</li>
<li><b>選擇密文</b>：你可以令系統<b>解密</b>你選擇的亂碼訊息。</li></ol>
<p>攻擊者控制得越多，攻擊越容易。選擇明文勝過已知明文，已知明文勝過唯密文。</p>
<p class="memo">記憶口訣：只有密文 → 知道一對 → 選擇加密 → 適應性選擇 → 選擇解密。</p>`,

w5t4: `<p><b>一次性密碼本 (one-time pad)</b> 是唯一<b>完全無法破解</b>的加密。</p>
<p>運作方法：取一條<b>真正隨機</b>、<b>與訊息一樣長</b>的金鑰，兩者做 XOR，並且<b>永不重用</b>金鑰。</p>
<p>為何完美：假設你截獲 3 個字母的密文「XQZ」。配合合適的金鑰，它可以解成「CAT」、「DOG」、「YES」、「RUN」……<b>每一個</b> 3 字母的字都同樣可能。密文給你<b>零線索</b>。</p>
<p>那為何不到處使用？因為你需要一條<b>與你所有訊息一樣長</b>的金鑰，而且要先<b>秘密地</b>把它交給對方。如果你有秘密途徑傳送金鑰，直接用那途徑傳送訊息便可。這就是<b>金鑰分發問題</b>。</p>
<p>實用的仿製方法是用偽隨機產生器，從一個短的秘密種子產生長金鑰。串流加密就是這樣運作，但它們不再是<i>完美</i>的。</p>
<p class="memo">記憶口訣：隨機 + 等長 + 只用一次 = 完美。難處：分享金鑰。</p>`,

w5t5: `<p>幾乎所有加密都由兩個簡單動作組成：</p>
<ul><li><b>替換</b> = 把字母<b>換成</b>其他字母（A→Q、B→M……）。它製造<b>混淆</b>：金鑰與密文之間的關係被隱藏。</li>
<li><b>換位</b> = <b>打亂</b>字母的次序（HELLO → LOHEL）。它製造<b>擴散</b>：訊息的一個位元影響輸出的許多位元，令規律被攤開。</li></ul>
<p>就像打果汁：替換把每種水果變成汁，換位把它們全部攪勻。把兩者重複多次（<b>輪</b>），你就分辨不出放了甚麼進去。AES 正是這樣做。</p>
<p><b>可破解</b>：有足夠時間就有可能破解（任何加密最終都能被暴力破解）。<b>強</b>：沒有比嘗試每條金鑰更快的捷徑。</p>
<p class="memo">記憶口訣：替換 → 混淆。換位 → 擴散。（「替混、換擴」）</p>`,

w5t6: `<p><b>對稱</b> = <b>一條共享金鑰</b>負責上鎖和開鎖，就像複製給朋友的家門鎖匙。速度快，但你必須<b>先秘密地交出鎖匙</b>（金鑰交換）。人多時會很混亂：每<i>一對</i>人都需要自己的金鑰，所以 100 人需要 100×99/2 = <b>4,950 條金鑰</b>。</p>
<p><b>非對稱</b> = <b>兩條金鑰</b>：給所有人的<b>公鑰</b>，和你自己保管的<b>私鑰</b>。想像一個<b>有投信口的信箱</b>：任何人都可以投信進去（用公鑰加密），但只有你有鎖匙打開（用私鑰解密）。</p>
<p>這就是非對稱如何<b>解決金鑰分發</b>：你可以公開發佈公鑰，不需要傳送任何秘密。100 人只需 2 × 100 = <b>200 條金鑰</b>。缺點：它<b>慢</b>得多，所以實際上它用來傳送一條對稱金鑰，由對稱金鑰負責繁重工作。</p>
<p class="memo">記憶口訣：對稱 = 一條共享金鑰、快、要秘密交換。非對稱 = 公開投信口加私鑰、無需秘密交換、慢。</p>`,

w5t7: `<p><b>雜湊 (hash)</b> 就像資料的<b>指紋</b>：任何檔案，無論大小，都變成一個固定長度的短代碼。即使只改一個字母，指紋也會完全改變。</p>
<p>三個特性：</p>
<ol><li><b>原像抗性</b>：從指紋推算不出原本內容（單向）。</li>
<li><b>弱碰撞抗性</b>：給你一個檔案，你無法製造一個指紋相同的<i>另一個</i>檔案。</li>
<li><b>強碰撞抗性</b>：你找不到<i>任何</i>兩個指紋相同的檔案。</li></ol>
<p>用途：下載檔案後計算其雜湊，與網站上的比較。若相同，即沒有人篡改。所以雜湊提供<b>完整性</b>。它們<b>不用金鑰</b>，也不隱藏任何東西，所以不提供機密性。</p>
<p class="memo">記憶口訣：雜湊 = 指紋。單向 + 沒有雙胞胎。只有完整性，不用金鑰。</p>`,

w5t8: `<p><b>MAC</b> 是<b>加上秘密金鑰</b>的雜湊，就像只有你和朋友才能蓋的<b>火漆印</b>。朋友收到蓋有正確印章的訊息時，就知道 (1) 它<b>沒有被改動</b>（完整性），以及 (2) 它<b>來自你</b>（認證）。但因為你們<i>雙方</i>都有印章，你無法向法官證明是誰發出的，所以<b>沒有不可否認性</b>。</p>
<p><b>認證加密 (AE)</b>，例如 AES-GCM，就是一個<b>有防拆封條的上鎖盒子</b>：</p>
<ol><li>它提供<b>密文完整性</b>（無人能在不被發現下更改它）。</li>
<li>解密時會<b>拒絕</b>任何不是用正確金鑰產生的東西。</li></ol>
<p>所以 AE = 機密<b>加</b>完整性，而普通 AES 只提供機密。</p>
<p>速查表：</p>
<ul><li>加密 → C（要金鑰 ✓）</li><li>雜湊 → I（<b>不用金鑰</b>）</li><li>MAC → I + 認證（共享金鑰 ✓）</li><li>AE → C + I（要金鑰 ✓）</li><li>數碼簽署 → I + 認證 + <b>不可否認性</b>（私鑰 ✓）</li></ul>
<p class="memo">記憶口訣：只有簽署提供不可否認性；只有雜湊不需要金鑰。</p>`,

/* ---------- WEEK 6 ---------- */
w6t1: `<p>公鑰加密需要一條<b>單程路</b>：向前走容易，除非有秘密捷徑，否則幾乎不可能走回頭。</p>
<p>RSA 的單程路是<b>質數相乘</b>：</p>
<ul><li>容易：61 × 53 = 3,233。</li>
<li>困難：「哪兩個質數相乘得 3,233？」對於有數百位的數字，即使超級電腦也要花太長時間。</li>
<li>捷徑：如果你知道其中一個質數，一除就立即得到另一個。這個秘密知識就是私鑰能運作的原因。</li></ul>
<p>所以 RSA 安全，是因為<b>把巨大的數字分解成兩個質數是不可行的</b>。</p>
<p>公鑰加密解決的問題：<b>金鑰分發問題</b>。陌生人無需先見面交換秘密金鑰，也能安全通訊。它亦令<b>數碼簽署</b>成為可能。</p>
<p class="memo">記憶口訣：RSA = 易乘難分解。公鑰解決「怎樣與陌生人共享金鑰？」</p>`,

w6t2: `<p><b>數碼簽署</b>就像親筆簽名，但無法偽造。</p>
<ul><li>你用<b>私鑰</b><b>簽署</b>（只有你擁有）。</li>
<li>任何人用你的<b>公鑰</b><b>核實</b>。</li></ul>
<p>它證明三件事：</p>
<ol><li><b>真確性</b>：它真的來自你。</li>
<li><b>完整性</b>：你簽署後沒有人改過訊息。</li>
<li><b>不可否認性</b>：你事後不能否認，因為只有你的私鑰能產生它。</li></ol>
<p>例子：簽署網上合約或軟件更新。</p>
<p><b>PKI（公開金鑰基建）</b>是整個由<b>可信機構和證書組成的體系</b>，告訴你「這條公鑰真的屬於 HSBC」。沒有它，黑客可以給你<i>他們的</i>公鑰，假扮你的銀行。</p>
<p class="memo">記憶口訣：私鑰簽署，公鑰核實。PKI = 證明公鑰屬於誰。</p>`,

w6t3: `<p>資料可處於三個地方，每處都要保護：</p>
<ul><li><b>靜態 (at rest)</b>：<b>存放在儲存裝置</b>中的資料（磁碟、備份）。就像<b>夾萬裡</b>的錢。例子：Google 磁碟上的 <b>AES-256</b>。如果有人偷走硬碟，只會得到亂碼。</li>
<li><b>傳輸中 (in transit)</b>：在網絡上<b>傳送中</b>的資料。就像<b>押運車裡</b>的錢。例子：<b>TLS</b>（瀏覽器上的鎖頭）、電郵用的 <b>S/MIME</b>。</li>
<li><b>使用中 (in use)</b>：伺服器<b>正在處理</b>的資料。就像<b>在上鎖的手套箱內</b>點算現金。例子：<b>同態加密</b>，讓伺服器在看不到真實資料的情況下運算。</li></ul>
<p>Google 亦把每個檔案分成<b>區塊</b>，每個區塊有<b>自己的金鑰</b>。如果一條金鑰外洩，只有那一小塊資料受影響。</p>
<p class="memo">記憶口訣：靜態 = 夾萬 (AES)。傳輸 = 押運車 (TLS)。使用 = 上鎖手套箱（同態）。</p>`,

w6t4: `<p>Google 使用<b>金鑰鎖住金鑰</b>，就像俄羅斯套娃，或酒店的<b>鎖匙箱層級</b>：</p>
<ol><li><b>DEK</b>（資料加密金鑰）鎖住<b>一個資料區塊</b>。每個區塊有自己的金鑰，DEK 存放在區塊旁邊，但已上鎖。</li>
<li><b>KEK</b>（金鑰加密金鑰）鎖住 <b>DEK</b>。KEK 存放於 Google 的 <b>KMS</b>（金鑰管理服務），永不離開，每次使用都有記錄。</li>
<li><b>KMS 主金鑰</b>鎖住 <b>KEK</b>。它存放於 <b>Root KMS</b>。</li>
<li><b>Root KMS 主金鑰</b>鎖住 Root KMS。它只存在於特別機器（「分發器」）的記憶體中，備份放在實體夾萬內。</li></ol>
<p>鏈條：<b>資料 ← DEK ← KEK ← KMS 主金鑰 ← Root KMS 主金鑰</b>。</p>
<p>為何這麼麻煩？因為管理金鑰時永遠不用碰海量資料，只需保護頂層的幾條金鑰。</p>
<p><b>如果金鑰被盜</b>（酒店比喻）：</p>
<ul><li><b>DEK 被盜</b> = 遺失一間房的鎖匙 → 只換<b>那一間房</b>的鎖（用新 DEK 重新加密該區塊）。</li>
<li><b>KEK 被盜</b> = 遺失一層樓的總匙 → <b>發出新 KEK</b>，並<b>重新包裝它保護的每一條 DEK</b>，停用舊的，檢查記錄有否被濫用。</li>
<li><b>主金鑰或根金鑰被盜</b> = 遺失酒店的總鎖匙 → 最壞情況。更換它，並重新包裝其下所有東西。</li></ul>
<p class="memo">記憶口訣：DEK 鎖資料，KEK 鎖 DEK，主金鑰鎖 KEK。金鑰越高層，外洩後要清理的範圍越大。</p>`,

w6t5: `<p>問題：你收到一條聲稱屬於「HSBC」的公鑰。你怎知道它不是黑客的？</p>

<p class="memo">記憶口訣：證書 = 身份證。CA = 入境處。信任鏈 = 沿簽署追溯到你已信任的根。</p>`

b:`<p>保安即是<b>保護資產免受威脅</b>。用下面的鏈條理解，每個術語是不同的一環。</p>

<p><b>風險</b>是某個威脅利用某個漏洞，對資訊系統造成不良影響的可能性。完美的保安不可能存在，所以保安「全在於管理風險」。防守者必須堵住每一個漏洞，攻擊者只需要一個。</p><div class="eg try"><b>試一試 · 指出各部分</b><div class="tq">一間醫院使用一部儲存病人紀錄的舊 Windows 伺服器，它有一個未修補的遙距桌面漏洞。一個勒索軟件集團在互聯網上掃描這個漏洞，入侵並加密了紀錄。醫院隨後安裝修補程式並啟用多重認證登入。指出資產、漏洞、威脅、攻擊和對策。</div><details><summary>顯示答案</summary><div class="ta"><b>資產</b>：病人紀錄（及伺服器）。<b>漏洞</b>：未修補的遙距桌面漏洞。<b>威脅</b>：行動前的勒索軟件集團。<b>攻擊</b>：集團利用漏洞並加密紀錄。<b>對策</b>：修補程式和多重認證登入。</div></details></div>`},

<p>風險管理是機構用來識別和應對其環境中風險的過程。次序是識別 → 評估 → 處理。</p>

w1t3:{t:'年度預期損失 (ALE)', obj:'運用 ALE 計算和評估風險（Tutorial 1 Q1–Q2）。',
b:`<p><b>ALE = SLE × ARO</b>（講義稱 ARO 為「incidence」）。</p>
<ul><li><b>SLE</b>（單次損失預期）= 一次事件的損失 = <b>資產價值 × 暴露因子</b>。</li>
<li><b>ARO</b>（年度發生率）= 每年預期發生次數。「每 10 年一次」→ ARO = 1/10 = 0.1。</li>
<li><b>ALE</b> = 每年預期損失。</li></ul>
<div class="eg try"><b>試一試 · Tutorial 1 Q1</b><div class="tq">一間分區辦公室價值 $800,000。預計每 10 年發生一次火警，會摧毀設施的 60%。求 (a) SLE、(b) ARO 及 (c) ALE。</div><details><summary>顯示答案</summary><div class="ta">(a) SLE = 800,000 × 0.6 = <b>$480,000</b><br>(b) ARO = 1/10 = <b>0.1</b><br>(c) ALE = 480,000 × 0.1 = <b>每年 $48,000</b></div></details></div>
<p><b>控制措施的成本效益：</b>價值 = ALE<sub>之前</sub> − ALE<sub>之後</sub> − 控制措施的年度成本。正數即值得購買。</p>
<div class="eg try"><b>試一試 · Tutorial 1 Q2</b><div class="tq">現時 ALE 為 $80,000。安裝網頁應用程式防火牆後 ALE 為 $20,000。WAF 每年成本 $15,000。純粹以成本效益計，應否購買？</div><details><summary>顯示答案</summary><div class="ta">80,000 − 20,000 − 15,000 = <b>每年淨效益 $45,000</b>，所以應該買。WAF 成本 $15k，卻減少了 $60k 的預期損失。</div></details></div>

b:`<ul><li><b>機密性</b>：資訊只被獲授權的實體存取。目標：防止<i>未經授權的披露</i>。最重要於：軍事及政府機密、醫療紀錄、人事資料。</li>
<li><b>完整性</b>：資訊未被未經授權地修改。目標：防止<i>未經授權的修改</i>。最重要於：證券交易所、銀行賬簿、成績紀錄。講義指出，對許多商業應用（例如公開的證券交易所）而言，完整性比機密性更重要。</li>
<li><b>可用性</b>：獲授權用戶能可靠及時地存取。威脅稱為<i>阻斷服務 (DoS)</i>。最重要於：電子商貿網站、醫院系統、電網控制、緊急服務。</li>
<li><b>認證</b>：我們可以相信某東西來自它聲稱的來源。</li>
<li><b>不可否認性</b>：防止實體否認其對資料或交易作出的行為。最重要於：合約、網上銀行轉賬、電子簽署。</li></ul>
<p>「三大」是 <b>CIA</b>。哪一項最重要視乎情境。</p>

w2t1:{t:'政策與元政策', obj:'定義兩者並解釋分別：政策 = 怎樣做，元政策 = 做甚麼和為甚麼。',
b:`<ul><li><b>政策</b>：實現特定保安目標的一套規則。它是元政策的<i>系統專屬細化</i>，指導開發者和用戶（即「規則手冊」）。它以<i>機制</i>描述：防火牆、加密、上鎖的抽屜。→ <b>怎樣做</b></li>
<li><b>元政策</b>：說明<i>整體保安目標</i>的高層次政策。它是定義和管理子政策的框架，通常以 C、I、A 表達。→ <b>做甚麼和為甚麼</b></li></ul>
<p>沒有清晰的元政策，政策就顯得隨意，難以論證或評估。我們仍需要政策，因為元政策太籠統、可有多種解讀、可能容許多個可接受的政策，而且不能直接執行。</p>
<div class="eg try"><b>試一試 · 身份證規則與 Anne 和 Bill</b><div class="tq">(a) 一間大學定下規則：「職員不可在文件中使用學生的香港身份證號碼」及「必須保留的含身份證號碼文件須妥善存放」。這些是政策還是元政策？它們服務於甚麼更大的目標？<br>(b) 政策禁止抄功課。Anne 忘記為她的檔案設定防讀，Bill 抄了它。誰違反了保安？</div><details><summary>顯示答案</summary><div class="ta">(a) 它們是<b>政策</b>（怎樣做）。它們服務的目標——保護學生個人資料的機密性——是<b>元政策</b>（做甚麼和為甚麼）。<br>(b) <b>Bill</b> 違反了保安：政策禁止抄襲而他抄了。Anne 沒有，因為政策沒有要求她保護檔案。如果有要求，她也算違反。</div></details></div>
<div class="eg try"><b>試一試 · Tutorial 1 Q6</b><div class="tq">BLP 的元政策和政策分別是甚麼？</div><details><summary>顯示答案</summary><div class="ta">元政策：資訊只可在保安等級的格中<b>向上</b>流動（保護機密性）。政策：<b>簡單安全特性</b>、<b>*-特性</b>和<b>寧靜性</b>。</div></details></div>`},
w2t2:{t:'保安標籤、許可等級與最小權限', obj:'辨認客體上的標籤和主體的許可等級；定義最小權限原則。',
b:`<p>標籤有兩部分：</p>
<ul><li>來自線性有序集合的<b>層級等級</b>：Unclassified &lt; Confidential &lt; Secret &lt; Top Secret。</li>
<li>來自<i>無序</i>集合的<b>需要知道類別</b>，例如 {Nuclear, Crypto}。</li></ul>
<p>例子：<span class="lab">(Secret: {Nuclear, Crypto})</span>。在<b>客體</b>（文件、檔案）上稱為<i>敏感度標籤</i>。在<b>主體</b>（人、程序）上稱為<i>許可等級</i>，形式相同。</p>
<p>內容混雜的文件取其包含的<b>最高</b>等級和<b>全部</b>類別。</p>
<p><b>最小權限原則 (PoLP)：</b>任何主體只應存取完成工作所需的<i>最少</i>資訊。需要知道類別就是它的一個實例：即使是 Top Secret，也不是人人都需要知道所有事。</p>
<p>術語：<b>客體</b>是資訊容器；<b>主體</b>是要求存取的實體（用戶、程序）；<b>操作</b>是所執行的動作。</p><div class="eg try"><b>試一試 · 標籤與最小權限</b><div class="tq">(a) 一份報告包含關於 Nuclear 的 Secret 資訊和關於 Crypto 的 Confidential 資訊。它應該用甚麼標籤？<br>(b) 一名薪酬文員「以防萬一」獲得公司所有系統的管理員權限。違反了哪一項原則？</div><details><summary>顯示答案</summary><div class="ta">(a) <b>(Secret, {Nuclear, Crypto})</b>：取出現過的最高等級，並包括每個類別。<br>(b) <b>最小權限原則</b>。他們只應獲得薪酬工作所需的存取權。</div></details></div>`},
w2t3:{t:'支配關係', obj:'比較兩個標籤：哪個支配，還是不可比較？',
b:`<p><span class="lab">(L1, S1) ≥ (L2, S2)</span> 當且僅當 <b>L1 ≥ L2</b> <i>而且</i> <b>S1 ⊇ S2</b>（超集）。</p>
<p>兩個條件都必須成立。支配是一種<b>偏序</b>：有些標籤對<b>不可比較</b>（兩者都不支配對方）。</p>
<div class="eg try"><b>試一試 · 支配配對</b><div class="tq">哪個標籤支配，還是不可比較？（Exercises 1 Q4 及 Tutorial 1 Q4）<ol><li>(S,{R}) 對 (C,{R})</li><li>(S,{R}) 對 (S,{R,M})</li><li>(C,{F}) 對 (C,{R})</li><li>(S,{R}) 對 (C,{R,M})</li><li>(TS,{R}) 對 (S,{R,M})</li><li>(S,{R,M}) 對 (C,{M})</li><li>(U,{}) 對 (C,{})</li><li>(H,{A,B}) 對 (H,{C,D})</li></ol></div><details><summary>顯示答案</summary><div class="ta"><ol><li>前者支配：S ≥ C 且 {R} ⊇ {R}</li><li>後者支配：等級相同，{R,M} ⊇ {R}</li><li>不可比較。等級相同，但 {F} ⊉ {R} 且 {R} ⊉ {F}，所以兩個方向都在類別上失敗。</li><li>不可比較。(S,{R}) ≥ (C,{R,M})？S ≥ C ✓ 但 {R} ⊉ {R,M} ✗（欠 M）。(C,{R,M}) ≥ (S,{R})？{R,M} ⊇ {R} ✓ 但 C ≥ S ✗。兩個方向都失敗。</li><li>不可比較。(TS,{R}) ≥ (S,{R,M})？TS ≥ S ✓ 但 {R} ⊉ {R,M} ✗。(S,{R,M}) ≥ (TS,{R})？{R,M} ⊇ {R} ✓ 但 S ≥ TS ✗。兩個方向都失敗。</li><li>前者支配：S ≥ C 且 {R,M} ⊇ {M}</li><li>後者支配：C ≥ U，{} ⊇ {}</li><li>不可比較。等級相同，但 {A,B} 和 {C,D} 互不包含，所以兩個方向都失敗。</li></ol></div></details></div>
<div class="trap"><b>考試陷阱：</b>Top Secret 不會自動勝過 Secret。<i>先</i>檢查類別集合；欠一個類別就會令標籤不可比較。空集合 {} 是所有集合的子集。</div>`},
w2t4:{t:'Bell-LaPadula：簡單安全特性與 *-特性、建立 ACM', obj:'結合支配關係運用兩個特性，得出 R、W、RW 或 N/A，並填寫 ACM。',
b:`<ul><li><b>簡單安全特性</b>（不可向上讀）：只有當 <b>S ≥ O</b>，S 才可<b>讀</b> O。</li>
<li><b>*-特性</b>（星號特性，不可向下寫）：只有當 <b>S ≤ O</b>（O 支配 S），S 才可<b>寫</b> O。</li></ul>
<p>每格的權限公式：</p>
<table class="t"><tr><th>關係</th><th>權限</th></tr>
<tr><td>S（嚴格）支配 O</td><td><b>R</b></td></tr>
<tr><td>O（嚴格）支配 S</td><td><b>W</b>（向上寫，「盲寫」）</td></tr>
<tr><td>標籤相等</td><td><b>RW</b>：兩者兼得的唯一方法</td></tr>
<tr><td>不可比較</td><td><b>–</b>（不可存取）</td></tr></table>
<div class="eg try"><b>試一試 · Tutorial 1 Q9</b><div class="tq">等級 U &lt; C &lt; S &lt; TS；類別 R、M、F。顯示答案前，先在每格填上 R、W、RW 或 –。<div class="scroll"><table class="t"><tr><th></th><th>Public (U,ø)</th><th>Internal (C,ø)</th><th>Research (S,{R})</th><th>Military (S,{R,M})</th></tr><tr><th>Alice (C,{R})</th><td></td><td></td><td></td><td></td></tr><tr><th>Bob (S,{R,M})</th><td></td><td></td><td></td><td></td></tr><tr><th>Carol (TS,{R,M,F})</th><td></td><td></td><td></td><td></td></tr><tr><th>Dave (U,ø)</th><td></td><td></td><td></td><td></td></tr></table></div>你亦可在<b>練習 → 存取控制矩陣</b>中填寫並獲得評分。</div><details><summary>顯示答案</summary><div class="ta"><div class="scroll"><table class="t"><tr><th></th><th>Public</th><th>Internal</th><th>Research</th><th>Military</th></tr><tr><th>Alice</th><td>R</td><td>R</td><td>W</td><td>W</td></tr><tr><th>Bob</th><td>R</td><td>R</td><td>R</td><td>RW</td></tr><tr><th>Carol</th><td>R</td><td>R</td><td>R</td><td>R</td></tr><tr><th>Dave</th><td>RW</td><td>W</td><td>W</td><td>W</td></tr></table></div></div></details></div>
<p>典型短題：Confidential 用戶被拒讀取 Secret 檔案 → <b>簡單安全特性</b>。Secret 程序寫入 Confidential 檔案 → <b>被 *-特性拒絕</b>（不可向下寫），因為可能洩露 Secret 資料。TS 管理員把記錄複製到 Unclassified 伺服器 → 被 <b>*-特性</b>阻止。要同時讀<i>和</i>寫，需要<b>完全相同的標籤</b>。</p>
<p>*-特性對電腦的重要性：主體可能是代表獲許可用戶運行的<i>程式</i>（可能是木馬程式），所以不能信任它不會向下洩密。BLP 不阻止低等級主體覆寫高等級檔案；那是完整性問題，不是機密性問題。</p>
<p>大型系統的 ACM 會非常龐大。它隱含在規則中，所以權限是即時計算的。</p>`},
w2t5:{t:'弱寧靜性與強寧靜性', obj:'描述兩種寧靜性特性。',
b:`<ul><li><b>強寧靜性</b>：主體和客體在系統的整個生命期內<i>永不更改標籤</i>。</li>
<li><b>弱寧靜性</b>：標籤可以更改，但<i>不能以違反保安政策精神的方式</i>更改。</li></ul>
<p>為甚麼需要寧靜性：在不改變內容下把客體由 (TS,{Crypto}) 降為 (U,{Crypto})，實際上等於<b>向下寫</b>，破壞了機密性。單靠簡單安全特性和 *-特性無法阻止。</p>
<div class="eg try"><b>試一試 · Tutorial 1 Q5</b><div class="tq">(a) 在 BLP 系統中，提高客體的分類等級會否違反任何特性？<br>(b) 管理員安全地清除了「Top Secret」分區上的所有檔案，然後系統把該分區降級為「Unclassified」。BLP 會否容許？</div><details><summary>顯示答案</summary><div class="ta">(a) 沒有洩密：部分主體失去存取權，但機密性沒有被違反。在<b>弱</b>寧靜性下可以接受（強寧靜性下不可以）。<br>(b) 已沒有分類資訊留下，所以沒有違反政策的精神。<b>弱寧靜性容許；強寧靜性不容許。</b></div></details></div>
<p><b>BLP = 簡單安全特性 + *-特性 + 寧靜性</b>（Bell 和 LaPadula，1973–75，美國國防部）。它只關注<b>機密性</b>。</p>`},
w2t6:{t:'MAC 與 DAC', obj:'描述分別並各舉例子。',
b:`<ul><li><b>強制存取控制 (MAC)</b>：規則由全系統政策在<i>每一次</i>存取時執行，普通用戶不能更改。例子：<b>BLP</b>、Biba、Lipner（軍事分類系統）。</li>
<li><b>自主存取控制 (DAC)</b>：某些用戶（通常是客體的<i>擁有者</i>）可以豁免或修改執行。例子：<b>Unix 檔案權限</b>（擁有者用 chmod）、<b>Windows NTFS 權限</b>。</li></ul>
<p>任何存取控制政策都可以用<b>存取控制矩陣</b>表示：主體為行，客體為列，每格為允許的操作。</p><div class="eg try"><b>試一試 · MAC 還是 DAC？</b><div class="tq">分類以下各項：(1) 你把 Google Drive 檔案分享給朋友；(2) 軍事系統阻止 Secret 用戶讀取 Top Secret 檔案，無人能推翻；(3) 在 Unix 上執行 <code>chmod 777 report.txt</code>；(4) 由作業系統執行的 Biba 完整性標籤。</div><details><summary>顯示答案</summary><div class="ta">(1) <b>DAC</b>，擁有者決定。(2) <b>MAC</b>，全系統且不可更改。(3) <b>DAC</b>，擁有者更改權限。(4) <b>MAC</b>。</div></details></div>`},

/* ================= WEEK 3 ================= */
w3t1:{t:'畫出保安標籤的格', obj:'為一組標籤畫出格；資訊向上流。',
b:`<p>標籤在支配關係下形成偏序，從而構成<b>格 (lattice)</b>。它按層級組織標籤，用於<b>資訊流控制</b>。</p>
<ul><li>把最低的標籤（例如 (U,{})）放在<b>底部</b>，最高的放在頂部。</li>
<li>當 A ≤ B 且<i>中間沒有其他標籤</i>時，由 A <b>向上</b>畫箭咀到 B。省略由<b>傳遞性</b>推出的箭咀（A≤B、B≤C ⇒ A≤C）。</li>
<li>永不在<b>不可比較</b>的標籤之間畫箭咀。</li>
<li>由 L1 到 L2 的路徑表示資訊可由 L1 流到 L2：L2 主體可讀 L1，或 L1 主體可寫入 L2。</li></ul>
<div class="trap"><b>考試陷阱：</b>箭咀指<b>向上</b>，由被支配的標籤指向支配者。任何向下的流動都違反 BLP 元政策。</div>
<p>在<b>練習 → 格圖建構器</b>中練習 Tutorial 1 Q10：先自己畫，再顯示答案。</p><div class="eg"><b>例題 · Week 3 講義：等級 H &gt; L，類別 {A, B}</b><div class="tq">標籤：(L,{})、(L,{A})、(L,{B})、(L,{A,B})、(H,{})、(H,{A})、(H,{B})、(H,{A,B})。<ol><li>底部：<b>(L,{})</b>，等級最低、類別最少。頂部：<b>(H,{A,B})</b>。</li><li>緊接 (L,{}) 之上的是只多加一樣東西的標籤：(L,{A})、(L,{B}) 和 (H,{})。</li><li>繼續每次加一步：(L,{A}) 向上到 (L,{A,B})（加 B）和 (H,{A})（提升等級）。</li><li>不要畫 (L,{}) → (L,{A,B})：它已由 (L,{}) → (L,{A}) → (L,{A,B}) 推出（傳遞性）。</li><li>(L,{A}) 與 (L,{B}) 之間，或 (H,{}) 與 (L,{A}) 之間沒有箭咀：不可比較。</li></ol><div class="latfig" data-k="w3"></div>它看起來像一個立方體。資訊只能沿箭咀<b>向上</b>走。</div></div><div class="eg try"><b>試一試 · Tutorial 1 Q10</b><div class="tq">為以下標籤畫格：(Public,{})、(Secret,{Alpha})、(Secret,{Beta})、(Confidential,{Beta})、(Top Secret,{Alpha,Beta})、(Confidential,{Alpha,Beta})。<br><i>提示：Secret{Alpha} 不支配 Confidential{Beta}（欠 Beta），所以 Public 必須直接連到 Secret{Alpha}。</i></div><details><summary>顯示答案</summary><div class="ta"><div class="latfig" data-k="t1q10"></div>箭咀：Public → Secret{Alpha}；Public → Conf{Beta}；Conf{Beta} → Secret{Beta}；Conf{Beta} → Conf{Alpha,Beta}；Secret{Alpha} → TS{Alpha,Beta}；Secret{Beta} → TS{Alpha,Beta}；Conf{Alpha,Beta} → TS{Alpha,Beta}。<br>Secret{Alpha} 與 Conf{Alpha,Beta} 之間沒有箭咀：Secret 較高但欠 Beta，所以不可比較。</div></details></div><div class="eg try"><b>試一試 · Week 3 講義：全序？</b><div class="tq">標籤：(L,{})、(H,{A,B,C})、(L,{A})、(H,{A,B})、(L,{A,B})。(a) 能否把它們排成一條直線（全序），使每個都支配前一個？(b) 如果加入 (L,{B,C}) 呢？</div><details><summary>顯示答案</summary><div class="ta">(a) <b>可以</b>：(L,{}) ≤ (L,{A}) ≤ (L,{A,B}) ≤ (H,{A,B}) ≤ (H,{A,B,C})。每一步加一個類別或提升等級。<br>(b) <b>不可以</b>。(L,{B,C}) 與 (L,{A})、(L,{A,B}) 和 (H,{A,B}) 都不可比較，因為它們的集合都不包含 {B,C}，而 {B,C} 也不包含它們的集合。現在只是<b>偏序</b>，所以得到一個有分支的格：<div class="latfig" data-k="w3b"></div></div></details></div><div class="eg try"><b>試一試 · 用講義 Air/Sea 標籤的練習</b><div class="tq">為以下標籤畫格：(U,{})、(C,{Air})、(C,{Sea})、(S,{Air,Sea})、(TS,{Sea})、(TS,{Air,Sea})。</div><details><summary>顯示答案</summary><div class="ta"><div class="latfig" data-k="ex"></div>(TS,{Sea}) 與 (S,{Air,Sea}) 不可比較：TS 較高，但 {Sea} 欠 Air。兩者都向上連到 (TS,{Air,Sea})。</div></details></div>`},
w3t2:{t:'隱蔽通道：儲存與時序', obj:'定義、舉例，並把描述分類為儲存或時序。',
b:`<p><b>定義：</b>系統內<i>主體之間非法資訊流</i>的途徑，利用並非為主體間通訊而設計的系統資源。它違反<i>元政策</i>，但不一定違反<i>政策</i>，所以 BLP 的規則可以被滿足，而資訊仍由高向低洩露。</p>
<table class="t"><tr><th></th><th>隱蔽儲存通道</th><th>隱蔽時序通道</th></tr>
<tr><td>資訊承載於</td><td><b>系統狀態</b>：共享客體的屬性</td><td><b>事件的次序或持續時間</b></td></tr>
<tr><td>接收者需要</td><td>看到該屬性</td><td><b>時間參考</b>（時鐘、計時器、次序）</td></tr>
<tr><td>例子</td><td>CREATE/DESTROY 一個低等級會檢查的檔案；「找不到資源」與「拒絕存取」錯誤；切換檔案是否存在（Exercises 2 Q1）</td><td>KVM/370：用盡整個 CPU 時間片或提早讓出；改變 CPU 用量（Exercises 2 Q2）；磁頭次序：q 先得 139 後 161，或先 161 後 139</td></tr></table>
<p>其他類型：隱式（控制流，<code>if h==1 then l=1</code>）、終止、機率、資源耗盡、電源。實際上大多數人只區分儲存和時序。</p>
<p><b>特徵：</b>存在性、頻寬（真實通道可達每秒數千位元）、有雜訊或無雜訊。<b>應對：</b>消除（修改實作）、降低頻寬（加入雜訊）或監察（入侵偵測）。對於 CPU 時序通道：給每個程序一個不能提早讓出的固定時間片，或移除接收者所用的時鐘或為其加入雜訊。</p>
<p><b>為何難以消除</b>（Exercises 2 Q4）：大型系統有大量共享資源和屬性，而且許多干擾是無害的。要找出所有通道需要深入了解每項操作的語義，所以通常不可行。</p>
<p>微架構例子：<b>Meltdown</b>（核心記憶體）和 <b>Foreshadow</b>（L1 快取）都利用亂序執行。</p><div class="eg try"><b>試一試 · 儲存還是時序？</b><div class="tq">(1) 高等級程序令打印佇列滿 (1) 或空 (0)；低等級程序檢查自己的打印工作是否被接受。(2) 高等級程序進行大量磁碟工作 (1) 或沒有 (0)；低等級程序量度自己讀磁碟要多久。(3) 高等級程序鎖上 (1) 或解鎖 (0) 一個共享檔案；低等級程序嘗試打開它。(4) Exercises 2 Q2：怎樣關閉 CPU 時間通道？</div><details><summary>顯示答案</summary><div class="ta">(1) <b>儲存</b>：「佇列已滿」這個狀態承載位元。(2) <b>時序</b>：接收者量度持續時間。(3) <b>儲存</b>：鎖的狀態承載位元。(4) 給每個程序一個不能提早讓出的<b>固定時間片</b>，或<b>移除接收者所用的時鐘或為其加入雜訊</b>。</div></details></div>`},
w3t3:{t:'共享資源矩陣方法 (SRM)', obj:'解釋 SRM 如何偵測潛在隱蔽通道（不會要求你實際做一個）。',
b:`<ul><li>由 <b>Kemmerer</b>（1980 年代初）提出，用來找出潛在的<b>儲存和時序</b>通道。</li>
<li>根據系統的<b>功能規格</b>建表：<b>行 = 共享屬性</b>（檔案是否存在、大小、等級……），<b>列 = 操作</b>（READ、WRITE、CREATE、DESTROY）。</li>
<li>若操作在某些情況下<i>參照</i>（透露關於）該屬性，標 <b>R</b>；若它<i>修改</i>該屬性，標 <b>M</b>。</li>
<li><b>同一行有 R 和 M 即表示有潛在隱蔽通道</b>：一個主體可以修改屬性，另一個可以觀察它。</li>
<li>SRM 不會直接認定通道；它只建議要查哪裡。每個矩陣只適用於一個系統。</li></ul>
<p>這源自儲存通道的條件：發送者必須能修改共享屬性，接收者必須能看到它。實際上，你用 BLP 處理正常資訊流，用 SRM 找隱蔽通道，然後關閉、限制或監察它們。</p><div class="eg"><b>例題 · 一個小型 SRM 表</b><div class="tq">用 Week 3 的操作（READ、WRITE、CREATE、DESTROY）處理一個共享檔案：<div class="scroll"><table class="t"><tr><th>屬性</th><th>READ</th><th>WRITE</th><th>CREATE</th><th>DESTROY</th></tr><tr><td>檔案是否存在</td><td>R</td><td></td><td>R, M</td><td>M</td></tr><tr><td>檔案大小</td><td>R</td><td>M</td><td>M</td><td>M</td></tr><tr><td>檔案等級</td><td>R</td><td></td><td>M</td><td>M</td></tr></table></div>每一行都有 <b>R 和 M</b>，所以每個屬性都可能承載隱蔽訊號。例如高等級主體 CREATE 或 DESTROY 一個檔案（對「存在」為 M），低等級主體嘗試用同一名稱 CREATE，並留意有否發生甚麼 (R)。這就是講義中的 1 位元通道。表只標出<b>嫌疑</b>；分析員再逐一檢查。</div></div><div class="eg try"><b>試一試 · 解釋 SRM</b><div class="tq">用你自己的話說，SRM 如何幫助偵測隱蔽通道？（不會要求你建表，只需解釋。）</div><details><summary>顯示答案</summary><div class="ta">根據系統的功能規格建立矩陣：<b>行 = 共享屬性</b>，<b>列 = 操作</b>。操作能修改屬性的標 <b>M</b>，能透露屬性的標 <b>R</b>。<b>同時有 R 和 M</b> 的一行代表一個主體可以改變屬性、另一個可以觀察它：一個需要調查的<b>潛在</b>儲存或時序通道。它指出嫌疑，但不證明通道存在（Kemmerer，1980 年代）。</div></details></div>`},
w3t4:{t:'不干擾性 (NI) 與 BLP 的不足', obj:'定義 NI；解釋它處理了甚麼 BLP 處理不了的東西（隱蔽通道）。',
b:`<p><b>不干擾性</b>是一種<b>資訊流政策</b>。它不規定哪個主體讀寫哪個客體，而是說明<i>哪些主體可以干擾哪些主體</i>。「A 干擾 B」即 A 做了某件事，其影響被 B 看得到。</p>
<ul><li>以主體之間的<b>自反二元關係</b>表示，例如 S1 → S2、S2 → S3。</li>
<li>若只有 L → H：<b>H 所做的任何事都不能有 L 看得到的影響</b>。</li></ul>
<p><b>為何比 BLP 全面：</b>BLP 只控制透過<i>客體內容</i>（讀和寫）的資訊流。NI 涵蓋 <b>L 能觀察到的一切</b>：檔案是否存在、系統旗標、系統時鐘。所以按定義它排除了隱蔽儲存<i>和</i>時序通道。NI 直接模擬機密性元政策。</p>
<ul><li>任何 MLS (BLP) 政策都可改寫成 NI 政策：若 Sj 支配 Si，則 Si → Sj。</li>
<li>並非每個 NI 政策都能寫成 MLS，因為 NI 不一定有<b>傳遞性</b>。例子：防火牆政策 INTERNET → Firewall → LAN，但沒有直接的 Internet → LAN。</li>
<li>缺點：在真實系統上證明 NI 極為困難，因為干擾很常見，而且很多是無害的。</li></ul><div class="eg try"><b>試一試 · 不干擾性</b><div class="tq">(a) Exercises 2 Q5：為何 NI 在洩密方面比 BLP 全面？<br>(b) 防火牆政策為 INTERNET → Firewall → LAN，沒有直接的 INTERNET → LAN。這能否寫成 BLP (MLS) 政策？</div><details><summary>顯示答案</summary><div class="ta">(a) BLP 只控制讀寫<b>客體內容</b>。NI 規定 H 所做的<b>任何事</b>都不能有 L 看得到的影響，所以隱蔽儲存和時序通道也被涵蓋。<br>(b) <b>不能。</b>MLS 政策有傳遞性（A → B 和 B → C 即 A → C），但這個 NI 政策刻意沒有。</div></details></div>`},
w3t5:{t:'完整性基礎（銜接 Week 4）', obj:'Biba 和 Lipner 所用的背景知識。',
b:`<ul><li>完整性關心誰可以寫入、修改或產生資訊。它比機密性更模糊、更依賴情境，而且程式單憑計算錯誤就能自行破壞完整性。</li>
<li><b>完整性標籤</b>與 BLP 標籤形式相同（可信度等級加能力類別，例如 (Expert: {Physics})），支配關係的運作方式也一樣。它們<b>不是</b>許可等級標籤：機密性和完整性是<b>正交</b>的，所以同時執行兩者的系統需要兩套標籤。</li>
<li>完整性元政策：<b>不要讓壞資訊「污染」好資訊</b>，即資訊不應在完整性上<i>向上</i>流。所以：（完整性上）不可向上寫、不可向下讀。</li>
<li>商業原則：職責分離、功能分離、審計。</li></ul><div class="eg try"><b>試一試 · 完整性標籤</b><div class="tq">(a) (Expert,{Physics}) 和 (Student,{Physics}) 可否比較？(b) (Novice,{Physics, Arts}) 對 (Expert,{Physics}) 又如何？(c) 用一句話說出完整性元政策。</div><details><summary>顯示答案</summary><div class="ta">(a) 可以：<b>Expert 支配</b>（等級較高，集合相同）。(b) <b>不可比較</b>：Novice 集合較大但等級較低，方向相反。(c) <b>資訊不可在完整性上向上流</b>：壞資料不能污染好資料。</div></details></div>`}
});

Object.assign(TOPIC_ZH, {
/* ================= WEEK 4 ================= */
w4t1:{t:'Biba：嚴格完整性、低水位線、環', obj:'掌握 Biba 三個政策各自的讀寫規則。',
b:`<table class="t"><tr><th>政策</th><th>讀取規則</th><th>寫入規則</th><th>對主體的信任</th></tr>
<tr><td><b>嚴格完整性</b>（即「Biba 模型」）</td><td>簡單完整性特性：只有當 <b>i(s) ≤ i(o)</b>，s 才可讀 o（不可向下讀）</td><td>完整性 *-特性：只有當 <b>i(o) ≤ i(s)</b>，s 才可寫 o（不可向上寫）</td><td>最不信任</td></tr>
<tr><td><b>低水位線</b></td><td>可讀任何東西，但之後 <b>i′(s) = min(i(s), i(o))</b>，即主體等級下降</td><td>只有當 i(o) ≤ i(s)</td><td>中等</td></tr>
<tr><td><b>環 (Ring)</b></td><td><b>任何</b>主體可讀任何客體</td><td>只有當 i(o) ≤ i(s)</td><td>最信任：假設主體會過濾所讀內容</td></tr></table>
<ul><li><b>三者共通</b>（Tutorial 2 Q4）：都不容許在完整性上<b>向上寫</b>。</li>
<li><b>按對主體的信任排列</b>（Tutorial 2 Q3）：Ring &gt; 低水位線 &gt; 嚴格。</li>
<li>低水位線的問題：<b>標籤蔓延</b>。主體不斷下降，直至沒有主體能存取高完整性客體。</li>
<li>低水位線與中國牆一樣，取決於<b>過去的存取</b>（Tutorial 2 Q2）。</li>
<li><b>為何嚴格完整性是 BLP 的「對偶」？</b>（Tutorial 2 Q1）它的規則就是把 BLP 規則的不等號倒轉。BLP 是不可向上讀、不可向下寫（為機密性）；嚴格完整性是不可向下讀、不可向上寫（為完整性）。</li></ul><div class="eg try"><b>試一試 · Week 4 講義：Biba 嚴格矩陣</b><div class="tq">完整性等級 H &gt; L。主體：Subj1 (H,{A,B,C})、Subj2 (L,{})、Subj3 (L,{A,B})。客體：Obj1 (L,{A,B,C})、Obj2 (L,{})、Obj3 (L,{B,C})。i(s) ≤ i(o) 時可讀，i(o) ≤ i(s) 時可寫。填上 R、W、RW 或 –。</div><details><summary>顯示答案</summary><div class="ta"><div class="scroll"><table class="t"><tr><th></th><th>Obj1 (L,{A,B,C})</th><th>Obj2 (L,{})</th><th>Obj3 (L,{B,C})</th></tr><tr><td><b>Subj1</b> (H,{A,B,C})</td><td>W</td><td>W</td><td>W</td></tr><tr><td><b>Subj2</b> (L,{})</td><td>R</td><td>RW</td><td>R</td></tr><tr><td><b>Subj3</b> (L,{A,B})</td><td>R</td><td>W</td><td>–</td></tr></table></div>Subj1 支配所有客體，所以只能（向下）寫。Subj3 與 Obj3 不可比較，所以沒有存取權。與 BLP 比較：同樣是「主體支配」的情況，BLP 給 R 而不是 W。</div></details></div><div class="eg try"><b>試一試 · 低水位線</b><div class="tq">在低水位線政策下，一個完整性為 <b>High</b> 的主體讀取一個完整性為 <b>Low</b> 的客體。(a) 容許讀取嗎？(b) 主體會怎樣？(c) 它現在能寫入 High 客體嗎？</div><details><summary>顯示答案</summary><div class="ta">(a) <b>容許</b>，低水位線容許讀取。(b) 它的等級下降：i′(s) = min(High, Low) = <b>Low</b>。(c) <b>不能</b>：寫入需要 i(o) ≤ i(s)，而 High ≤ Low 不成立。重複這樣讀取會導致<b>標籤蔓延</b>。</div></details></div>`},
w4t2:{t:'結合 BLP 與嚴格完整性', obj:'運用全部四個特性找出讀寫權限。',
b:`<p>每個主體和客體都有一個機密性標籤<i>和</i>一個完整性標籤。<b>只有 BLP 和 Biba 都容許</b>時才可存取。</p>
<ul><li><b>讀取</b>需要 C(s) ≥ C(o) [BLP 簡單安全特性] <b>及</b> I(s) ≤ I(o) [簡單完整性特性]。</li>
<li><b>寫入</b>需要 C(s) ≤ C(o) [BLP *-特性] <b>及</b> I(s) ≥ I(o) [完整性 *-特性]。</li></ul>
<div class="eg try"><b>試一試 · 結合結果</b><div class="tq">某主體與客體，BLP 給 <b>RW</b>，Biba 給 <b>W</b>。另一格中，BLP 給 <b>R</b>，Biba 給 <b>W</b>。兩格合併後的權限各是甚麼？</div><details><summary>顯示答案</summary><div class="ta">只保留<b>兩者</b>都容許的字母：RW ∩ W = <b>W</b>；R ∩ W = <b>–</b>（不可存取）。</div></details></div>
<p>在<b>練習 → 存取控制矩陣</b>中用「BLP + Biba」模式練習。</p>`},
w4t3:{t:'Lipner 完整性矩陣模型', obj:'概括描述：它處理哪些關注點？',
b:`<p>Lipner 模型處理 Lipner 所描述的<b>商業完整性關注點</b>：</p>
<ol><li>用戶不自己寫程式；他們使用現有的正式軟件。</li>
<li>程式員在<i>非正式</i>系統上開發和測試，可能使用虛構資料。</li>
<li>把應用程式由開發搬到正式環境需要特別的<b>受控及經審計</b>程序。</li>
<li>經理和核數師必須能存取系統狀態和系統記錄。</li></ol>
<p>它是 <b>BLP 與 Biba 嚴格完整性的混合體</b>。機密性等級為 AM（審計經理）&gt; SL（系統最低），類別為 SP、SD、SSD。完整性等級為 ISP &gt; IO &gt; ISL，類別為 ID、IP。標籤按角色和需要知道而指派。</p>
<p>把軟件由開發搬到正式環境需要一個特別的<b>降級</b>特權（由系統控制員持有）。這涉及更改標籤，單靠 BLP 和 Biba 做不到，所以它放寬了寧靜性。</p>
<div class="eg try"><b>試一試 · Tutorial 2 Q5</b><div class="tq">在 Lipner 模型中（SL &lt; AM），普通用戶的機密性為 (SL,{SP})，完整性為 (ISL,{IP})。正式程式碼為 (SL,{SP}) / (IO,{IP})。系統記錄為 (AM,{SP,SD,SSD}) / (ISL,ø)。用戶能否 (a) 讀取正式程式碼，(b) 寫入系統記錄？</div><details><summary>顯示答案</summary><div class="ta">(a) BLP 讀取 OK（標籤相等）；Biba 讀取 OK，因為 ISL ≤ IO → <b>准許</b>。<br>(b) BLP 向上寫 OK（用戶 ≤ 記錄）；Biba 寫入 OK，因為 (ISL,ø) ≤ (ISL,{IP}) → <b>准許</b>。用戶可以加入記錄但不能讀取，因為那會是 BLP 的向上讀。</div></details></div>`},
w4t4:{t:'Clark-Wilson：關注點與四個類別', obj:'四大基本關注點，以及 CDI、UDI、TP 和 IVP。',
b:`<p>商業完整性關乎<b>一致性</b>：資料必須滿足完整性約束（以銀行為例：開市資金 + 存款 − 提款 = 收市資金）。</p>
<p><b>四大基本關注點：</b></p>
<ol><li><b>認證</b>：每個用戶的身份都經過妥善認證。</li>
<li><b>審計</b>：修改以無法被破壞的方式記錄（執行了甚麼程式、由誰執行）。</li>
<li><b>良構交易</b>：用戶只能以受約束的方式操作資料。</li>
<li><b>職責分離</b>：每個用戶與一組有效的程式綁定，防止未經授權的修改。</li></ol>
<p><b>四個類別：</b></p>
<ul><li><b>CDI</b>（受約束資料項）：完整性受保護的資料，例如戶口結餘。</li>
<li><b>UDI</b>（不受約束資料項）：不受政策涵蓋的資料，例如鍵盤輸入。</li>
<li><b>TP</b>（轉換程序）：<i>唯一</i>容許修改 CDI 或把 UDI 轉為 CDI 的程序；它們把系統由一個有效狀態帶到另一個有效狀態。</li>
<li><b>IVP</b>（完整性驗證程序）：檢查 CDI 是否處於有效狀態。</li></ul><div class="eg try"><b>試一試 · 指出 Clark-Wilson 的各部分</b><div class="tq">網上銀行：(1) 客戶的戶口結餘；(2) 在「轉賬」欄輸入的金額；(3)「轉賬」程式；(4) 每晚檢查總存款 − 提款是否與結餘吻合的工作；(5) 交易記錄。把每項分類為 CDI、UDI、TP 或 IVP。</div><details><summary>顯示答案</summary><div class="ta">(1) <b>CDI</b>。(2) <b>UDI</b>：在 TP 驗證前是不可信輸入。(3) <b>TP</b>。(4) <b>IVP</b>。(5) <b>CDI</b>：C4 規定的只可附加記錄。</div></details></div>`},
w4t5:{t:'Clark-Wilson 規則：認證與執行、C4、E4、存取三元組', obj:'了解各類規則的用途；描述 C4 和 E4；解釋存取三元組。',
b:`<ul><li><b>認證規則 (C1–C5)</b>：由可信的人類<b>認證者</b>或保安主任檢查。它們確認程序正確，例如 IVP 和 TP 是有效的。系統無法自行檢查這些。</li>
<li><b>執行規則 (E1–E4)</b>：<b>由系統自動</b>執行。它們在運行時維持已認證的關係。</li></ul>
<table class="t"><tr><th>規則</th><th>內容</th></tr>
<tr><td>C1</td><td>IVP 運行時必須確保 CDI 處於有效狀態</td></tr>
<tr><td>C2</td><td>TP 必須被認證為能保持完整性（有效 → 有效）</td></tr>
<tr><td>C3</td><td>把 TP 指派給用戶必須符合職責分離</td></tr>
<tr><td><b>C4</b></td><td><b>TP 的運作必須被記錄</b>：每個 TP 把足以重組該操作的資訊附加到一個<i>只可附加的 CDI</i>（記錄）中，讓核數師能看到發生了甚麼</td></tr>
<tr><td>C5</td><td>接收 UDI 的 TP 只能進行有效的轉換（拒絕輸入或把它轉為有效的 CDI）</td></tr>
<tr><td>E1</td><td>只有已認證的 TP 可操作 CDI</td></tr>
<tr><td>E2</td><td>用戶只能透過他們獲授權的 TP 存取 CDI</td></tr>
<tr><td>E3</td><td>每個執行 TP 的用戶都必須經過認證</td></tr>
<tr><td><b>E4</b></td><td><b>只有 TP 的認證者可以更改與該 TP 相關的實體清單，而且認證者不得擁有該實體的執行權限</b>。這執行了職責分離。</td></tr></table>
<p><b>E4 為何重要</b>（Tutorial 2 Q6b）：它防止同一人既認證又執行 TP。這阻止單一內鬼批核自己的詐騙交易；需要同謀才能做到。<b>C4 為何重要：</b>問責和可復原性，因為核數師能重組每一筆交易。</p>
<p><b>存取三元組：</b><span class="lab">(user, TP, {CDI set})</span>。該用戶可以對那些 CDI 執行那個 TP。三元組編碼<i>允許的關係</i>，每個三元組都必須符合所有 C 和 E 規則。</p>
<p>與 Biba 比較：Biba 沒有認證規則，依賴可信主體。Clark-Wilson 認證的是提升不可信資料所用的<i>方法</i>，而不是資料本身。</p><div class="eg try"><b>試一試 · 認證與執行</b><div class="tq">以下適用哪條規則？是認證還是執行？(1) 系統拒絕讓 Bob 執行「批核付款」，因為他不在允許清單上。(2) 保安主任審閱「轉賬」程式的程式碼，確認它保持賬目平衡。(3) Carol 認證了「薪酬」TP，所以系統不讓她執行它。(4) 每個 TP 都把一筆紀錄寫入只可附加的記錄。</div><details><summary>顯示答案</summary><div class="ta">(1) <b>E2</b>，執行：用戶只能透過獲授權的 TP 存取 CDI。(2) <b>C2</b>，認證：TP 被認證為能保持完整性。(3) <b>E4</b>，執行及職責分離：認證者不能執行。(4) <b>C4</b>，認證：記錄。</div></details></div>`},
w4t6:{t:'中國牆政策', obj:'商業關注點；客體、公司資料集、COI 類別；CW 簡單安全特性與 *-特性。',
b:`<p><b>關注點：</b>顧問或承辦商的<b>利益衝突</b>和無意披露（Brewer 和 Nash，1989）。例子：為國泰航空提供意見的律師不應同時為香港航空提供意見，但麥當勞就沒問題。嚴格來說，它是一種存取控制<i>機密性</i>政策。</p>
<p><b>三個抽象層次：</b></p>
<ul><li><b>客體</b>：個別項目，例如檔案，每個關於<i>一間</i>公司。</li>
<li><b>公司資料集 (CD)</b>：關於一間公司的所有客體。</li>
<li><b>利益衝突 (COI) 類別</b>：互相競爭的公司的資料集，例如 {Ford, Chrysler, GM} 或 {HSBC, StanChart, Citibank}。</li></ul>
<p><b>CW 簡單安全特性（讀）：</b>只有當 o 屬於 s <i>已存取過</i>的 CD（牆內），<b>或</b>屬於完全不同的 COI 類別，<b>或</b> o 已<b>淨化</b>，s 才可讀 o。</p>
<p><b>CW *-特性（寫）：</b>只有當 (1) s 可以讀 o，<b>而且</b> (2) s 能讀的每個<i>未淨化</i>客體都與 o 屬於<b>同一個 CD</b>，s 才可寫 o。這防止<i>間接</i>洩密：如果 Anthony（讀過 Bank 1）能寫入 Gas，Susan（讀過 Bank 2）就能透過 Gas 讀到 Bank 1 的資訊。</p>
<p><b>讀取規則如何處理利益衝突：</b>一旦你讀了某 COI 類別中的一間公司，它的所有競爭對手都被永久封鎖。你不能同時擁有兩個競爭對手的內幕資料。</p>
<p>與 BLP 比較：CW <b>沒有標籤</b>，並取決於<b>過去的存取歷史</b>，所以權限會動態改變。起初主體可以讀任何東西。</p><div class="eg try"><b>試一試 · 中國牆</b><div class="tq">COI 類別：銀行 {HSBC, Citi} 和石油 {Shell, BP}。Anthony 讀過 <b>HSBC</b> 和 <b>Shell</b>。(a) 他能讀 Citi 嗎？(b) BP 呢？(c) 更多 HSBC 檔案呢？(d) 他能<b>寫入</b> HSBC 檔案嗎？(e) 為甚麼？</div><details><summary>顯示答案</summary><div class="ta">(a) <b>不能</b>：與 HSBC 同一 COI。(b) <b>不能</b>：與 Shell 同一 COI。(c) <b>能</b>：同一資料集，在牆內。(d) <b>不能。</b>(e) *-特性只在他能讀的每個未淨化資料集都是 HSBC 時才容許寫入。他也讀過 Shell，所以寫入 HSBC 可能把 Shell 的資訊洩露給之後讀 HSBC 和 BP 的人。在<b>練習 → 中國牆模擬器</b>中試試。</div></details></div>`},
w4t7:{t:'角色為本存取控制 (RBAC)', obj:'RBAC 三條主要規則及職責分離的目的。',
b:`<p>權限附屬於<b>角色</b>（職能：櫃員、經理、核數員），而不是個別主體。主體有<i>獲授權</i>的角色和當前<i>啟用中</i>的角色。</p>
<ol><li><b>角色指派</b>：主體只有在有<i>啟用中的角色</i>時才能執行交易。</li>
<li><b>角色授權</b>：主體的啟用角色必須是其<i>獲授權角色</i>之一。</li>
<li><b>交易授權</b>：只有當交易獲主體某個<i>啟用中角色</i>授權時，主體才能執行它。</li></ol>
<p><b>RBAC 中的職責分離：</b>一個人不能同時擁有兩個有衝突的角色。例如若櫃員是 S 的獲授權角色之一，核數員就被排除。這防止一個人既執行又核查關鍵職能，所以詐騙需要同謀。</p>
<p>包含關係：高級角色（培訓員）能做初級角色（學員）能做的一切。優點：易於管理、權限與機構對應（「開戶」而不是「讀檔案」），而且人可以轉換角色而不改變身份。</p><div class="eg try"><b>試一試 · RBAC</b><div class="tq">在一間銀行，Mary 的獲授權角色為 {Teller, Trainer}。她現時以 Teller 身份登入。(a) 她能執行「兌現支票」（Teller 交易）嗎？(b)「舉辦培訓課程」（只限 Trainer）呢？(c) 她能否同時獲得 Auditor 角色？各由哪條規則決定？</div><details><summary>顯示答案</summary><div class="ta">(a) <b>能</b>：她有啟用中的角色（規則 1），它是獲授權的（規則 2），而且交易屬於該角色（規則 3）。(b) <b>現在不能</b>：Trainer 未啟用（規則 3）。她必須先切換啟用角色。(c) <b>不能</b>：<b>職責分離</b>，因為 Teller 與 Auditor 有衝突。</div></details></div>`},
w4t8:{t:'儲存存取控制矩陣的三種方法', obj:'描述 ACM 可以怎樣建立或儲存。',
b:`<ol><li><b>根據主體和客體的屬性即時計算規則</b>（例如 BLP 的支配檢查）。不儲存矩陣。</li>
<li><b>存取控制清單 (ACL)</b>：把權限以 &lt;S, P&gt; 配對<b>與每個客體</b>一同儲存（矩陣的一列）。</li>
<li><b>能力 (Capabilities)</b>：把權限以 &lt;O, A&gt; 配對<b>與每個主體</b>一同儲存（矩陣的一行）。能力就像門票：持有它即證明有權限，所以它必須無法偽造（例如透過標記位元或受保護的記憶體）。</li></ol>
<p>明確的完整矩陣成本高而且大部分是空的，所以很少被儲存。</p>
<p><b>臨床資訊系統</b>（亦屬 Week 4）：每份紀錄有一個 ACL；由負責的臨床醫生管理；病人會獲通知；所有存取都被記錄；限制（目的地的 ACL ⊆ 來源的 ACL）；聚合控制。它結合了機密性和完整性。</p><div class="eg try"><b>試一試 · ACL 還是能力？</b><div class="tq">矩陣：Alice 可讀 File1、可寫 File2；Bob 可讀 File2。(a) 寫出 File2 的 ACL。(b) 寫出 Alice 的能力清單。(c)「儲存」矩陣的第三種方法是甚麼？</div><details><summary>顯示答案</summary><div class="ta">(a) File2：&lt;Alice, W&gt;、&lt;Bob, R&gt;（與<b>客體</b>一同儲存）。(b) Alice：&lt;File1, R&gt;、&lt;File2, W&gt;（與<b>主體</b>一同儲存）。(c) 甚麼都不儲存，<b>按規則即時計算</b>（就像 BLP 的支配關係）。</div></details></div>`},

/* ================= WEEK 5 ================= */
w5t1:{t:'原創者控制存取控制 (ORCON)', obj:'它是甚麼及其目的。',
b:`<p><b>目的：</b>文件的<b>原創者</b>（創作者）控制它如何被<i>散播</i>，即使副本已經發出。例子：農業部長給下屬的備忘錄，未經她允許不能轉交他人。</p>
<p>要求：(1) 未經原創者 X 允許，o 不能發放給其他機構；(2) <b>o 的任何副本都帶有相同限制</b>。</p>
<ul><li><b>DAC 不行</b>：<i>擁有者</i>（不一定是原創者）可以設定任何權限，所以無法執行要求 2。</li>
<li><b>單靠 MAC 不行</b>：類別由中央管理，導致<b>類別爆炸</b>，而且無法靈活地授權未能預見的主體。</li>
<li><b>ORCON 是 MAC 與 DAC 的結合</b>：限制綁定於每個副本，擁有者不能更改（類似 MAC），但<i>原創者</i>可以按主體和客體更改（類似 DAC）。</li></ul>
<p><b>DRM</b> 應用了 ORCON：它對數碼內容如何被使用和再分發提供持續的控制。元素：內容、授權、授予、發出者、主體、裝置。規則與內容而不是用戶綁定，並在其整個生命期內持續。例子：Microsoft <b>PlayReady</b>（AES 內容、授權伺服器、裝置上的 TEE）和 Apple <b>FairPlay</b>（主金鑰由用戶金鑰鎖住；最多 5 部授權系統）。</p><div class="eg try"><b>試一試 · ORCON</b><div class="tq">(a) Exercises 4 Q1：ORCON 處理甚麼具體問題？(b) 為何單靠 DAC 無法執行它？(c) 舉一個現實例子。</div><details><summary>顯示答案</summary><div class="ta">(a) 讓<b>原創者</b>控制進一步散播，而且<b>副本保留相同限制</b>。(b) 在 DAC 下，擁有副本的人可以更改其權限並轉交他人。(c) <b>DRM</b>：Microsoft PlayReady、Apple FairPlay、Netflix 下載。</div></details></div>`},
w5t2:{t:'可信計算基與參考監視器', obj:'定義 TCB 並列出參考監視器的三個特性。',
b:`<p><b>TCB：</b>對執行保安政策至關重要的所有<b>硬件、韌體和軟件</b>組件。要令它<b>盡量細小</b>，以便更易驗證、錯誤更少。TCB <i>以外</i>的故障無法幫助攻擊者違反政策。Unix 例子：核心和驅動程式、root 程序、setuid-root 程式、建構這些東西的工具、CPU、儲存韌體及檔案伺服器。</p>
<p><b>參考監視器：</b>一部抽象機器，調解任何主體對任何客體的<b>所有</b>存取，而且不能被繞過。<b>保安核心</b>是它的一種實作。它的三個特性：</p>
<ol><li><b>完整</b>：調解每一次存取，所以不能被繞過。</li>
<li><b>隔離</b>：受保護，不會被其他實體修改。</li>
<li><b>可驗證</b>：細小簡單到可以測試並證明正確。</li></ol>
<p>保護環：環 0 = 核心（最受信任），1 = 非特權作業系統，2 = 驅動程式和工具，3 = 應用程式。越往內越受信任。在網絡信任環中，主機信任內環，永不信任外環（對比 Biba）。</p><div class="eg try"><b>試一試 · 參考監視器</b><div class="tq">以下每個失誤，指出被破壞的參考監視器特性：(1) 一個隱藏的管理員 API 讓程式不經存取檢查就能讀檔案；(2) 惡意軟件可以修補記憶體中的存取檢查程式碼；(3) 存取檢查模組有 200 萬行程式碼，沒有人能審閱。</div><details><summary>顯示答案</summary><div class="ta">(1) <b>完整</b>：並非每次存取都被調解。(2) <b>隔離</b>：它可被篡改。(3) <b>可驗證</b>：太大而無法證明正確。這就是 TCB 應該細小的原因。</div></details></div>`},
w5t3:{t:'針對加密的五類攻擊', obj:'描述它們並分類給定的攻擊。',
b:`<p>攻擊按<b>攻擊者擁有甚麼資訊</b>分類：</p>
<table class="t"><tr><th>攻擊</th><th>攻擊者擁有</th></tr>
<tr><td><b>唯密文</b></td><td>只有加密文字</td></tr>
<tr><td><b>已知明文</b></td><td>一些密文／明文<i>配對</i></td></tr>
<tr><td><b>選擇明文</b></td><td>能令自己選擇的訊息被加密</td></tr>
<tr><td><b>適應性選擇明文</b></td><td>選擇明文，並根據之前的結果調整</td></tr>
<tr><td><b>選擇密文</b></td><td>能令選定的密文被<i>解密</i></td></tr></table>
<div class="eg try"><b>試一試 · Exercises 4 Q8</b><div class="tq">分類每種攻擊：(a) 攻擊者有幾則加密訊息；(b) 攻擊者有幾則加密訊息，並知道其中一些的明文；(c) 攻擊者可以選擇訊息並令它們被加密。哪一種最可能成功？</div><details><summary>顯示答案</summary><div class="ta">(a) <b>唯密文</b>；(b) <b>已知明文</b>；(c) <b>選擇明文</b>。選擇明文最可能成功，因為攻擊者控制輸入。</div></details></div>
<p>密碼分析員的工作是利用所有可得資訊<b>縮小搜尋空間</b>（不確定性）。明文中的冗餘有助攻擊者。</p>`},
w5t4:{t:'一次性密碼本：為何完美', obj:'解釋 OTP 及其為何完美。',
b:`<p><b>完美加密：</b>知道演算法和密文<b>不會縮小搜尋空間</b>。攻擊者猜中明文的機會，有沒有密文都一樣。Shannon 證明這需要<b>至少與明文一樣多的金鑰</b>，並隨機選擇。</p>
<p><b>一次性密碼本</b>（Miller 1882；Vernam 和 Mauborgne 1917）：<b>與訊息一樣長的真正隨機金鑰</b>，與明文做 <b>XOR</b>，並<b>只用一次</b>。</p>
<p><b>為何完美：</b>對於任何截獲的密文（例如 <code>101</code>），該長度的<i>每一個</i>可能明文都能在某條金鑰下產生它。所以密文沒有告訴攻擊者任何東西。</p>
<p><b>它的問題在於實際操作：</b>它需要與明文一樣多的金鑰材料，並受<b>金鑰分發問題</b>困擾。如果你已有安全通道傳送金鑰，何不直接傳送訊息？近似做法是用共享秘密作種子的 <b>PRNG</b>，這啟發了串流加密（AES-CTR/OFB/CFB、RC4）。這些不再是完美的。</p><div class="eg"><b>例題 · 用 XOR 的一次性密碼本</b><div class="tq">訊息 <code>101</code>，金鑰 <code>110</code>（隨機、只用一次）。密文 = 101 XOR 110 = <b>011</b>。解密：011 XOR 110 = 101。（XOR：位元相同 → 0，不同 → 1。）</div></div><div class="eg try"><b>試一試 · 為何完美？</b><div class="tq">攻擊者截獲 3 位元密文 <code>011</code>，並知道用了一次性密碼本。哪些明文仍然可能？攻擊者得知了甚麼？</div><details><summary>顯示答案</summary><div class="ta"><b>全部 8 個</b>（000 至 111）。對任何猜測的明文 P，都有金鑰 K = P XOR 011 能產生它。攻擊者<b>甚麼都沒得知</b>；搜尋空間完全沒有縮小。這就是「完美」的意思。條件：金鑰必須真正隨機、與訊息一樣長、永不重用，並秘密地共享（金鑰分發問題）。</div></details></div>`},
w5t5:{t:'替換與換位：混淆與擴散', obj:'它們為何重要及達到甚麼效果。',
b:`<ul><li><b>替換</b>：每個符號被另一個取代。它帶來<b>混淆</b>：截取者無法輕易提取資訊或其與金鑰的關係。例子：AES SubBytes（8 位元查找表）。</li>
<li><b>換位</b>：符號的次序被重新排列。它帶來<b>擴散</b>：明文某部分的資訊被廣泛散佈到密文中。例子：AES 的位元組重新排列步驟。</li></ul>
<p>它們看似簡單，但幾乎所有現代對稱加密都在多<b>輪</b>中結合兩者（迭代區塊加密），以同時取得混淆和擴散。</p>
<p><b>可破解</b>：有足夠時間和資料就能還原明文（理論上暴力破解總是可行）。<b>強</b>：沒有比暴力破解快得多的攻擊。金鑰空間越大，搜尋越長；建議使用 256 位元對稱金鑰。AES：128 位元區塊、128/192/256 位元金鑰、Rijndael 演算法。</p><div class="eg try"><b>試一試 · 混淆還是擴散？</b><div class="tq">(1) AES 用查找表 (S-box) 替換每個位元組。(2) AES 把每一行的位元組移到新位置。哪個步驟帶來混淆、哪個帶來擴散？為何加密法要在多輪中同時使用兩者？</div><details><summary>顯示答案</summary><div class="ta">(1) 替換 → <b>混淆</b>：隱藏金鑰與密文的關係。(2) 換位 → <b>擴散</b>：把每個明文位元散佈到密文各處。兩者在多輪中結合，明文中的規律消失，沒有比暴力破解更好的捷徑。</div></details></div>`},
w5t6:{t:'對稱與非對稱金鑰及金鑰分發', obj:'使用哪些金鑰、是否需要金鑰交換，以及非對稱如何解決分發問題。',
b:`<table class="t"><tr><th></th><th>對稱（私密或秘密金鑰）</th><th>非對稱（公鑰）</th></tr>
<tr><td>金鑰</td><td><b>同一條</b>金鑰 K 加密和解密（K<sub>E</sub> = K<sub>D</sub>）</td><td>任何人都可用來加密的<b>公鑰 PK</b>，以及只有擁有者持有、用來解密的<b>私鑰 SK</b></td></tr>
<tr><td>需要金鑰交換？</td><td><b>需要</b>：共享秘密必須事先安全地交換</td><td><b>無需秘密交換</b>：公鑰可以公開發佈</td></tr>
<tr><td>n 個用戶的金鑰數（兩兩之間）</td><td><b>n(n−1)/2</b>，O(n²)</td><td><b>2n</b>（每人一對），O(n)</td></tr>
<tr><td>金鑰特性</td><td>隨機 k 位元字串，產生成本低</td><td>特殊結構（大質數），產生成本高</td></tr>
<tr><td>速度</td><td><b>快</b>，處理大量資料的主力</td><td>慢達約 10,000 倍</td></tr></table>
<p><b>非對稱如何解決金鑰分發：</b>要把 M 傳給 A，用 A 的公鑰加密：{M}<sub>PKA</sub>。只有持有 SK<sub>A</sub> 的人能解密。永遠不需要在通道上傳送共享秘密。（你仍需確保 PK<sub>A</sub> 真的屬於 A；這就是證書的用途。）</p>
<div class="eg try"><b>試一試 · Exercises 4 Q4–Q6</b><div class="tq">Q4：說出對稱加密勝過非對稱加密的一個優點，以及反過來的一個優點。<br>Q5：100 個用戶。如果 (a) 每個用戶有一條通往公司資料庫的獨有金鑰，(b) 每對用戶有一條獨有金鑰，各需多少條對稱金鑰？<br>Q6：Alice 和 Bob 如何用 PK<sub>A</sub>、PK<sub>B</sub>、SK<sub>A</sub>、SK<sub>B</sub> 交換機密訊息？這需要金鑰交換嗎？</div><details><summary>顯示答案</summary><div class="ta">Q4：對稱 = <b>快得多</b>、更有效率；非對稱 = <b>沒有共享秘密需要分發</b>（並可做簽署）。<br>Q5：(a) <b>100 條</b>；(b) 100×99/2 = <b>4,950 條</b>。<br>Q6：Alice 發送 {M}<sub>PKB</sub>，Bob 用 SK<sub>B</sub> 解密；Bob 以 {M′}<sub>PKA</sub> 回覆，Alice 用 SK<sub>A</sub> 解密。<b>無需秘密金鑰交換</b>；只分享公鑰。</div></details></div>
<p>注意：256 位元對稱 ≈ 2048 位元公鑰強度；金鑰長度不能直接比較。</p>`},
w5t7:{t:'密碼雜湊函數', obj:'列出並描述三個特性。',
b:`<p>雜湊用高效、確定性的演算法，把可變長度的輸入映射為簡短、固定長度的<b>訊息摘要</b>。</p>
<ol><li><b>原像抗性</b>：給定雜湊值，很難構造出具有該雜湊的文字（單向）。</li>
<li><b>弱碰撞抗性</b>（第二原像）：給定一段文字，很難在不改變其雜湊下<i>修改</i>它。</li>
<li><b>強碰撞抗性</b>：找出<i>任何</i>兩個雜湊相同的不同訊息是不可行的。</li></ol>
<p><b>雜湊保護完整性</b>，不保護機密性。它們「封存」檔案，令任何改動都顯而易見。<b>不使用金鑰。</b>使用 SHA-2 或 SHA-3。MD4、MD5 和 SHA-1 有已知碰撞，在碰撞抗性重要的地方不應使用。</p><div class="eg try"><b>試一試 · 雜湊特性</b><div class="tq">把每項配對到其特性：(1) 給定雜湊值，你找不到任何能產生它的訊息；(2) 給定一份合約，你無法造出另一份雜湊相同的合約；(3) 你找不到任何兩則雜湊相同的訊息。另外：雜湊保護 CIA 中哪一項？它們需要金鑰嗎？</div><details><summary>顯示答案</summary><div class="ta">(1) <b>原像抗性</b>。(2) <b>弱碰撞抗性</b>（第二原像）。(3) <b>強碰撞抗性</b>。雜湊保護<b>完整性</b>，<b>不需要金鑰</b>。</div></details></div>`},
w5t8:{t:'MAC、認證加密，以及各基本元件提供甚麼', obj:'MAC 的用途；AE 的兩個特點；把基本元件對應到原則和金鑰。',
b:`<p><b>訊息認證碼 (MAC)：</b>由擁有<b>預先共享秘密金鑰</b>的各方用於<b>訊息認證</b>。MAC<sub>K</sub>(M) 產生一個 n 位元標籤，沒有 K 的攻擊者無法偽造（成功率不高於約 2<sup>−n</sup>）。它提供<b>完整性 + 認證</b>（資料來自金鑰持有人）。例子：CMAC-AES、HMAC-SHA-2。</p>
<p><b>認證加密 (AE)</b> 是一種私鑰方案，有兩個特點：</p>
<ol><li>它提供<b>密文完整性</b>。</li>
<li>它的解密會<b>把任何不是由同一金鑰 K 的加密函數產生的密文視為無效並拒絕</b>。</li></ol>
<p>所以 AE = 機密性<b>加</b>完整性，而普通 AES 加密只提供機密性（Exercises 4 Q7）。例子：<b>AES-GCM</b>、AES-CCM、AES-EAX、AES-OCB。構造方法：先加密後 MAC，金鑰由 KDF 衍生。不要自創方案。</p>
<table class="t"><tr><th>基本元件</th><th>提供</th><th>金鑰？</th></tr>
<tr><td>加密 (AES)</td><td>機密性</td><td>需要</td></tr>
<tr><td>雜湊 (SHA-256)</td><td>完整性</td><td><b>不需要</b></td></tr>
<tr><td>MAC (HMAC)</td><td>完整性 + 認證</td><td>需要（共享秘密）</td></tr>
<tr><td>認證加密</td><td>機密性 + 完整性（+ 認證）</td><td>需要</td></tr>
<tr><td>數碼簽署</td><td>完整性 + 認證 + <b>不可否認性</b></td><td>需要（私鑰簽署，公鑰核實）</td></tr></table>
<div class="trap"><b>考試陷阱：</b>MAC <b>不能</b>提供不可否認性，因為雙方共享金鑰，任何一方都可能產生標籤。只有數碼簽署可以。以上全部都不提供可用性。</div><div class="eg try"><b>試一試 · 用哪個基本元件？</b><div class="tq">選對工具：(1) 證明下載的檔案完整無缺（不需要秘密）；(2) 共享秘密金鑰的兩部伺服器想偵測篡改；(3) 傳送既保密又防篡改的資料；(4) 簽署一份事後不能否認的合約。另外，Exercises 4 Q10：加密、雜湊、MAC 和簽署中，哪些需要金鑰？</div><details><summary>顯示答案</summary><div class="ta">(1) <b>雜湊</b>。(2) <b>MAC</b> (HMAC)。(3) <b>認證加密</b> (AES-GCM)。(4) <b>數碼簽署</b>。金鑰：<b>加密、MAC 和簽署</b>需要；普通<b>雜湊</b>不需要。</div></details></div>`},

/* ================= WEEK 6 ================= */
w6t1:{t:'公鑰加密與 RSA', obj:'RSA 依賴甚麼及為何安全；公鑰加密解決甚麼問題。',
b:`<p>Diffie 和 Hellman（1976）提出公鑰加密；GCHQ 較早前已秘密發展出「非秘密加密」。它要求 {{M}<sub>PK</sub>}<sub>SK</sub> = M。它建基於<b>單向函數</b>：容易計算，但沒有額外（陷門）資訊就難以反轉。</p>
<p><b>RSA</b>（Rivest-Shamir-Adleman，1970 年代末）依賴<b>質因數分解</b>的困難。兩個大質數相乘 p1 × p2 = N 很容易。對大的 N 從中找回 p1 和 p2 在計算上不可行。但如果你知道 N 和其中一個質數，另一個只是 N ÷ p，這就是陷門。</p>
<p><b>解決的問題：</b><b>金鑰分發問題</b>。從未見面的各方無需先共享秘密就能機密地通訊。它亦令<b>數碼簽署</b>和<b>金鑰衍生</b>成為可能（Diffie-Hellman 協定在公開通道上建立共享秘密）。</p>
<p>實際上公鑰密碼學慢約 10,000 倍，所以它用來交換一條對稱金鑰，由對稱加密負責加密大量資料。</p><div class="eg try"><b>試一試 · RSA</b><div class="tq">(a) RSA 的安全性依賴甚麼？(b) 為何那是安全的？(c) 如果有人知道 N 及其中一個質因數，會怎樣？(d) 公鑰加密解決甚麼問題？</div><details><summary>顯示答案</summary><div class="ta">(a) <b>質因數分解</b>的困難。(b) 兩個巨大質數相乘很容易，但對大的 N 把它分解回去在計算上不可行。(c) 他們立即得到另一個因數（N ÷ p），RSA 被破解。(d) <b>金鑰分發問題</b>：無需先交換共享秘密。它亦令簽署成為可能。</div></details></div>`},
w6t2:{t:'數碼簽署與 PKI', obj:'簽署是甚麼及其用途；PKI 的目的。',
b:`<p><b>數碼簽署：</b>Sig ← Sign<sub>SK</sub>(M)，由簽署者的<b>私鑰</b>產生（通常對 M 的雜湊簽署）。任何人都可用<b>公鑰</b>核實：Verify<sub>PK</sub>(M, Sig) = 1，而對任何 M′ ≠ M 則 = 0。</p>
<p><b>用途：</b><b>真確性</b>（來自金鑰擁有者）、<b>完整性</b>（任何改動都會令核實失敗）和<b>不可否認性</b>（只有擁有者有 SK，所以不能否認簽署過）。證書亦是用簽署建立的。</p>
<p><b>PKI（公開金鑰基建）：</b><b>建立和管理數碼證書</b>的可信系統，證書<b>核實某條公鑰屬於某個實體</b>。沒有 PKI，攻擊者可以把自己的公鑰交給你，同時聲稱是你的銀行（中間人攻擊）。</p><div class="eg try"><b>試一試 · 簽署與 PKI</b><div class="tq">Alice 簽署一份合約並發給 Bob。(a) 她用哪條金鑰簽署，Bob 用哪條核實？(b) 有效的簽署給 Bob 哪三樣東西？(c) Bob 怎知道公鑰真的屬於 Alice？</div><details><summary>顯示答案</summary><div class="ta">(a) 用 <b>Alice 的私鑰</b>簽署；Bob 用 <b>Alice 的公鑰</b>核實。(b) <b>真確性、完整性、不可否認性</b>。(c) 透過 <b>PKI</b>：由可信 CA 發出、把 Alice 的身份與她的公鑰綁定的證書。</div></details></div>`},
w6t3:{t:'Google Cloud：加密的三種狀態', obj:'描述三種狀態並舉例。',
b:`<table class="t"><tr><th>狀態</th><th>防範</th><th>例子</th></tr>
<tr><td><b>靜態</b></td><td>系統被入侵或儲存資料被盜取</td><td>磁碟和備份上的 <b>AES-256</b>（主要是 AES-GCM；AES-CBC + HMAC；AES-CTR + HMAC）、Cloud Storage、Compute Engine 磁碟快照</td></tr>
<tr><td><b>傳輸中</b></td><td>資料在各方之間傳送時被截取</td><td><b>TLS</b>（傳輸）、<b>S/MIME</b>（電郵）</td></tr>
<tr><td><b>使用中</b></td><td>伺服器運算資料時外洩</td><td><b>同態加密</b>（在加密資料上運算）</td></tr></table>
<p>靜態加密的好處：縱深防禦、「切斷」較低層（沒有金鑰，偷來的磁碟毫無用處）、透過金鑰管理執行和審計存取，工程師可以在看不到內容的情況下進行備份。</p>
<p>層次：<b>儲存系統層</b>（資料分成區塊，每塊有自己的金鑰，每次更新換新金鑰，寫入磁碟前加密，按區塊 ID 設 ACL）、<b>儲存裝置層</b>（HDD 和 SSD 上獨立的 AES-256 裝置金鑰），以及<b>備份</b>（每個檔案有自己的 DEK，由 KMS 金鑰加每檔案種子產生）。</p><div class="eg try"><b>試一試 · 哪種狀態？</b><div class="tq">把每項分類為靜態、傳輸中或使用中的加密：(1) 你的瀏覽器與 Gmail 之間的 HTTPS；(2) 以 AES-256 加密的 Compute Engine 磁碟快照；(3) 雲端伺服器在不解密下計算加密薪金的統計數字；(4) 加密的備份磁帶；(5) S/MIME 電郵。</div><details><summary>顯示答案</summary><div class="ta">(1) <b>傳輸中</b> (TLS)。(2) <b>靜態</b>。(3) <b>使用中</b>（同態加密）。(4) <b>靜態</b>。(5) <b>傳輸中</b>。</div></details></div>`},
w6t4:{t:'Google Cloud 金鑰層級與洩露應對', obj:'各層級、甚麼加密甚麼，以及金鑰被洩露時怎樣做。',
b:`<table class="t"><tr><th>層級</th><th>金鑰</th><th>加密（包裝）</th><th>存放於</th></tr>
<tr><td>1</td><td><b>DEK</b>，資料加密金鑰（AES-256，每區塊一條）</td><td>一個<b>資料區塊</b></td><td>區塊旁邊，由 KEK <i>包裝</i></td></tr>
<tr><td>2</td><td><b>KEK</b>，金鑰加密金鑰（每項服務一條或以上；遠少於 DEK）</td><td><b>DEK</b></td><td>Google <b>KMS</b>：不可匯出、每條金鑰有 ACL、每次使用都有記錄、會輪換（Cloud Storage：每 90 日，最多 20 個版本）</td></tr>
<tr><td>3</td><td><b>KMS 主金鑰</b>（AES-256）</td><td>KMS 中所有 <b>KEK</b></td><td><b>Root KMS</b>（約十來條金鑰，專用機器）</td></tr>
<tr><td>4</td><td><b>Root KMS 主金鑰</b>（AES-256）</td><td><b>Root KMS</b> 中的金鑰</td><td><b>Root KMS 主金鑰分發器</b>：點對點、只在 RAM 中、gossip 協定；備份於兩個地點實體夾萬中的硬件（少於 20 名員工可存取）</td></tr></table>
<p>鏈條：<b>區塊 ← DEK ← KEK ← KMS 主金鑰 ← Root KMS 主金鑰</b>。讀取資料：儲存系統把已包裝的 DEK 發給 KMS；KMS 檢查該服務是否可使用 KEK 並解包該 DEK，然後傳回明文 DEK；儲存系統解密區塊。</p>
<p><b>如果金鑰被洩露</b>（課堂練習；這是根據層級推出的建議答案，請與你的課堂筆記核對）：</p>
<ul><li><b>DEK</b>：只有<i>那一個區塊</i>外洩。產生新 DEK，重新加密該區塊，用 KEK 包裝新 DEK，並銷毀舊 DEK。</li>
<li><b>KEK</b>：它包裝的每條 DEK 都有風險。<b>輪換 KEK</b>（新版本），解包並以新 KEK <b>重新包裝所有受影響的 DEK</b>，停用或銷毀舊版本，檢查 KMS <b>審計記錄</b>有否被濫用，並重新加密 DEK 可能已被解包的資料。</li>
<li><b>KMS 主金鑰／根金鑰</b>：最嚴重的情況。輪換它並重新包裝其下每一條金鑰，次序為根 → 主 → KEK。限制並審計對 Root KMS 和夾萬的存取。</li>
<li>一般而言：撤銷被洩露的金鑰，透過記錄調查，並利用層級限制需要重新加密的範圍。重新包裝金鑰比重新加密所有資料便宜得多。</li></ul><div class="eg try"><b>試一試 · 金鑰層級與洩露</b><div class="tq">(a) 填寫鏈條：資料區塊 ← ___ ← ___ ← KMS 主金鑰 ← ___。(b) DEK 存放在哪裡？KEK 又存放在哪裡？(c) 攻擊者偷了 Cloud Storage 的一條 KEK。甚麼外洩了？應該怎樣做？</div><details><summary>顯示答案</summary><div class="ta">(a) 區塊 ← <b>DEK</b> ← <b>KEK</b> ← KMS 主金鑰 ← <b>Root KMS 主金鑰</b>。(b) DEK（已包裝）存放在<b>資料旁邊</b>；KEK 在 <b>KMS</b> 中，不可匯出。(c) <b>該 KEK 包裝的每條 DEK</b> 都有風險。<b>輪換 KEK</b>，以新版本<b>重新包裝所有受影響的 DEK</b>，停用或銷毀舊版本，檢視 <b>KMS 審計記錄</b>，並重新加密 DEK 可能已被解包的區塊。（這是建議答案；請與你的課堂練習核對。）</div></details></div>`},
w6t5:{t:'證書、CA 與信任鏈', obj:'定義證書；CA 的角色；信任鏈的用途。',
b:`<p><b>證書：</b>電子版的「介紹信」。它<b>把公鑰與身份綁定</b>，由擔保該綁定的核證機關 (CA) 簽署。它由<b>數碼簽署和雜湊函數</b>構成：X 為 Y 發出的證書為 <span class="lab">{Y, PK_Y, Sign_SKX(h({Y, PK_Y}))}</span>。</p>
<p><b>在公鑰加密中的用途：</b>公鑰解決了分發問題，但 A 怎知道某條金鑰真的屬於 B？證書回答了這個問題，防止攻擊者替換成自己的金鑰。任何持有 CA 公鑰可信副本的人都能檢查該綁定及其是否被改動。</p>
<p><b>核證機關 (CA)：</b><b>核實身份並簽署證書</b>的可信第三方。它的權威來自其<i>地位</i>而不是熟悉程度（線下的對應是律師公證或人事主任）。互聯網上的根 CA 包括 Verisign、SecureNet、Baltimore Technologies 和 Deutsche Telecom；香港則有香港郵政核證機關、Digi-Sign 和香港核證機關。</p>
<p><b>信任鏈：</b>Y（由 X 核證）核證 W 並附上 X 的證書，形成 W → Y → X。你可以沿簽署追溯到你已信任的<b>根 CA</b>，從而信任一個陌生方的金鑰。<b>用途：</b>信任可以擴展，因為你不需要直接認識每一方，只需一個可信的根。鏈條必須終止於一個無可置疑的根。</p>
<p><b>X.509v3 欄位：</b>版本、序號、簽署演算法 ID、發出者識別名稱、有效期、主體識別名稱、主體公鑰資訊、發出者唯一 ID、主體唯一 ID、擴充、簽署。<b>驗證方法：</b>取得發出者的公鑰，核實簽署，重新計算雜湊並比較，並檢查有效期。</p><div class="eg try"><b>試一試 · 證書與信任鏈</b><div class="tq">你的瀏覽器瀏覽 bank.hk 並收到：由「HK Intermediate CA」簽署的 bank.hk 證書，而該中繼 CA 的證書由「Root CA X」簽署。Root CA X 內置於你的瀏覽器。(a) bank.hk 的證書把甚麼綁定在一起？(b) 你的瀏覽器怎樣決定信任它？(c) CA 的角色和信任鏈的用途是甚麼？</div><details><summary>顯示答案</summary><div class="ta">(a) <b>bank.hk 這個身份</b>及其<b>公鑰</b>，由 CA 簽署。(b) 它用中繼 CA 的公鑰核實 bank.hk 的證書，用 Root CA X 的公鑰核實中繼 CA 的證書，並在可信的根停止。對每張證書，它亦重新計算雜湊並檢查有效日期。(c) CA <b>核實身份並擔保金鑰與身份的綁定</b>。信任鏈讓對<b>少數幾個根</b>的信任延伸到任何網站，無需直接認識每個網站。</div></details></div>`}
});
